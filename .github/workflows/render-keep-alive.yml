name: Render Keep-Alive

# Pings the Render free-tier container every 13 minutes via GitHub Actions
# cron schedule to prevent the 15-minute inactivity spin-down.
# Cost: $0 (uses GitHub Actions free minutes for public repos).
#
# To disable: comment out the schedule trigger below.

on:
  schedule:
    # Every 13 minutes — safely under Render's 15-min spin-down threshold
    - cron: '*/13 * * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Render health endpoint
        run: node scripts/keep-alive.cjs --once
        env:
          RENDER_URL: ${{ secrets.RENDER_URL || 'https://simplebeacon.onrender.com' }}

      - name: Verify response
        run: |
          echo "Ping completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "If this fails consistently, check Render dashboard for service status."
