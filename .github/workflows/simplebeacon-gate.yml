name: SimpleBeacon Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  simplebeacon-gate:
    name: Run SimpleBeacon Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run SimpleBeacon scan (CI)
        run: |
          mkdir -p .simplebeacon
          node packages/simplebeacon-cli/bin/simplebeacon.js scan --path . --format json --output .simplebeacon/report-ci.json --gate || true

      - name: Fail PR on blocking findings
        run: |
          node -e "const fs=require('fs'); const p='.simplebeacon/report-ci.json'; if(!fs.existsSync(p)){console.error('SimpleBeacon report not found at',p); process.exit(1);} const r=JSON.parse(fs.readFileSync(p)); const blocking=(r.gate && typeof r.gate.blockingCount!=='undefined')? r.gate.blockingCount : (r.scan_summary && typeof r.scan_summary.total_risks_found!=='undefined' ? r.scan_summary.total_risks_found : 0); if(blocking>0 || (r.gate && r.gate.pass===false)){ console.error('SimpleBeacon gate failed. blockingCount=',blocking); console.error(JSON.stringify(r.gate||r.scan_summary,null,2)); process.exit(1);} console.log('SimpleBeacon gate passed (blockingCount=',blocking,')');"
