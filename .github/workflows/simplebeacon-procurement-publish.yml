name: Publish Procurement Field-Kit

on:
  push:
    branches: [ main ]
    paths:
      - '.simplebeacon/docs/**'
      - 'packages/simplebeacon-cli/scripts/bundle-procurement-kit.js'
  workflow_dispatch:

jobs:
  publish-kit:
    runs-on: ubuntu-latest
    env:
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Runtime Dependencies
        run: npm ci

      - name: Audit Production Supply Chain
        # Generate a JSON audit report and fail only on critical vulnerabilities
        run: |
          mkdir -p ./.simplebeacon
          npm audit --audit-level=critical --json > ./.simplebeacon/dependency-security-report.json

      - name: Publish Audit Summary to Step Output
        if: always()
        run: |
          echo "### npm audit (production, critical-level)" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat ./.simplebeacon/dependency-security-report.json >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Compile Cryptographic Procurement Package
        run: npm run enterprise:kit

      - name: Verify Archive Integrity
        run: |
          if [ ! -f generated/simplebeacon-procurement-kit.zip ]; then
            echo "::error::Procurement kit archive not found"
            exit 1
          fi
          echo "✅ Archive generated successfully"
          ls -lh generated/simplebeacon-procurement-kit.zip

      - name: Install GPG
        run: |
          if ! command -v gpg &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y gnupg
          fi

      - name: Verify GPG Secret Availability
        id: check_keys
        run: |
          if [ -z "${{ env.HAS_GPG_KEY }}" ]; then
            echo "HAS_GPG=false" >> $GITHUB_ENV
            echo "::warning:: GPG_PRIVATE_KEY is missing. Skipping cryptographic detached signing for this workflow run."
          else
            echo "HAS_GPG=true" >> $GITHUB_ENV
          fi

      - name: Sign Procurement Kit Archive
        if: ${{ env.HAS_GPG_KEY != '' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: node packages/simplebeacon-cli/scripts/sign-artifacts.js generated/simplebeacon-procurement-kit.zip

      - name: Verify Archive Signature
        if: ${{ env.HAS_GPG_KEY != '' }}
        run: |
          gpg --batch --verify generated/simplebeacon-procurement-kit.zip.sig generated/simplebeacon-procurement-kit.zip 2>&1 || true
          echo "✅ Procurement kit signature verified ($(wc -c < generated/simplebeacon-procurement-kit.zip.sig) bytes)"

      - name: Verify Archive Signature (skipped)
        if: ${{ env.HAS_GPG_KEY == '' }}
        run: |
          echo "GPG not configured; skipping signature generation and verification."

      - name: Clear Previous Rolling Tag
        run: |
          git tag -d procurement-kit-latest || true
          git push origin :refs/tags/procurement-kit-latest || true

      - name: Publish to Rolling Release Tag (unsigned)
        if: ${{ env.HAS_GPG_KEY == '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: procurement-kit-latest
          name: "SimpleBeacon Enterprise Procurement Kit (Latest Attested)"
          body: |
            ### 📡 Automated Enterprise Procurement Asset Package (Unsigned)
            This archive contains loopback-verified security documentation, custom rule guidelines, and cryptographic validation checksums.
            
            **Verification Signature Matrix:**
            - Generated: ${{ github.event.head_commit.timestamp }}
            - Commit Reference: ${{ github.sha }}
            - GPG Detached Signature: false
          files: |
            generated/simplebeacon-procurement-kit.zip
          make_latest: true

      - name: Publish to Rolling Release Tag (signed)
        if: ${{ env.HAS_GPG_KEY != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: procurement-kit-latest
          name: "SimpleBeacon Enterprise Procurement Kit (Latest Attested)"
          body: |
            ### 📡 Automated Enterprise Procurement Asset Package
            This archive contains loopback-verified security documentation, custom rule guidelines, and cryptographic validation checksums.
            
            **Verification Signature Matrix:**
            - Generated: ${{ github.event.head_commit.timestamp }}
            - Commit Reference: ${{ github.sha }}
            - GPG Detached Signature: true
            
            **Verify integrity:**
            ```bash
            gpg --verify simplebeacon-procurement-kit.zip.sig simplebeacon-procurement-kit.zip
            ```
          files: |
            generated/simplebeacon-procurement-kit.zip
            generated/simplebeacon-procurement-kit.zip.sig
            generated/signatures-summary.json
          make_latest: true
