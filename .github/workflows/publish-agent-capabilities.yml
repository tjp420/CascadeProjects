name: Build and publish Agent Capabilities image

on:
  push:
    branches: [ main ]
    tags: ['v*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image (alpine)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: tools/Dockerfile.agent-capabilities
          push: true
          tags: |-
            ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_REPO }}:latest
            ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_REPO }}:latest-alpine
            ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_REPO }}:${{ github.sha }}-alpine

      - name: Build and push image (slim)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: tools/Dockerfile.agent-capabilities.slim
          push: true
          tags: |-
            ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_REPO }}:latest-slim
            ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_REPO }}:${{ github.sha }}-slim

      - name: Create manifest index for latest
        run: |
          docker buildx imagetools create --tag ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_REPO }}:latest \
            ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_REPO }}:latest-alpine \
            ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_REPO }}:latest-slim

      - name: Create manifest index for commit SHA
        run: |
          docker buildx imagetools create --tag ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_REPO }}:${{ github.sha }} \
            ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_REPO }}:${{ github.sha }}-alpine \
            ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_REPO }}:${{ github.sha }}-slim

      - name: Build and push image for Git tag (alpine)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v4
        with:
          context: .
          file: tools/Dockerfile.agent-capabilities
          push: true
          tags: |-
            ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_REPO }}:${{ github.ref_name }}-alpine

      - name: Build and push image for Git tag (slim)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v4
        with:
          context: .
          file: tools/Dockerfile.agent-capabilities.slim
          push: true
          tags: |-
            ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_REPO }}:${{ github.ref_name }}-slim

      - name: Create manifest index for Git tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker buildx imagetools create --tag ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_REPO }}:${{ github.ref_name }} \
            ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_REPO }}:${{ github.ref_name }}-alpine \
            ${{ secrets.REGISTRY_HOST }}/${{ secrets.REGISTRY_REPO }}:${{ github.ref_name }}-slim
