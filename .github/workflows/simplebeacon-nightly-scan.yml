# Nightly SimpleBeacon complete scan — detects drift that slips through PR review.
# Runs at 06:00 UTC daily. Uploads artifacts and posts summary to workflow run.
#
# To add Slack/Teams alerts:
#   1. Create a repository secret: SIMPLEBEACON_WEBHOOK_URL
#   2. Uncomment the "Alert on failure" step below.

name: SimpleBeacon Nightly Scan

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

defaults:
  run:
    working-directory: ai-platform

permissions:
  contents: read

jobs:
  nightly-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install workspace
        run: npm ci --ignore-scripts

      - name: Fetch Tree-sitter WASM grammars
        run: npm run fetch-grammars --workspace=@simplebeacon/intelligence

      - name: Run Complete Scan (offline, with Jest)
        env:
          SIMPLEBEACON_PARALLEL: '1'
          SIMPLEBEACON_PARALLEL_MIN_FILES: '48'
          SIMPLEBEACON_OFFLINE: '1'
        run: |
          node packages/simplebeacon-cli/bin/simplebeacon.js scan \
            --path . \
            --full \
            --format json \
            --output .simplebeacon/nightly-report.json \
            --gate \
            --with-jest \
            --offline \
            --verbose
          node packages/simplebeacon-cli/bin/simplebeacon.js gate status

      - name: Run File-Reduction Dry-Run
        run: |
          node packages/simplebeacon-cli/bin/simplebeacon.js reduce \
            --format json \
            --output .simplebeacon/nightly-file-reduction.json
        continue-on-error: true

      - name: Run Accuracy Tracker
        run: |
          node packages/simplebeacon-cli/bin/simplebeacon.js accuracy \
            --format json \
            --output .simplebeacon/nightly-scanner-accuracy.json
          node packages/simplebeacon-cli/bin/simplebeacon.js accuracy || true
        continue-on-error: true

      - name: Generate Marketing Content
        if: always()
        run: |
          if [ -f .simplebeacon/nightly-report.json ]; then
            node packages/simplebeacon-cli/bin/generate-marketing-content.js \
              --complete-scan .simplebeacon/nightly-report.json \
              --all \
              --output .simplebeacon/marketing-content
          fi
        continue-on-error: true

      - name: Upload nightly reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplebeacon-nightly-reports-${{ github.run_id }}
          path: |
            ai-platform/.simplebeacon/nightly-report.json
            ai-platform/.simplebeacon/nightly-file-reduction.json
            ai-platform/.simplebeacon/scanner-accuracy.json
            ai-platform/.simplebeacon/marketing-content
          if-no-files-found: ignore

      - name: Write step summary
        if: always()
        run: |
          echo "## SimpleBeacon Nightly Scan — $(date -u +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .simplebeacon/nightly-report.json ]; then
            node packages/simplebeacon-cli/bin/simplebeacon.js comment \
              --report .simplebeacon/nightly-report.json \
              --print-only >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          else
            echo "Report not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .simplebeacon/nightly-scanner-accuracy.json ]; then
            echo "### Scanner Accuracy" >> "$GITHUB_STEP_SUMMARY"
            node -e "const r=require('./.simplebeacon/nightly-scanner-accuracy.json'); console.log('Precision: '+(r.aggregate.precision*100).toFixed(1)+'%, Recall: '+(r.aggregate.recall*100).toFixed(1)+'%, F1: '+(r.aggregate.f1*100).toFixed(1)+'%'); r.fixtures.forEach(f=>console.log(f.fixtureId+': '+(f.actualFindings===0 && !f.expectedFindings ? 'PASS (0 findings)' : f.actualFindings>=f.minFindings ? 'PASS ('+f.actualFindings+' findings)' : 'FAIL ('+f.actualFindings+'/'+f.minFindings+')')));" >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          fi

      - name: Alert on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.SIMPLEBEACON_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            curl -s -X POST "$WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"🚨 SimpleBeacon nightly scan FAILED on ${{ github.repository }} — see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              || true
          fi
