name: Security Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * *'

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (repo-wide)
        uses: zricethezav/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --path=. --redact --report-format=json --report-path=artifacts/gitleaks-report.json

      - name: Upload gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: artifacts/gitleaks-report.json

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Audit ai-platform dependencies
        run: cd ai-platform && npm audit --audit-level=high

      - name: Audit coming-soon dependencies
        run: cd coming-soon && npm audit --audit-level=high

  simplebeacon-ai-platform:
    name: SimpleBeacon scan - ai-platform
    needs: [gitleaks, token-schema, npm-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}-ai
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run SimpleBeacon scan (ai-platform)
        run: |
          mkdir -p .simplebeacon || true
          npx simplebeacon scan --path ai-platform --gate --format json --output .simplebeacon/report-ai-platform.json

      - name: Upload SimpleBeacon report (ai-platform)
        uses: actions/upload-artifact@v4
        with:
          name: simplebeacon-report-ai-platform
          path: .simplebeacon/report-ai-platform.json

  simplebeacon-packages:
    name: SimpleBeacon scan - packages
    needs: [gitleaks, token-schema]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}-packages
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run SimpleBeacon scan (packages)
        run: |
          mkdir -p .simplebeacon || true
          npx simplebeacon scan --path packages --gate --format json --output .simplebeacon/report-packages.json

      - name: Upload SimpleBeacon report (packages)
        uses: actions/upload-artifact@v4
        with:
          name: simplebeacon-report-packages
          path: .simplebeacon/report-packages.json

  simplebeacon-coming-soon:
    name: SimpleBeacon scan - coming-soon
    needs: [gitleaks, token-schema]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}-coming-soon
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run SimpleBeacon scan (coming-soon)
        run: |
          mkdir -p .simplebeacon || true
          npx simplebeacon scan --path coming-soon --gate --format json --output .simplebeacon/report-coming-soon.json

      - name: Upload SimpleBeacon report (coming-soon)
        uses: actions/upload-artifact@v4
        with:
          name: simplebeacon-report-coming-soon
          path: .simplebeacon/report-coming-soon.json

  nightly-full-scan:
    name: Nightly SimpleBeacon full scan
    if: github.event_name == 'schedule'
    needs: [gitleaks, token-schema]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run SimpleBeacon full gate
        run: |
          mkdir -p .simplebeacon || true
          npx simplebeacon scan --full --gate --format json --output .simplebeacon/report.json

      - name: Upload SimpleBeacon full report
        uses: actions/upload-artifact@v4
        with:
          name: simplebeacon-report-full
          path: .simplebeacon/report.json

  token-schema:
    name: Token registry schema validation
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}-schema
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Run token registry schema test
        run: |
          node --test ai-platform/server/lib/__tests__/token-registry-schema.test.cjs


      - name: Run optimized builds
        run: |
          mkdir -p .simplebeacon || true
          npm run build:ci

      - name: Publish build benchmark summary
        if: always()
        run: |
          if [ -f .simplebeacon/build-benchmark.json ]; then
            echo 'Build benchmark JSON:'
            cat .simplebeacon/build-benchmark.json
            node -e 'const fs=require("fs");const p=".simplebeacon/build-benchmark.json";const s=process.env.GITHUB_STEP_SUMMARY; if(fs.existsSync(p)&&s){const j=JSON.parse(fs.readFileSync(p,"utf8")); fs.appendFileSync(s,"## Build benchmark\n"); fs.appendFileSync(s,"|target|duration_ms|\n"); fs.appendFileSync(s,"|---|---|\n"); j.targets.forEach(t=>fs.appendFileSync(s,`|${t.name}|${t.durationMs}|\n`)); fs.appendFileSync(s,`\nTotal: ${j.totalMs}ms\n`);}'
          fi

      - name: Run SimpleBeacon full gate
        run: |
          npx simplebeacon scan --full --gate --format json --output .simplebeacon/report.json

      - name: Publish build benchmark
        if: always()
        run: |
          if [ -f .simplebeacon/build-times.json ]; then
            echo "### Build Benchmark" >> $GITHUB_STEP_SUMMARY || true
            node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('.simplebeacon/build-times.json','utf8')); a.forEach(e=>console.log('- '+e.name+': '+e.durationMs+' ms'))" >> $GITHUB_STEP_SUMMARY || true
          else
            echo 'No build-times.json found' >> $GITHUB_STEP_SUMMARY || true
          fi

      - name: Upload build benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-times
          path: .simplebeacon/build-times.json

      - name: Upload SimpleBeacon report
        uses: actions/upload-artifact@v4
        with:
          name: simplebeacon-report
          path: .simplebeacon/report.json

  container-security:
    name: Container security (Trivy)
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build coming-soon image
        run: |
          docker build -t sb-coming-soon:pr -f coming-soon/Dockerfile coming-soon

      - name: Build ai-platform pipeline image
        run: |
          docker build -t ai-platform-pipeline:pr -f ai-platform/pipeline/Dockerfile ai-platform/pipeline

      - name: Scan coming-soon image with Trivy (SARIF)
        uses: aquasecurity/trivy-action@v0.11.0
        with:
          image-ref: sb-coming-soon:pr
          format: 'sarif'
          output: trivy-coming-soon.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload coming-soon SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-coming-soon.sarif

      - name: Scan ai-platform image with Trivy (SARIF)
        uses: aquasecurity/trivy-action@v0.11.0
        with:
          image-ref: ai-platform-pipeline:pr
          format: 'sarif'
          output: trivy-ai-platform.sarif
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload ai-platform SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-ai-platform.sarif

  redis-integration:
    name: Redis integration (onboarding rate limiter)
    needs: token-schema
    runs-on: ubuntu-latest
    timeout-minutes: 3
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Wait for Redis
        run: |
          echo "Waiting for Redis service to be healthy..."
          for i in {1..20}; do
            redis-cli -h redis ping && break || sleep 1
          done

      - name: Run Redis integration test
        run: |
          node --test ai-platform/src/api/__tests__/enterprise-onboard-redis.test.cjs

      - name: Run Redis rate-limit store integration test
        run: |
          node --test ai-platform/server/lib/__tests__/redis-rate-limit-store.test.cjs


  dashboard-watchdog:
    name: Dashboard Watchdog
    needs: [simplebeacon-ai-platform, simplebeacon-packages, simplebeacon-coming-soon]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            .vite
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}-watchdog
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Start local dashboard (background)
        run: |
          nohup node local_dashboard_server.js > dashboard.log 2>&1 &
          sleep 2

      - name: Seed mock report
        run: npm run dashboard:mock

      - name: Run watchdog
        run: |
          node scripts/verify-dashboard-health.js 2>&1 | tee watchdog.log

      - name: Upload watchdog logs
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-watchdog-logs
          path: |
            dashboard.log
            watchdog.log

      - name: Annotate PR on watchdog failure (dedupe)
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const logPath = 'watchdog.log';
            const marker = '<!-- watchdog-comment-id -->';
            let snippet = '';
            try {
              const txt = fs.readFileSync(logPath, 'utf8');
              const lines = txt.split(/\r?\n/).filter(Boolean);
              const errors = lines.filter(l => /❌|\bERROR\b|\bError\b|\bfail\b|Exception|Traceback/.test(l));
              snippet = (errors.length ? errors.slice(-25) : lines.slice(-50)).join('\n');
            } catch (e) {
              snippet = `Could not read watchdog.log: ${e.message}`;
            }
            const body = `${marker}\n### :warning: Watchdog Failure Summary\nThe dashboard watchdog reported failures. Last relevant lines:\n\n\`\`\`\n${snippet}\n\`\`\`\n\nFull logs are attached as the artifact 'dashboard-watchdog-logs'.`;

            // Find existing comment with our marker
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
