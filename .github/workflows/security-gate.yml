name: Security Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main, master ]

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (repo-wide)
        uses: zricethezav/gitleaks-action@v2
        with:
          args: --path=. --redact --report-format=json --report-path=artifacts/gitleaks-report.json

      - name: Upload gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: artifacts/gitleaks-report.json

  simplebeacon:
    name: SimpleBeacon full scan
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run SimpleBeacon full gate
        run: |
          mkdir -p .simplebeacon || true
          npx simplebeacon scan --full --gate --format json --output .simplebeacon/report.json

      - name: Upload SimpleBeacon report
        uses: actions/upload-artifact@v4
        with:
          name: simplebeacon-report
          path: .simplebeacon/report.json

  dashboard-watchdog:
    name: Dashboard Watchdog
    needs: simplebeacon
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Start local dashboard (background)
        run: |
          nohup node local_dashboard_server.js > dashboard.log 2>&1 &
          sleep 2

      - name: Seed mock report
        run: npm run dashboard:mock

      - name: Run watchdog
        run: |
          node scripts/verify-dashboard-health.js > watchdog.log 2>&1

      - name: Upload watchdog logs
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-watchdog-logs
          path: |
            dashboard.log
            watchdog.log

      - name: Annotate PR on watchdog failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const logPath = 'watchdog.log';
            let body = '';
            try {
              const txt = fs.readFileSync(logPath, 'utf8');
              const lines = txt.split(/\r?\n/).filter(Boolean);
              const errors = lines.filter(l => /❌|\bERROR\b|\bError\b|\bfail\b|Exception|Traceback/.test(l));
              const snippet = (errors.length ? errors.slice(-25) : lines.slice(-50)).join('\n');
              body = `### :warning: Watchdog Failure Summary\nThe dashboard watchdog reported failures. Last relevant lines:\n\n\`\`\`\n${snippet}\n\`\`\`\n\nFull logs are attached as the artifact \'dashboard-watchdog-logs\'.`;
            } catch (e) {
              body = `Watchdog failed but log could not be read: ${e.message}`;
            }
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
