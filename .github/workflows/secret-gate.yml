name: PR Secret Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  secret-gate:
    name: Secret Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
      node-version: '24'

    - name: Get changed files
      id: changed
      run: |
        git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1 || true
        git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD > changed.txt || true
        echo "changed_files=$(cat changed.txt | sed ':a;N;$!ba;s/\n/,/g')" >> $GITHUB_OUTPUT

    - name: Run secret scanner on changed files
      id: scan
      run: |
        FILES=$(cat changed.txt | tr '\n' ' ')
        if [ -z "$FILES" ]; then
          echo "No changed files to scan." && exit 0
        fi
        echo "Scanning files: $FILES"
        node ai-platform/server/lib/crypto/ratchet/secret-scanner.cjs $FILES > findings.txt 2>&1 || true
        if [ -s findings.txt ]; then
          echo "Found secrets:" && cat findings.txt && exit 2
        fi

    - name: Upload findings artifact
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: secret-findings-${{ github.run_id }}
        path: findings.txt

    - name: Post PR comment with findings
      if: failure()
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const findings = fs.existsSync('findings.txt') ? fs.readFileSync('findings.txt','utf8') : null;
          const files = fs.existsSync('changed.txt') ? fs.readFileSync('changed.txt','utf8') : '';
          let snippet = findings || 'None';
          const MAX = 6000;
          let truncated = false;
          if (snippet && snippet.length > MAX) { snippet = snippet.slice(0, MAX) + '\n\n... (truncated)'; truncated = true; }
          const body = `:rotating_light: **Secret Gate** detected potential secrets in this PR.\n\n**Files scanned:**\n${files || '(none)'}\n\n**Findings (snippet):**\n\n\`\`\`\n${snippet}\n\`\`\`\n\n${truncated ? 'Full findings uploaded as a workflow artifact named `secret-findings-' + process.env.GITHUB_RUN_ID + '`. Download from the Actions run.' : ''}\nPlease remove any hardcoded secrets and re-run the checks. If this is a false positive, comment \`@maintainers\` to request an override.`;
          await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.pull_request.number, body });

    - name: Fail if secrets found
      if: failure()
      run: exit 2
