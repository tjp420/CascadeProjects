name: "🛡️ Dashboard Vite Build & Asset Gate"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  verify-build:
    name: "⚙️ Verify Compilation & Asset Integrity"
    runs-on: ubuntu-latest
    steps:
      - name: "⬇️ Checkout Repository Source Tree"
        uses: actions/checkout@v4

      - name: "🟢 Initialize Node.js Execution Runtime"
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: "📦 Install Monorepo Package Dependencies"
        run: npm ci

      - name: "🛠️ Execute Chained Production Compilation Loop"
        run: npm run dashboard:build

      - name: "🔎 Optional: Run postbuild asset verification"
        run: |
          # The monorepo's postbuild task usually runs verify steps; run explicit verifier as safety.
          if [ -f "ai-platform/scripts/verify-dashboard-assets.js" ]; then
            node ai-platform/scripts/verify-dashboard-assets.js
          elif [ -f "ai-platform/web/simplebeacon-dashboard/scripts/verify-dashboard-assets.js" ]; then
            node ai-platform/web/simplebeacon-dashboard/scripts/verify-dashboard-assets.js
          else
            echo "[!] No explicit verifier found; relying on dashboard:build postbuild step."
          fi
name: Verify Dashboard Vite Build

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  verify-vite-build:
    name: Verify Vite Dashboard Build (fast)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dashboard dependencies
      run: |
        cd ai-platform/web/simplebeacon-dashboard
        npm ci

    - name: Build dashboard (Vite)
      run: |
        npm --prefix ai-platform/web/simplebeacon-dashboard run build

    - name: 🛡️ Audit Dashboard Build Assets (postbuild)
      run: |
        npm --prefix ai-platform run dashboard:postbuild

    - name: Upload build artifacts (for debug)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: dashboard-build-artifacts
        path: |
          ai-platform/web/simplebeacon-dashboard/dist/**
          ai-platform/web/simplebeacon-dashboard/node_modules/**
name: Vite Build & Export Verification Check

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'ai-platform/web/simplebeacon-dashboard/**'
      - '.github/workflows/verify-vite-build.yml'

jobs:
  build-and-smoke:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-platform/web/simplebeacon-dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ai-platform/web/simplebeacon-dashboard/package-lock.json

      - name: Install Application Dependencies
        run: npm ci

      - name: Cache Playwright Browser Drivers
        id: playwright-cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ai-platform/web/simplebeacon-dashboard/package-lock.json') }}

      - name: Provision Playwright Binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Compile Application Production Bundle
        run: npm run build

      - name: Execute Export Smoke Test Assertion
        env:
          CI: true
        run: |
          # Build a serving directory that matches the /dashboard/ base path
          mkdir -p /tmp/serve-test/dashboard
          cp index.html /tmp/serve-test/dashboard/index.html
          cp -r assets /tmp/serve-test/dashboard/assets
          # serve the production build and run the Playwright smoke test
          npx serve -s /tmp/serve-test -l 3000 &
          # give server a moment to start
          sleep 2
          set -o pipefail
          npx playwright test tests/ci/verify-build.spec.ts --project=chromium | tee build-smoke-output.txt

      - name: Broadcast Compilation Failure to Dev Channels
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.TELEMETRY_CI_SLACK_WEBHOOK }}
          TEAMS_WEBHOOK: ${{ secrets.TELEMETRY_CI_TEAMS_WEBHOOK }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="💥 *Vite Export Smoke Test Failure:* A pull request broke core asset compilation parameters or generated undefined runtime module references.\n\nSee: ${RUN_URL}"

          if [ -f build-smoke-output.txt ]; then
            SNIPPET=$(head -n 200 build-smoke-output.txt | tr -d '"' | tr -d "'" | tr '\n' ' ')
          else
            SNIPPET="(no build-smoke-output.txt present)"
          fi

          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -s -X POST -H 'Content-type: application/json' \
              --data "{\"text\": \"${MESSAGE}\n\n*Log Snippet:*\n\`\`\`${SNIPPET}\`\`\`\n\nAction required immediately: ${RUN_URL}\"}" \
              "$SLACK_WEBHOOK" || true
          fi

          if [ -n "$TEAMS_WEBHOOK" ]; then
            curl -s -X POST -H 'Content-type: application/json' \
              --data "{\"text\": \"${MESSAGE}\n\nLog Snippet:\n${SNIPPET}\n\nAction required: ${RUN_URL}\"}" \
              "$TEAMS_WEBHOOK" || true
          fi
