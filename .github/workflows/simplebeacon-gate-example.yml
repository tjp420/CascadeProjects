# SimpleBeacon PR quality gate — production paths only
#
# Copy to .github/workflows/simplebeacon.yml
# Fails the PR when critical/high findings appear in production source
# (src/, app/, lib/, server/). Test/mock/fixture alerts are reported
# but do not fail the build.

name: SimpleBeacon PR Quality

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]

jobs:
  quality:
    name: Production code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install SimpleBeacon CLI
        run: npm install --no-save simplebeacon

      - name: Scan repository
        run: npx simplebeacon scan --gate --offline --format json --output .simplebeacon/report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplebeacon-report
          path: .simplebeacon/report.json
          retention-days: 30

      - name: Fail on production-path blocking findings
        if: always()
        run: |
          node <<'EOF'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('.simplebeacon/report.json', 'utf8'));
          const QUALITY = /(^|\/)(__tests__|tests?|spec|specs|fixtures?|mocks?|testdata|test-data|molecule|testinfra|e2e|cypress|playwright)(\/|$)/i;
          const QUALITY_FILE = /\.(test|spec)\.[a-z0-9]+$/i;
          function isTest(p) {
            const rel = String(p || '').replace(/\\/g, '/');
            return QUALITY.test(rel) || QUALITY_FILE.test(rel);
          }
          const production = Array.isArray(r.rawIssues) ? r.rawIssues : [];
          const testSuite = Array.isArray(r.qualityIssues) ? r.qualityIssues : [];
          const blocking = production.filter((f) => {
            const sev = String(f.severity || '').toLowerCase();
            const path = f.filePath || f.file || '';
            if (isTest(path) || f.lane === 'quality') return false;
            return sev === 'critical' || sev === 'high';
          });
          console.log(`Production blocking: ${blocking.length}`);
          console.log(`Test-suite alerts (non-blocking): ${testSuite.length}`);
          if (blocking.length) {
            for (const f of blocking.slice(0, 20)) {
              console.error(`::error file=${f.filePath || ''}::${f.severity} ${f.type || ''} ${f.description || ''}`);
            }
            process.exit(1);
          }
          EOF
