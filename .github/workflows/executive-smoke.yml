name: Executive Smoke Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  smoke:
    name: Run executive smoke and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps (package)
        working-directory: packages/simplebeacon-cli
        run: npm ci

      - name: Run tests
        working-directory: packages/simplebeacon-cli
        run: npm test
