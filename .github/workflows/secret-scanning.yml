name: Secret Scanning Guardrail

on:
  push:
    branches: [ main ]
  pull_request:
    paths-ignore:
      - '**.md'
      - 'KICKOFF_INVITE.ics'

jobs:
  credential-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout Codebase History
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run gitleaks secret scan
      uses: zricethezav/gitleaks-action@v1
      with:
        args: detect --verbose --redact
        config-path: .gitleaks.toml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Broadcast Token Leak Failures to Dev Channels
      if: failure()
      env:
        SLACK_WEBHOOK: ${{ secrets.TELEMETRY_CI_SLACK_WEBHOOK }}
      run: |
        if [ -n "$SLACK_WEBHOOK" ]; then
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"🚨 *CRITICAL SECURITY ALERT:* A hardcoded credential, access token, or static key leak was blocked on a pull request. Review the secret scanning execution log immediately: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            $SLACK_WEBHOOK || true
        else
          echo "SLACK_WEBHOOK not set; skipping notification"
        fi
