name: Telemetry & Health Probe CI

on:
  push:
    branches: [ main, 'feature/*' ]
  pull_request:
    branches: [ main ]

jobs:
  validate-telemetry:
    name: Execute Hardened Health Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ai-platform/package.json

      - name: Install Dependencies and Run Jest
        working-directory: ai-platform
        run: |
          set -euo pipefail
          echo "Installing scoped dependencies"
          npm ci
          npm install prom-client supertest --save-dev
          echo "Checking mlkem resolution (non-fatal)"
          npm ls mlkem --depth=0 || true
          node -e "try{console.log('require.resolve mlkem ->', require.resolve('mlkem'))}catch(e){console.error('RESOLVE_ERROR', e.message)}"
          echo "Node: $(node -v), npm: $(npm -v)"
          echo "Listing local binaries"
          ls -la node_modules/.bin || true
          echo "Ensuring test-results dir"
          mkdir -p test-results
          echo "Running jest via local binary"
          ./node_modules/.bin/jest --config=jest.config.ci.cjs --rootDir=. --runInBand --json --outputFile=./test-results/jest-results.json || true

      - name: Parse Jest JSON to telemetry
        run: |
          node ai-platform/tools/ci-telemetry/parse-jest-results.cjs ai-platform/test-results/jest-results.json ai-platform/test-results/

      - name: Debug: list test-results
        run: |
          echo "test-results listing:"
          ls -la ai-platform/test-results || true
          echo "ci-test-summary.json:"
          cat ai-platform/test-results/ci-test-summary.json || true
          echo "ci-test-metrics.prom:"
          cat ai-platform/test-results/ci-test-metrics.prom || true

      - name: Upload CI test metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-metrics
          path: ai-platform/test-results/**
          retention-days: 7

      - name: Post PR telemetry delta (only on PRs)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          CI_TELEMETRY_REGRESSION_PERCENT: '10'
          CI_TELEMETRY_REGRESSION_MS: '2000'
        run: |
          node ai-platform/tools/ci-telemetry/report-pr-delta.cjs

  compile-staging:
    name: Execute Staging Build Compression
    needs: validate-telemetry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Compile and Bundle Production Assets
        working-directory: ai-platform
        run: |
          npm ci
          npm run build --if-present
