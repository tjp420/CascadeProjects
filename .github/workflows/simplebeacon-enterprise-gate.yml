# Enterprise guardrail — SB-ENT-001/002, credentials, structural intent (intelligence.enabled).
# Config: ai-platform/.simplebeacon/config.json (profile: enterprise)

name: Simplebeacon Enterprise Guardrail

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'ai-platform/**'
      - '.github/workflows/simplebeacon-enterprise-gate.yml'
  push:
    branches: [main, master]
    paths:
      - 'ai-platform/**'
      - '.github/workflows/simplebeacon-enterprise-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  enterprise-guardrail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install workspace (monorepo lockfile)
        run: npm ci --ignore-scripts

      - name: Fetch Tree-sitter WASM grammars
        run: npm run fetch-grammars --workspace=@simplebeacon/intelligence

      - name: Run enterprise guardrail gate (offline, parallel)
        env:
          SIMPLEBEACON_PARALLEL: '1'
          SIMPLEBEACON_PARALLEL_MIN_FILES: '48'
          SIMPLEBEACON_OFFLINE: '1'
        run: |
          node packages/simplebeacon-cli/bin/simplebeacon.js scan \
            --path ai-platform \
            --format json \
            --output ai-platform/.simplebeacon/report.json \
            --anonymize \
            --gate \
            --offline \
            --verbose
          node packages/simplebeacon-cli/bin/simplebeacon.js gate status

      - name: Post PR gate summary
        if: github.event_name == 'pull_request' && always()
        run: |
          TITLE="SimpleBeacon enterprise gate"
          if [ "${{ job.status }}" != "success" ]; then
            TITLE="SimpleBeacon enterprise gate failed"
          fi
          echo "## ${TITLE}" >> "$GITHUB_STEP_SUMMARY"
          node packages/simplebeacon-cli/bin/simplebeacon.js comment \
            --report ai-platform/.simplebeacon/report.json --print-only >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "**💡 Stale compliance on every push?** Upgrade to [Continuous Shield](https://simplebeacon.ai/pricing) ($149/mo) for automated PR blocking + 3 compliance certifications per month." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplebeacon-enterprise-report
          path: ai-platform/.simplebeacon/report.json
          if-no-files-found: ignore
