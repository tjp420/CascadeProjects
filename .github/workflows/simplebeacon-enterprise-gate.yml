# Enterprise guardrail — SB-ENT-001 (data leak) + SB-ENT-002 (token cap), credentials.
# Config: ai-platform/.simplebeacon/config.json (profile: enterprise)

name: Simplebeacon Enterprise Guardrail

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'ai-platform/**'
      - '.github/workflows/simplebeacon-enterprise-gate.yml'
  push:
    branches: [main, master]
    paths:
      - 'ai-platform/**'
      - '.github/workflows/simplebeacon-enterprise-gate.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: ai-platform

permissions:
  contents: read
  pull-requests: write

jobs:
  enterprise-guardrail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SimpleBeacon CLI dependencies
        working-directory: ai-platform/packages/simplebeacon-cli
        run: npm install --ignore-scripts

      - name: Run enterprise guardrail gate (offline, parallel)
        env:
          SIMPLEBEACON_PARALLEL: '1'
          SIMPLEBEACON_PARALLEL_MIN_FILES: '48'
          SIMPLEBEACON_OFFLINE: '1'
        run: |
          node packages/simplebeacon-cli/bin/simplebeacon.js scan \
            --path . \
            --format json \
            --output .simplebeacon/report.json \
            --gate \
            --offline \
            --verbose
          node packages/simplebeacon-cli/bin/simplebeacon.js gate status

      - name: Post PR gate summary
        if: github.event_name == 'pull_request' && always()
        run: |
          TITLE="SimpleBeacon enterprise gate"
          if [ "${{ job.status }}" != "success" ]; then
            TITLE="SimpleBeacon enterprise gate failed"
          fi
          echo "## ${TITLE}" >> "$GITHUB_STEP_SUMMARY"
          node packages/simplebeacon-cli/bin/simplebeacon.js comment \
            --report .simplebeacon/report.json --print-only >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplebeacon-enterprise-report
          path: ai-platform/.simplebeacon/report.json
          if-no-files-found: ignore
