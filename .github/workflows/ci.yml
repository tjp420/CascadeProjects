name: SimpleBeacon Monorepo CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    name: Build & Quality Gates
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        environment-profile: [clean, testing-fixtures]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Verify Monorepo Build
        run: npm run build

      - name: Run Global Code Quality Check
        run: npm run quality:check

      - name: Validate Local Extension Compilation
        run: |
          cd simplebeacon-vscode-merged
          npm run compile --if-present

      - name: Stress Test CLI Distribution Package
        run: |
          cd packages/simplebeacon-cli
          npm pack --dry-run
