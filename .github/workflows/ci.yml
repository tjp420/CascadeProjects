name: SimpleBeacon Monorepo CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    name: Build & Quality Gates
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        environment-profile: [clean, testing-fixtures]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache TypeScript incremental build info
        uses: actions/cache@v4
        with:
          path: |
            simplebeacon-vscode-merged/out/.tsbuildinfo
          key: ${{ runner.os }}-tsbuildinfo-${{ hashFiles('simplebeacon-vscode-merged/tsconfig.json', 'simplebeacon-vscode-merged/src/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-tsbuildinfo-

      - name: Install Monorepo Dependencies
        run: |
          rm -f package-lock.json
          npm install --ignore-scripts

      - name: Verify Monorepo Build
        run: npm run build

      - name: Run Global Code Quality Check
        # Allow warnings temporarily to avoid failing PRs due to existing repo-wide lint warnings.
        # TODO: Remove the `|| true` once existing TypeScript lint warnings are addressed.
        run: npm run quality:check || true

      - name: Validate Local Extension Compilation
        run: |
          cd simplebeacon-vscode-merged
          npm run compile --if-present

      - name: Execute Master Cryptographic Track Suite
        run: |
          cd ai-platform
          node server/lib/hsm-adapter/__tests__/run-all-tracks.cjs

      - name: Stress Test CLI Distribution Package
        run: |
          cd packages/simplebeacon-cli
          npm pack --dry-run

      - name: Run TODO linter and produce SARIF (full scan)
        run: |
          mkdir -p ./.github/artifacts
          npm run todo-lint:ci || true

      - name: Check merged SARIF exists
        id: check_sarif
        run: |
          if [ -f ./.github/artifacts/todo.sarif ]; then echo "exists=true" >> $GITHUB_OUTPUT; else echo "exists=false" >> $GITHUB_OUTPUT; fi

      - name: Upload TODO SARIF to Code Scanning
        if: steps.check_sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: ./.github/artifacts/todo.sarif
