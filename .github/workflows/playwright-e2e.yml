name: Playwright E2E UI Smoke Tests

on:
  push:
    branches: [main]
    paths:
      - 'ai-platform/web/simplebeacon-dashboard/**'
      - '.github/workflows/playwright-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai-platform/web/simplebeacon-dashboard/**'
  schedule:
    - cron: '0 0 * * *' # nightly at 00:00 UTC

jobs:
  run-e2e-tests:
    runs-on: ubuntu-latest
    # Job-level budget: cold Playwright install + apt deps can exceed 10m on cache miss.
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Create playwright-report placeholder
        run: |
          mkdir -p ai-platform/web/simplebeacon-dashboard/playwright-report
          echo "ci started at $(date -u)" > ai-platform/web/simplebeacon-dashboard/playwright-report/ci-started.txt

      - name: Upload early diagnostics placeholder
        uses: actions/upload-artifact@v4
        with:
          name: early-playwright-report
          path: ai-platform/web/simplebeacon-dashboard/playwright-report/ci-started.txt
          retention-days: 7

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ai-platform/web/simplebeacon-dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        run: npm ci || npm install --no-audit --no-fund --legacy-peer-deps
        working-directory: ai-platform/web/simplebeacon-dashboard

      - name: Install Playwright Test Runner
        run: npm install -D @playwright/test start-server-and-test
        working-directory: ai-platform/web/simplebeacon-dashboard

      - name: Cache Playwright Browser Binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ai-platform/web/simplebeacon-dashboard/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Headless Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
        working-directory: ai-platform/web/simplebeacon-dashboard

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: ai-platform/web/simplebeacon-dashboard

      - name: Start lightweight mock API server (for CI)
        working-directory: ai-platform/web/simplebeacon-dashboard
        run: |
          node -e "const http=require('http');const port=53900;const server=http.createServer((req,res)=>{try{if(req.url==='/api/health'){res.writeHead(200,{'Content-Type':'application/json'});return res.end(JSON.stringify({ok:true,env:'mock'}));}if(req.url.startsWith('/api/config')){res.writeHead(200,{'Content-Type':'application/json'});return res.end(JSON.stringify({pricing:[],features:{}}));}if(req.url.startsWith('/api/')){res.writeHead(200,{'Content-Type':'application/json'});return res.end(JSON.stringify({mock:true,path:req.url}));}res.writeHead(404,{'Content-Type':'text/plain'});res.end('not found');}catch(e){console.error('mock-api error',e);res.writeHead(500);res.end('error');}});server.listen(port,'127.0.0.1',()=>console.log('Mock API listening on',port));setInterval(()=>{},1e6)" > mock-api.log 2>&1 &
          echo $! > mock-api.pid

      - name: Run E2E Test Suite
        run: |
          # Build static assets and start a lightweight in-repo static server (SPA fallback)
          echo "cwd:" && pwd && echo "ls root:" && ls -la || true
          echo "--- package.json preview ---" && sed -n '1,120p' package.json || true
          npm run build || (echo "npm run build exited $?"; ls -la || true; exit 1)

          # 💾 Guarantee index.html presence in the server outDir to prevent ENOENT races
          if [ -d assets ] && [ ! -f assets/index.html ] && [ -f index.html ]; then
            echo "📋 Copying project root index.html -> assets/index.html for static server"
            cp index.html assets/index.html
          fi

          # Diagnostics: list dist contents and show a short preview of index.html
          echo "--- dist listing ---" && ls -la dist || true
          echo "--- index.html preview (first 40 lines) ---" && head -n 40 dist/index.html || true
          # Start the CI static server script (uses dist/ and serves index.html for SPA routes)
          node scripts/ci-static-server.cjs > serve.log 2>&1 &
          echo $! > serve.pid

          # Poll the server with an explicit GET for index.html (follow redirects, wait up to 60s)
          status=000
          for i in $(seq 1 60); do
            # Follow redirects (-L) because some static servers return 301 -> /index.html/
            status=$(curl -s -L -o /dev/null -w "%{http_code}" http://localhost:61455/index.html || true)
            echo "health-check $i -> $status"
            if [ "$status" = "200" ]; then
              echo "Server ready"
              break
            fi
            sleep 1
          done

          if [ "$status" != "200" ]; then
            echo "Server failed to become ready; dumping serve.log" >&2
            tail -n 200 serve.log || true
            exit 1
          fi

          # Run Playwright tests
          npx playwright test --config=e2e-playwright.config.ts e2e/smoke.spec.ts --reporter=html
        working-directory: ai-platform/web/simplebeacon-dashboard
        env:
          NODE_ENV: test
          CI: 'true'
          TOKEN_ACCOUNT_SIGNING_KEY: ${{ secrets.TOKEN_ACCOUNT_SIGNING_KEY || 'test-signing-key-placeholder-32-chars-long!' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-jwt-secret-placeholder-value-32-chars!' }}

      - name: Collect server logs for artifacts
        working-directory: ai-platform/web/simplebeacon-dashboard
        run: |
          mkdir -p playwright-report || true
          if [ -f dev.log ]; then cp dev.log playwright-report/dev.log; fi
          if [ -f mock-api.log ]; then cp mock-api.log playwright-report/mock-api.log; fi
          if [ -f serve.log ]; then cp serve.log playwright-report/serve.log; fi

          echo "report placeholder" > playwright-report/README.txt

      - name: Upload test-results (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ai-platform/web/simplebeacon-dashboard/test-results/
          retention-days: 7

      - name: Archive Playwright Test Traces on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-report
          path: ai-platform/web/simplebeacon-dashboard/playwright-report/
          retention-days: 30

      - name: Upload test-results diagnostics on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            ai-platform/web/simplebeacon-dashboard/test-results/
            ai-platform/web/simplebeacon-dashboard/serve.log
            ai-platform/web/simplebeacon-dashboard/mock-api.log
            ai-platform/web/simplebeacon-dashboard/dev.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload playwright-report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-always
          path: ai-platform/web/simplebeacon-dashboard/playwright-report/
          retention-days: 7
