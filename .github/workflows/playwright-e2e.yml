name: Playwright E2E UI Smoke Tests

on:
  push:
    branches: [main]
    paths:
      - 'ai-platform/web/simplebeacon-dashboard/**'
      - '.github/workflows/playwright-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai-platform/web/simplebeacon-dashboard/**'
  schedule:
    - cron: '0 0 * * *' # nightly at 00:00 UTC

jobs:
  run-e2e-tests:
    runs-on: ubuntu-latest
    # Job-level budget: cold Playwright install + apt deps can exceed 10m on cache miss.
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ai-platform/web/simplebeacon-dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        run: npm ci
        working-directory: ai-platform/web/simplebeacon-dashboard

      - name: Install Playwright Test Runner
        run: npm install -D @playwright/test start-server-and-test
        working-directory: ai-platform/web/simplebeacon-dashboard

      - name: Cache Playwright Browser Binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ai-platform/web/simplebeacon-dashboard/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Headless Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
        working-directory: ai-platform/web/simplebeacon-dashboard

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: ai-platform/web/simplebeacon-dashboard

      - name: Start lightweight mock API server (for CI)
        working-directory: ai-platform/web/simplebeacon-dashboard
        run: |
          cat > tmp-mock-api.js <<'NODE'
          const http = require('http');
          const port = 53900;
          const server = http.createServer((req, res) => {
            if (req.url === '/api/health') {
              res.writeHead(200, {'Content-Type':'application/json'});
              return res.end(JSON.stringify({ok:true,env:'mock'}));
            }
            // Minimal responses for expected config endpoints
            if (req.url.startsWith('/api/config')) {
              res.writeHead(200, {'Content-Type':'application/json'});
              return res.end(JSON.stringify({pricing:[],features:{}}));
            }
            // Default 200 JSON for any /api/* path
            if (req.url.startsWith('/api/')) {
              res.writeHead(200, {'Content-Type':'application/json'});
              return res.end(JSON.stringify({mock:true,path:req.url}));
            }
            // Fallback: 404
            res.writeHead(404, {'Content-Type':'text/plain'});
            res.end('not found');
          });
          server.listen(port, '127.0.0.1', () => console.log('Mock API listening on', port));
          // Keep process alive
NODE
          nohup node tmp-mock-api.js > mock-api.log 2>&1 &
          echo $! > mock-api.pid

      - name: Start dashboard server in background and wait for /api/health
        working-directory: ai-platform/web/simplebeacon-dashboard
        run: |
          # Start the dev server in the background and capture its PID so we can leave it running for the test steps
          nohup npm run dev > dev.log 2>&1 &
          echo $! > server.pid

          # Wait up to 120s for the backend health endpoint to respond
          for i in $(seq 1 120); do
            if curl -sS http://localhost:61455/api/health >/dev/null 2>&1; then
              echo "backend health OK"
              break
            fi
            sleep 1
          done

          if ! curl -sS http://localhost:61455/api/health >/dev/null 2>&1; then
            echo "Timed out waiting for backend /api/health" >&2
            cat dev.log || true
            cat mock-api.log || true
            exit 1
          fi

      - name: Collect server logs for artifacts
        working-directory: ai-platform/web/simplebeacon-dashboard
        run: |
          mkdir -p playwright-report || true
          if [ -f dev.log ]; then cp dev.log playwright-report/dev.log; fi
          if [ -f mock-api.log ]; then cp mock-api.log playwright-report/mock-api.log; fi
          # Ensure the report dir has a placeholder file so upload-artifact always finds something
          echo "report placeholder" > playwright-report/README.txt

      - name: Wait for frontend sign-in input to be present (Playwright)
        working-directory: ai-platform/web/simplebeacon-dashboard
        env:
          CI: 'true'
        run: |
          node -e "(async()=>{const fs=require('fs'); const { chromium } = require('playwright'); const timeout=300000; const start=Date.now(); const browser=await chromium.launch(); const page=await browser.newPage(); const reportDir='playwright-report'; try{fs.mkdirSync(reportDir,{recursive:true})}catch(e){} const consoleLogPath = reportDir + '/browser-console.log'; page.on('console', msg=>{ try{ fs.appendFileSync(consoleLogPath, `[${new Date().toISOString()}] ${msg.type()}: ${msg.text()}\n`) } catch(e){} }); const url='http://localhost:61455/dashboard/?sb_force_signin=1#/signin'; while(Date.now()-start < timeout){ try{ await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 20000 }); const email = page.locator('input[type=\\"email\\"]'); if (await email.count() && await email.first().isVisible()) { console.log('Sign-in input ready'); await browser.close(); process.exit(0); } } catch(e){ try{ fs.appendFileSync(consoleLogPath, `[${new Date().toISOString()}] navigation error: ${String(e)}\n`) } catch(e){} } await new Promise(r=>setTimeout(r,2000)); } console.error('Timeout waiting for sign-in input'); try{ if (fs.existsSync('dev.log')){ fs.copyFileSync('dev.log', reportDir + '/dev.log'); console.log('Copied dev.log to ' + reportDir + '/dev.log'); } }catch(e){} try{ await page.screenshot({ path: reportDir + '/readiness-screenshot.png', fullPage: true }); }catch(e){} try{ const html = await page.content(); fs.writeFileSync(reportDir + '/readiness.html', html); }catch(e){} try{ if (fs.existsSync(consoleLogPath)){ console.log('=== browser console tail ==='); const tail = fs.readFileSync(consoleLogPath,'utf8').split('\n').slice(-200).join('\n'); console.log(tail); } }catch(e){} await browser.close(); process.exit(1); })()"

      - name: Run E2E Test Suite
        run: npx playwright test --config=e2e-playwright.config.ts e2e/smoke.spec.ts --reporter=html
        working-directory: ai-platform/web/simplebeacon-dashboard
        env:
          NODE_ENV: 'test'
          CI: 'true'
          TOKEN_ACCOUNT_SIGNING_KEY: ${{ secrets.TOKEN_ACCOUNT_SIGNING_KEY || 'test-signing-key-placeholder-32-chars-long!' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-jwt-secret-placeholder-value-32-chars!' }}

      - name: Archive Playwright Test Traces on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-report
          path: ai-platform/web/simplebeacon-dashboard/playwright-report/
          retention-days: 30
