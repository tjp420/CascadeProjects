name: Frontend Performance Audit (LHCI)

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'ai-platform/web/simplebeacon-dashboard/**'
      - '.github/workflows/lighthouse.yml'
  workflow_dispatch:

jobs:
  lighthouse-audit:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-platform/web/simplebeacon-dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ai-platform/web/simplebeacon-dashboard/package-lock.json

      - name: Install Application Dependencies
        run: npm ci

      - name: Install Lighthouse CI CLI Tooling
        run: npm install -g @lhci/cli@0.13.x

      - name: Compile Application Production Bundle
        run: npm run build

      - name: Prepare Lighthouse serving directory
        run: |
          mkdir -p lighthouse-dist/dashboard
          cp index.html lighthouse-dist/dashboard/index.html
          cp -r assets lighthouse-dist/dashboard/assets
          printf '%s\n' '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=/dashboard/"></head><body></body></html>' > lighthouse-dist/index.html

      - name: Debug - verify built CSS contains fixes
        run: |
          echo "=== Checking for --text-muted value in built CSS ==="
          grep -o '\-\-text-muted: #[0-9A-Fa-f]*' assets/main.css | head -5 || echo "Not found in main.css"
          echo "=== Checking index.html for static link tag ==="
          grep -o '<link[^>]*stylesheet[^>]*>' index.html | head -5 || echo "No static link tag found"
          echo "=== Checking for aria-label in built JS ==="
          grep -c 'aria-label' assets/main.js || echo "No aria-label found"

      - name: Execute Performance Audit and Budget Assertions
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          # Run LHCI against the prepared serving directory
          lhci autorun --config=.lighthouserc.cjs

      - name: Print failing accessibility audits
        if: always()
        run: |
          ls -la .lighthouseci/ 2>/dev/null || echo "No .lighthouseci directory"
          for f in .lighthouseci/lhr-*.json; do
            if [ -f "$f" ]; then
              echo "=== $f ==="
              node -e "const r=require('./$f'); console.log('A11y:', r.categories.accessibility.score); for(const ref of r.categories.accessibility.auditRefs){const a=r.audits[ref.id]; if(a&&a.score!==null&&a.score<1){console.log('FAIL:',ref.id,'(score='+a.score+')',a.title); if(a.details&&a.details.items){for(const i of a.details.items.slice(0,3)){console.log('  -',JSON.stringify(i).slice(0,300))}}}}"
              break
            fi
          done

      - name: Upload Lighthouse CI Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-ci-results
          path: ai-platform/web/simplebeacon-dashboard/.lighthouseci/
          retention-days: 7
          if-no-files-found: warn
