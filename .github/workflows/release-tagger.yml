name: Automated Semantic Release Tagger

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Initialize Git Identity
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Determine Semantic Version Bump
      id: bump-calculation
      shell: bash
      run: |
        set -euo pipefail
        # Fetch latest tag, fallback to v1.0.0
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
        echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV

        VERSION_RAW=${LATEST_TAG#v}
        MAJOR=$(echo "$VERSION_RAW" | cut -d. -f1)
        MINOR=$(echo "$VERSION_RAW" | cut -d. -f2)
        PATCH=$(echo "$VERSION_RAW" | cut -d. -f3)

        # Use the most-recent merge commit message to decide bump
        LAST_COMMIT_MSG=$(git log -1 --pretty=%B)

        if [[ "$LAST_COMMIT_MSG" == *"breaking:"* || "$LAST_COMMIT_MSG" == *"BREAKING:"* || "$LAST_COMMIT_MSG" == *"MAJOR:"* ]]; then
          echo "Detected breaking change marker; incrementing MAJOR"
          MAJOR=$((MAJOR + 1))
          MINOR=0
          PATCH=0
        elif [[ "$LAST_COMMIT_MSG" == *"feat:"* || "$LAST_COMMIT_MSG" == *"feature:"* ]]; then
          echo "Detected feature marker; incrementing MINOR"
          MINOR=$((MINOR + 1))
          PATCH=0
        else
          echo "Defaulting to patch bump"
          PATCH=$((PATCH + 1))
        fi

        NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
        echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
        echo "Calculated target release pointer: $NEW_TAG"

    - name: Push Semantic Version Git Tag
      run: |
        git tag "$NEW_TAG"
        git push origin "$NEW_TAG"

    - name: Generate Declarative GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.NEW_TAG }}
        release_name: Release ${{ env.NEW_TAG }}
        body: |
          ## 🚀 Automated Release Notes: ${{ env.NEW_TAG }}

          This release was generated automatically by the delivery pipeline.

          **Previous baseline:** ${{ env.LATEST_TAG }}
          **Commit:** ${{ github.sha }}

          _Auto-generated by the SimpleBeacon release tagger._
        draft: false
        prerelease: false

    - name: Broadcast Release Launch to Dev Channels
      if: success()
      env:
        SLACK_WEBHOOK: ${{ secrets.TELEMETRY_CI_SLACK_WEBHOOK }}
      run: |
        if [ -n "$SLACK_WEBHOOK" ]; then
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"🚀 *Release:* New tag *${{ env.NEW_TAG }}* created for ${{ github.repository }}. See: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.NEW_TAG }}\"}" \
            "$SLACK_WEBHOOK" || true
        fi
