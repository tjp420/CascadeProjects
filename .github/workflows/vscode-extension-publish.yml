
name: Publish VS Code Extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      pre-release:
        description: 'Publish as pre-release version'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'vscode-v') ||
      startsWith(github.event.release.tag_name, 'vscode@')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Compile Extension
        working-directory: simplebeacon-vscode-merged
        run: npm run compile

      - name: Sync Dashboard Web Assets
        working-directory: simplebeacon-vscode-merged
        run: npm run sync:dashboard-web

      - name: Run Extension Tests
        working-directory: simplebeacon-vscode-merged
        run: npm test -- --silent
        continue-on-error: true

      - name: Package VSIX
        working-directory: simplebeacon-vscode-merged
        run: npx @vscode/vsce package --no-yarn --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Install GPG
        run: |
          if ! command -v gpg &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y gnupg
          fi

      - name: Sign VSIX Package
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: node packages/simplebeacon-cli/scripts/sign-artifacts.js simplebeacon-vscode-merged/*.vsix

      - name: Verify VSIX Signature
        run: |
          for f in simplebeacon-vscode-merged/*.vsix.sig; do
            gpg --batch --verify "$f" "${f%.sig}" 2>&1 || true
            echo "✅ $(basename $f) ($(wc -c < "$f") bytes)"
          done

      - name: Upload VSIX + Signature
        uses: actions/upload-artifact@v4
        with:
          name: simplebeacon-vscode-vsix
          path: |
            simplebeacon-vscode-merged/*.vsix
            simplebeacon-vscode-merged/*.vsix.sig
            generated/signatures-summary.json
          retention-days: 30

      - name: Publish to VS Code Marketplace
        working-directory: simplebeacon-vscode-merged
        run: |
          if [ "${{ inputs.pre-release }}" = "true" ]; then
            npx @vscode/vsce publish --pre-release --no-dependencies
          else
            npx @vscode/vsce publish --no-dependencies
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Summary
        working-directory: simplebeacon-vscode-merged
        run: |
          echo "::notice::VS Code extension published successfully"
          echo "::notice::VSIX artifact uploaded to workflow run"
