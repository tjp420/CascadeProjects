# Opt-in AI hygiene gate (token bleed, architecture drift, Python + JS AST).
# Config: ai-platform/.simplebeacon/config.json — enable the four opt-in rules there.
# GitHub only loads workflows from the repository root (.github/workflows/), not ai-platform/.github/.

name: SimpleBeacon AI Hygiene Gate

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'ai-platform/**'
      - '.github/workflows/simplebeacon-ai-hygiene-gate.yml'
  push:
    branches: [main, master]
    paths:
      - 'ai-platform/**'
      - '.github/workflows/simplebeacon-ai-hygiene-gate.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: ai-platform

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-hygiene-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python (AST sidecar)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SimpleBeacon CLI dependencies
        working-directory: ai-platform/packages/simplebeacon-cli
        run: npm install --ignore-scripts

      - name: Run SimpleBeacon AI hygiene gate (offline, parallel)
        env:
          SIMPLEBEACON_PARALLEL: '1'
          SIMPLEBEACON_PARALLEL_MIN_FILES: '48'
        run: |
          node packages/simplebeacon-cli/bin/simplebeacon.js scan \
            --path . \
            --format json \
            --output .simplebeacon/report.json \
            --gate \
            --offline \
            --verbose
          node packages/simplebeacon-cli/bin/simplebeacon.js gate status

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplebeacon-ai-hygiene-report
          path: ai-platform/.simplebeacon/report.json
          if-no-files-found: ignore
