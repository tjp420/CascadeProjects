name: Track 10 Crypto Validation

on:
  push:
    branches: [ feature/track10-aes-kw ]
  pull_request:
    branches: [ main, master ]

jobs:
  crypto-harness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run SoftHSM Test Harness
        run: |
          docker compose -f docker-compose.crypto-test.yml up --build --abort-on-container-exit

      - name: Cleanup Containers
        if: always()
        run: |
          docker compose -f docker-compose.crypto-test.yml down -v
