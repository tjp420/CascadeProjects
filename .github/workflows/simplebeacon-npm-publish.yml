# Publish simplebeacon CLI to npm from the CascadeProjects monorepo.
# Package path: packages/simplebeacon-cli (npm name: simplebeacon)
#
# Triggers:
#   - GitHub Release with tag simplebeacon-v* (e.g. simplebeacon-v1.0.1)
#   - workflow_dispatch (manual)
#
# Secrets: NPM_TOKEN — granular token with publish + bypass 2FA

name: Publish simplebeacon to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      otp:
        description: '6-digit npm 2FA code (only if NPM_TOKEN lacks bypass-2fa)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'simplebeacon-') ||
      startsWith(github.event.release.tag_name, 'simplebeacon@')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Test CLI package
        working-directory: packages/simplebeacon-cli
        run: |
          npm test
          npm run pack:check
          node bin/simplebeacon-mcp.js --smoke-test

      - name: Publish to npm
        working-directory: packages/simplebeacon-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_OTP: ${{ inputs.otp }}
        run: npm publish --access public

      - name: Pack Tarball for Signing
        working-directory: packages/simplebeacon-cli
        run: npm pack

      - name: Install GPG
        run: |
          if ! command -v gpg &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y gnupg
          fi

      - name: Sign Package Tarball
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: node packages/simplebeacon-cli/scripts/sign-artifacts.js packages/simplebeacon-cli/*.tgz

      - name: Verify Signature
        run: |
          for f in packages/simplebeacon-cli/*.tgz.sig; do
            gpg --batch --verify "$f" "${f%.sig}" 2>&1 || true
            echo "✅ $(basename $f) ($(wc -c < "$f") bytes)"
          done

      - name: Upload Tarball + Signature
        uses: actions/upload-artifact@v4
        with:
          name: simplebeacon-npm-package
          path: |
            packages/simplebeacon-cli/*.tgz
            packages/simplebeacon-cli/*.tgz.sig
            generated/signatures-summary.json
          retention-days: 90
