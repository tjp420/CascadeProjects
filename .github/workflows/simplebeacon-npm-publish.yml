# Publish simplebeacon CLI to npm from the CascadeProjects monorepo.
# Package path: packages/simplebeacon-cli (npm name: simplebeacon)
#
# Triggers:
#   - GitHub Release with tag simplebeacon-v* (e.g. simplebeacon-v1.0.1)
#   - workflow_dispatch (manual)
#
# Secrets: NPM_TOKEN — granular token with publish + bypass 2FA

name: Publish simplebeacon to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      otp:
        description: '6-digit npm 2FA code (only if NPM_TOKEN lacks bypass-2fa)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'simplebeacon-') ||
      startsWith(github.event.release.tag_name, 'simplebeacon@')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Test CLI package
        working-directory: packages/simplebeacon-cli
        run: |
          npm test
          npm run pack:check
          node bin/simplebeacon-mcp.js --smoke-test

      - name: Publish to npm
        working-directory: packages/simplebeacon-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_OTP: ${{ inputs.otp }}
        run: npm publish --access public
