# Publish simplebeacon CLI to npm from the CascadeProjects monorepo.
# Package path: packages/simplebeacon-cli (npm name: simplebeacon)
#
# Triggers:
#   - GitHub Release with tag simplebeacon-v* (e.g. simplebeacon-v1.0.1)
#   - workflow_dispatch (manual)
#
# Secrets: NPM_TOKEN — granular token with publish + bypass 2FA

# DISABLED — Replaced by unified-release.yml (2026-08-07)
# This workflow was redundant with unified-release.yml, which also publishes
# the CLI to npm when triggered by GitHub Release events. Running both would
# cause double-publish. The matrix-release.yml creates the GitHub Releases
# that trigger unified-release.yml for publishing.
# To re-enable: remove the `if: false` condition below.
name: Publish simplebeacon to npm (DISABLED)

on:
  workflow_dispatch:
    inputs:
      otp:
        description: "6-digit npm 2FA code (only if NPM_TOKEN lacks bypass-2fa)"
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-check:
    name: Build & Pack (checks)
    runs-on: ubuntu-latest
    if: false # DISABLED — unified-release.yml handles npm publishing
    outputs:
      package-tgz: ${{ steps.pack.outputs.tgz_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests and smoke checks
        working-directory: packages/simplebeacon-cli
        run: |
          npm ci
          npm test
          npm run pack:check || true

      - name: Create npm package tarball
        id: pack
        working-directory: packages/simplebeacon-cli
        run: |
          tgz=$(npm pack --silent)
          echo "tgz=$tgz"
          echo "tgz_path=packages/simplebeacon-cli/$tgz" >> $GITHUB_OUTPUT

      - name: Verify package footprint (max 501 KB)
        run: |
          tgz=${{ steps.pack.outputs.tgz_path }}
          if [ ! -f "$tgz" ]; then
            echo "::error::Packed artifact not found: $tgz"
            exit 1
          fi
          size=$(stat -c%s "$tgz")
          echo "Package size: $size bytes"
          max=$((501 * 1024))
          if [ "$size" -gt "$max" ]; then
            echo "::error::Package exceeds maximum allowed size ($max bytes) — $size bytes"
            exit 1
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: simplebeacon-npm-package
          path: ${{ steps.pack.outputs.tgz_path }}
          retention-days: 90

  publish:
    name: Publish to npm (requires approval)
    needs: build-check
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'simplebeacon-') ||
      startsWith(github.event.release.tag_name, 'simplebeacon@')
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: simplebeacon-npm-package

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_OTP: ${{ inputs.otp }}
        run: |
          tgz=$(ls packages/simplebeacon-cli/*.tgz | head -n1)
          if [ -z "$tgz" ]; then
            echo "::error::No package tarball found to publish"
            exit 1
          fi
          echo "Publishing $tgz to npm..."
          npm publish "$tgz" --access public

      - name: Install GPG
        run: |
          if ! command -v gpg &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y gnupg
          fi

      - name: Sign package tarball (conditional)
        if: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          tgz=$(ls packages/simplebeacon-cli/*.tgz | head -n1)
          node packages/simplebeacon-cli/scripts/sign-artifacts.js "$tgz"

      - name: Upload Tarball + Signature
        uses: actions/upload-artifact@v4
        with:
          name: simplebeacon-npm-publish-output
          path: |
            packages/simplebeacon-cli/*.tgz
            packages/simplebeacon-cli/*.tgz.sig
            generated/signatures-summary.json
          retention-days: 90
