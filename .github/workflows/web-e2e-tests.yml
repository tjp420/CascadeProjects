name: Web Dashboard E2E Testing Suite

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'ai-platform/web/simplebeacon-dashboard/**'
      - '.github/workflows/web-e2e-tests.yml'

jobs:
  e2e-matrix:
    timeout-minutes: 25
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-platform/web/simplebeacon-dashboard

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ai-platform/web/simplebeacon-dashboard/package-lock.json

      - name: Install Application Dependencies
        run: npm ci

      - name: Cache Playwright Browser Drivers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ai-platform/web/simplebeacon-dashboard/package-lock.json') }}

      - name: Provision Playwright Binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Compile Application Production Bundle
        run: npm run build

      - name: Fire Static Sandbox Server & Execute E2E Suite
        env:
          CI: true
        run: |
          npm install -g serve
          npx serve -s assets -l 3000 &
          npx playwright test tests/storage-quota-fallback.spec.ts --project=${{ matrix.browser }}

      - name: Upload Test Execution Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-execution-report-${{ matrix.browser }}
          path: ai-platform/web/simplebeacon-dashboard/playwright-report/
          retention-days: 7
