name: Web Dashboard E2E Testing Suite

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'ai-platform/web/simplebeacon-dashboard/**'
      - '.github/workflows/web-e2e-tests.yml'

jobs:
  e2e-matrix:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    env:
      VITE_API_PORT: 59277

    defaults:
      run:
        working-directory: ai-platform/web/simplebeacon-dashboard

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ai-platform/web/simplebeacon-dashboard/package-lock.json

      - name: Install Application Dependencies
        run: npm ci

      - name: Cache Playwright Browser Drivers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ai-platform/web/simplebeacon-dashboard/package-lock.json') }}

      - name: Provision Playwright Binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Compile Application Production Bundle
        run: npm run build

      - name: Ensure Playwright artifact directories exist
        run: |
          mkdir -p ai-platform/web/simplebeacon-dashboard/playwright-report
          mkdir -p ai-platform/web/simplebeacon-dashboard/test-results

      - name: Fire Static Sandbox Server & Execute E2E Suite
        env:
          CI: true
        run: |
          npm install -g serve
          npx serve -s assets -l 3000 &
          # Run tests and capture combined output to e2e-output.txt for triage
          set -o pipefail
          (
            npx playwright test tests/storage-quota-fallback.spec.ts --project=${{ matrix.browser }} || true
            if [ "${{ matrix.browser }}" = "chromium" ]; then
              npx playwright test tests/network-throttling.spec.ts --project=chromium || true
            fi
          ) | tee e2e-output.txt

      - name: Check e2e test artifacts exist
        id: artifact_check
        run: |
          found=false
          if [ -d "ai-platform/web/simplebeacon-dashboard/playwright-report" ] && [ "$(ls -A ai-platform/web/simplebeacon-dashboard/playwright-report 2>/dev/null | wc -l)" -gt 0 ]; then found=true; fi
          if [ -d "ai-platform/web/simplebeacon-dashboard/test-results" ] && [ "$(ls -A ai-platform/web/simplebeacon-dashboard/test-results 2>/dev/null | wc -l)" -gt 0 ]; then found=true; fi
          if [ -f "ai-platform/web/simplebeacon-dashboard/e2e-output.txt" ]; then found=true; fi
          echo "found=$found" >> $GITHUB_OUTPUT

      - name: Upload Test Execution Artifacts
        if: failure() && steps.artifact_check.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-execution-report-${{ matrix.browser }}
          path: |
            ai-platform/web/simplebeacon-dashboard/playwright-report/
            ai-platform/web/simplebeacon-dashboard/test-results/
            ai-platform/web/simplebeacon-dashboard/e2e-output.txt
          retention-days: 7

      - name: Broadcast Failure Alert to Dev Channels
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.TELEMETRY_CI_SLACK_WEBHOOK }}
          TEAMS_WEBHOOK: ${{ secrets.TELEMETRY_CI_TEAMS_WEBHOOK }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="🚨 *Dashboard E2E Pipeline Failure:* The browser integration checks failed under matrix run: *${{ matrix.browser }}*.
          \nSee details: ${RUN_URL}"

          # Prepare a compact log snippet for quick triage (200 lines)
          if [ -f e2e-output.txt ]; then
            SNIPPET=$(head -n 200 e2e-output.txt | tr -d '"' | tr -d "'" | tr '\n' ' ')
          else
            SNIPPET="(no e2e-output.txt present)"
          fi

          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -s -X POST -H 'Content-type: application/json' \
              --data "{\"text\": \"${MESSAGE}\n\n*Log Snippet:*\n\`\`\`${SNIPPET}\`\`\`\n\nReview the test logs or download trace bundles here: ${RUN_URL}\"}" \
              "$SLACK_WEBHOOK" || true
          fi

          if [ -n "$TEAMS_WEBHOOK" ]; then
            curl -s -X POST -H 'Content-type: application/json' \
              --data "{\"text\": \"${MESSAGE}\n\nLog Snippet:\n${SNIPPET}\n\nFull run: ${RUN_URL}\"}" \
              "$TEAMS_WEBHOOK" || true
          fi
