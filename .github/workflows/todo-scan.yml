name: TODO Lint Scan

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  todo-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run todo-lint (fast CI variant)
        id: run_scan
        run: |
          mkdir -p ./.github/artifacts
          npm run todo-lint:ci:fast

      - name: Check SARIF exists
        id: check_sarif
        run: |
          if [ -f ./.github/artifacts/todo.sarif ]; then echo "exists=true" >> $GITHUB_OUTPUT; else echo "exists=false" >> $GITHUB_OUTPUT; fi

      - name: Upload SARIF to Code Scanning
        if: steps.check_sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: ./.github/artifacts/todo.sarif
