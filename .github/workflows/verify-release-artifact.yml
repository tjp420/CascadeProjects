name: Verify Release Artifact

on:
  release:
    types: [published]
# Optional: enable scheduled nightly verification by uncommenting the following
#  schedule:
#    - cron: '0 2 * * *' # daily at 02:00 UTC

jobs:
  verify-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download named release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node -e "
          const fs=require('fs');
          const p=process.env.GITHUB_EVENT_PATH;
          const ev=JSON.parse(fs.readFileSync(p,'utf8'));
          const assets=(ev.release&&ev.release.assets)||[];
          const pat=/.*-nizk-artifact\.tar\.gz$/;
          const match=assets.find(a=>pat.test(a.name));
          if(!match){ console.error('No release asset matching *-nizk-artifact.tar.gz found'); process.exit(2); }
          console.log(match.id);
          fs.writeFileSync('asset_id.txt',String(match.id));
          "
          ASSET_ID=$(cat asset_id.txt)
          echo "Downloading asset id=$ASSET_ID"
          curl -L -H "Accept: application/octet-stream" -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/$REPO/releases/assets/$ASSET_ID" -o artifact.tar.gz
          mkdir -p artifact && tar -xzf artifact.tar.gz -C artifact || unzip -qq artifact.tar.gz -d artifact || true

      - name: Run verification
        run: |
          node ai-platform/scripts/verify-release-artifact.cjs artifact
