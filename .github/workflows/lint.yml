name: Lint & Format

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Prettier + ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prettier check
        run: npx prettier --check "**/*.{js,cjs,mjs,ts,tsx,json,md}" --ignore-path .gitignore

      - name: ESLint check
        run: npx eslint -c eslint.config.cjs . --ext .js,.cjs,.mjs,.ts,.tsx --max-warnings=0
