# SimpleBeacon PR Scan — runs locally inside the repo, pushes only an encrypted report
name: SimpleBeacon PR Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches-ignore:
      - main
      - master

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  simplebeacon-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install monorepo dependencies
        run: npm ci --ignore-scripts

      - name: Build SimpleBeacon CLI
        run: npm run build --workspace=simplebeacon

      - name: Run local scan
        run: |
          node packages/simplebeacon-cli/bin/simplebeacon.js scan --complete --gate --path . --format json --output .simplebeacon/report.json

      - name: Redact absolute paths and hash metadata
        run: |
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const report = JSON.parse(fs.readFileSync('.simplebeacon/report.json', 'utf8'));
            const path = require('path');
            const cwd = process.cwd().split(path.sep).join('/');
            const json = JSON.stringify(report);
            const redacted = json.replace(new RegExp(cwd + '/?', 'g'), '');
            const payload = JSON.parse(redacted);
            payload.reportHash = crypto.createHash('sha256').update(redacted).digest('hex');
            payload.repository = '${{ github.repository }}';
            payload.ref = '${{ github.ref }}';
            payload.sha = '${{ github.sha }}';
            payload.eventName = '${{ github.event_name }}';
            payload.actor = '${{ github.actor }}';
            payload.workflowRunId = '${{ github.run_id }}';
            payload.collectedAt = new Date().toISOString();
            fs.writeFileSync('.simplebeacon/report.json', JSON.stringify(payload));
          "

      - name: Post encrypted report to SimpleBeacon dashboard
        env:
          SIMPLEBEACON_API_TOKEN: ${{ secrets.SIMPLEBEACON_API_TOKEN }}
        run: |
          node -e "
            const fs = require('fs');
            const https = require('https');
            const data = fs.readFileSync('.simplebeacon/report.json');
            const url = new URL(process.env.SIMPLEBEACON_API_URL || 'https://api.simplebeacon.ai/api/integrations/pr-report');
            const options = {
              method: 'POST',
              hostname: url.hostname,
              path: url.pathname + url.search,
              port: url.port || 443,
              headers: {
                'Content-Type': 'application/json',
                'Content-Length': Buffer.byteLength(data),
                'Authorization': 'Bearer ' + (process.env.SIMPLEBEACON_API_TOKEN || ''),
                'X-GitHub-Event': 'workflow',
                'X-GitHub-Repository': '${{ github.repository }}',
                'X-GitHub-SHA': '${{ github.sha }}',
                'X-GitHub-PR-Number': '${{ github.event.pull_request.number }}'
              },
              timeout: 120000
            };
            const req = https.request(options, (res) => {
              let body = '';
              res.on('data', (chunk) => body += chunk);
              res.on('end', () => {
                if (res.statusCode >= 200 && res.statusCode < 300) {
                  console.log('Report posted successfully');
                } else {
                  console.error('Failed to post report:', res.statusCode, body);
                  process.exit(1);
                }
              });
            });
            req.on('error', (err) => { console.error('Request error:', err.message); process.exit(1); });
            req.write(data);
            req.end();
          "
