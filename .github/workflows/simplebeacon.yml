# SimpleBeacon PR Scan - runs locally inside the repo, pushes only an encrypted report
name: SimpleBeacon PR Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches-ignore:
      - main
      - master

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  simplebeacon-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install monorepo dependencies
        run: npm install --ignore-scripts

      - name: Build SimpleBeacon CLI
        run: npm run build --workspace=simplebeacon

      - name: Run local scan
        id: scan
        run: |
          node packages/simplebeacon-cli/bin/simplebeacon.js scan --complete --gate --path . --format json --output .simplebeacon/report.json
        continue-on-error: true

      - name: Generate PR comment and step summary
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const { formatGithubComment, formatGithubStepSummary } = require('./packages/simplebeacon-cli/src/reporters/github-comment');
            let report, gate;
            try {
              const raw = JSON.parse(fs.readFileSync('.simplebeacon/report.json', 'utf8'));
              report = raw.report || raw;
              gate = report.gate || null;
            } catch (e) {
              console.log('Could not read report:', e.message);
              process.exit(0);
            }
            // Write step summary
            const stepSummary = formatGithubStepSummary(report, gate);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY || '/dev/null', stepSummary + '\n');
            // Write PR comment body to file for next step
            const comment = formatGithubComment(report, gate, {
              repo: process.env.GITHUB_REPOSITORY,
              serverUrl: process.env.GITHUB_SERVER_URL || 'https://github.com',
              ref: process.env.GITHUB_HEAD_REF || process.env.GITHUB_REF_NAME || 'main'
            });
            fs.writeFileSync('.simplebeacon/pr-comment.md', comment);
            console.log('PR comment generated (' + comment.length + ' chars)');
          "

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('.simplebeacon/pr-comment.md')) {
              console.log('No PR comment to post');
              return;
            }
            const body = fs.readFileSync('.simplebeacon/pr-comment.md', 'utf8');
            // Find and update existing SimpleBeacon comment, or create new one
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });
            const existing = comments.data.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('48 analyzers + 25 scan engines')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
              console.log('Updated existing SimpleBeacon comment:', existing.id);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body
              });
              console.log('Posted new SimpleBeacon comment');
            }

      - name: Set gate status
        if: always()
        run: |
          if [ -f .simplebeacon/report.json ]; then
            GATE_PASS=$(node -e "const r=require('./.simplebeacon/report.json');const rep=r.report||r;console.log(rep.gate?.pass?'true':'false')" 2>/dev/null || echo "false")
            if [ "$GATE_PASS" = "false" ]; then
              echo "Gate failed — exiting with code 1"
              exit 1
            fi
          fi

      - name: Print blocking issues on failure
        if: failure()
        run: |
          node -e "
            const fs = require('fs');
            try {
              const r = JSON.parse(fs.readFileSync('.simplebeacon/report.json', 'utf8'));
              const rep = r.report || r;
              const gate = rep.gate || rep.summary?.gate || {};
              console.log('Gate pass:', gate.pass);
              console.log('Blocking count:', gate.blockingCount);
              const issues = gate.blockingIssues || [];
              issues.forEach(i => {
                console.log('---');
                console.log('  Severity:', i.severity);
                console.log('  Type:', i.type || i.rule);
                console.log('  File:', (i.file || i.filePath || i.path || '').replace(process.cwd() + '/', ''));
                console.log('  Line:', i.line);
                console.log('  Description:', i.description || i.message || '');
              });
            } catch(e) { console.log('Could not read report:', e.message); }
          "

      - name: Redact absolute paths and hash metadata
        run: |
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const report = JSON.parse(fs.readFileSync('.simplebeacon/report.json', 'utf8'));
            const cwd = process.cwd().split(require('path').sep).join('/');
            const json = JSON.stringify(report);
            const redacted = json.replace(new RegExp(cwd + '/?', 'g'), '');
            const payload = JSON.parse(redacted);
            payload.reportHash = crypto.createHash('sha256').update(redacted).digest('hex');
            payload.repository = '${{ github.repository }}';
            payload.ref = '${{ github.ref }}';
            payload.sha = '${{ github.sha }}';
            payload.eventName = '${{ github.event_name }}';
            payload.actor = '${{ github.actor }}';
            payload.workflowRunId = '${{ github.run_id }}';
            payload.collectedAt = new Date().toISOString();
            fs.writeFileSync('.simplebeacon/report.json', JSON.stringify(payload));
          "

      - name: Post encrypted report to SimpleBeacon dashboard
        env:
          SIMPLEBEACON_API_TOKEN: ${{ secrets.SIMPLEBEACON_API_TOKEN }}
        run: |
          node -e "
            const fs = require('fs');
            const https = require('https');
            const data = fs.readFileSync('.simplebeacon/report.json');
            if (!process.env.SIMPLEBEACON_API_TOKEN) {
              console.log('No SIMPLEBEACON_API_TOKEN set; skipping dashboard upload.');
            } else {
              const url = new URL(process.env.SIMPLEBEACON_API_URL || 'https://api.simplebeacon.ai/api/integrations/pr-report');
              const options = {
                method: 'POST',
                hostname: url.hostname,
                path: url.pathname + url.search,
                port: url.port || 443,
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(data),
                  'Authorization': 'Bearer ' + (process.env.SIMPLEBEACON_API_TOKEN || ''),
                  'X-GitHub-Event': 'workflow',
                  'X-GitHub-Repository': '${{ github.repository }}',
                  'X-GitHub-SHA': '${{ github.sha }}',
                  'X-GitHub-PR-Number': '${{ github.event.pull_request.number }}'
                },
                timeout: 120000
              };
              const req = https.request(options, (res) => {
                let body = '';
                res.on('data', (chunk) => body += chunk);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) {
                    console.log('Report posted successfully');
                  } else {
                    console.error('Failed to post report:', res.statusCode, body);
                    process.exit(1);
                  }
                });
              });
              req.on('error', (err) => { console.error('Request error:', err.message); process.exit(1); });
              req.write(data);
              req.end();
            }
          "
