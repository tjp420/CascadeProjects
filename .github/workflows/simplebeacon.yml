name: Simplebeacon

on:
  pull_request:
    paths:
      - '**/*.json'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/.simplebeacon/**'
      - 'ai-platform/packages/simplebeacon-cli/**'
      - 'ai-platform/action/**'
      - '.github/workflows/simplebeacon.yml'
  push:
    branches: [main, master]
    paths:
      - '**/.simplebeacon/**'
      - 'ai-platform/packages/simplebeacon-cli/**'
      - 'ai-platform/action/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  simplebeacon:
    if: hashFiles('ai-platform/package-lock.json') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect ai-platform
        id: detect
        run: |
          if [ -f ai-platform/package-lock.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "## Simplebeacon" >> "$GITHUB_STEP_SUMMARY"
            echo "Skipped — ai-platform is not on this branch yet." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.ready == 'true'
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.detect.outputs.ready == 'true'
        working-directory: ai-platform
        run: npm ci

      - name: Run simplebeacon gate
        if: steps.detect.outputs.ready == 'true'
        uses: ./ai-platform/action
        with:
          path: ai-platform
          fail-on: high
          post-comment: true

      - name: Build compliance assessment
        if: steps.detect.outputs.ready == 'true'
        working-directory: ai-platform
        run: npm run simplebeacon:assess -- --output .simplebeacon/assessment.json

      - name: Generate compliance monitoring snapshot
        if: steps.detect.outputs.ready == 'true'
        working-directory: ai-platform
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const reportPath = '.simplebeacon/report.json';
          const assessmentPath = '.simplebeacon/assessment.json';
          const outPath = '.simplebeacon/compliance-monitoring.json';
          if (!fs.existsSync(reportPath)) {
            console.log('No report.json found; skipping compliance monitoring snapshot.');
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const assessment = fs.existsSync(assessmentPath)
            ? JSON.parse(fs.readFileSync(assessmentPath, 'utf8'))
            : null;
          const snapshot = {
            generatedAt: new Date().toISOString(),
            gate: report.gate || null,
            issueCount: Number(report.issueCount || 0),
            severityCounts: report.severityCounts || {},
            qualityScore: report.qualityScore ?? null,
            consistencyScore: report.consistencyScore ?? null,
            assessmentHeadline: assessment?.executiveSummary?.headline || null
          };
          fs.mkdirSync(path.dirname(outPath), { recursive: true });
          fs.writeFileSync(outPath, `${JSON.stringify(snapshot, null, 2)}\n`, 'utf8');
          console.log(`Wrote ${outPath}`);
          NODE

      - name: Refresh monorepo scan report for trust
        if: success() && steps.detect.outputs.ready == 'true'
        working-directory: ${{ github.workspace }}
        run: npm run trust:scan-monorepo --prefix ai-platform

      - name: Publish trust verification payload (local + optional remote)
        if: success() && steps.detect.outputs.ready == 'true'
        working-directory: ai-platform
        env:
          TRUST_PUBLISH_ENDPOINT: ${{ secrets.SIMPLEBEACON_TRUST_PUBLISH_URL }}
          TRUST_PUBLISH_TOKEN: ${{ secrets.SIMPLEBEACON_TRUST_PUBLISH_TOKEN }}
          TRUST_PUBLISH_STRICT: 'false'
          TRUST_PUBLISH_REQUIRED: 'false'
          TRUST_PUBLISH_REQUIRE_TOKEN: 'false'
          TRUST_PUBLISH_ALLOW_HTTP: 'false'
        run: |
          npm run trust:validate-env
          npm run trust:publish

      - name: Add trust publish summary
        if: steps.detect.outputs.ready == 'true'
        working-directory: ai-platform
        run: npm run trust:ci-summary

      - name: Upload simplebeacon artifacts
        if: steps.detect.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: simplebeacon-${{ github.run_id }}
          path: |
            ai-platform/.simplebeacon/report.json
            ai-platform/.simplebeacon/assessment.json
            ai-platform/.simplebeacon/compliance-monitoring.json
            ai-platform/.simplebeacon/trust-publish-env-validation.json
            ai-platform/.simplebeacon/trust-publish-audit.json
            ai-platform/public/trust-verification.json
            .simplebeacon/report.json
          if-no-files-found: ignore
