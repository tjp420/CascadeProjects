# Auto-post SimpleBeacon gate results as PR comments.
# Runs after the enterprise and hygiene gate workflows complete.
# Requires: GITHUB_TOKEN with pull-requests:write (already granted by enterprise/hygiene gates).

name: SimpleBeacon PR Comment Bot

on:
  workflow_run:
    workflows:
      - "SimpleBeacon Enterprise Guardrail"
      - "SimpleBeacon AI Hygiene Gate"
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  post-comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download gate report artifact
        uses: actions/download-artifact@v4
        with:
          name: simplebeacon-enterprise-report
          path: ai-platform/.simplebeacon
        continue-on-error: true

      - name: Download hygiene report artifact
        uses: actions/download-artifact@v4
        with:
          name: simplebeacon-ai-hygiene-report
          path: ai-platform/.simplebeacon
        continue-on-error: true

      - name: Post PR comment
        working-directory: ai-platform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          REPORT=".simplebeacon/report.json"
          if [ ! -f "$REPORT" ]; then
            echo "No report found; skipping comment."
            exit 0
          fi
          node packages/simplebeacon-cli/bin/simplebeacon.js comment \
            --report "$REPORT" \
            --repo "$GITHUB_REPOSITORY" \
            --issue-number "$GITHUB_PR_NUMBER"
