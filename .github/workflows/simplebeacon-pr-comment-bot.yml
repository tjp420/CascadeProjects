# Auto-post SimpleBeacon gate results as PR comments.
# Runs after the enterprise and hygiene gate workflows complete.
# Requires: GITHUB_TOKEN with pull-requests:write (already granted by enterprise/hygiene gates).

name: SimpleBeacon PR Comment Bot

on:
  workflow_run:
    workflows:
      - "SimpleBeacon Enterprise Guardrail"
      - "SimpleBeacon AI Hygiene Gate"
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  post-comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download gate report artifact
        uses: actions/download-artifact@v4
        with:
          name: simplebeacon-enterprise-report
          path: ai-platform/.simplebeacon
        continue-on-error: true

      - name: Download hygiene report artifact
        uses: actions/download-artifact@v4
        with:
          name: simplebeacon-ai-hygiene-report
          path: ai-platform/.simplebeacon
        continue-on-error: true

      - name: Post PR brief comment (safe)
        working-directory: ai-platform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          REPORT=".simplebeacon/report.json"
          if [ ! -f "$REPORT" ]; then
            echo "No report found; skipping comment."
            exit 0
          fi
          # Build a short summary to avoid exceeding GitHub comment limits.
          CRIT=$(jq -r '.severityCounts.critical // .scan_summary.critical_severity_count // 0' "$REPORT")
          HIGH=$(jq -r '.severityCounts.high // .scan_summary.high_severity_count // 0' "$REPORT")
          MED=$(jq -r '.severityCounts.medium // .scan_summary.medium_severity_count // 0' "$REPORT")
          LOW=$(jq -r '.severityCounts.low // .scan_summary.low_severity_count // 0' "$REPORT")
          STATUS=$(jq -r '.scan_summary.status // "UNKNOWN"' "$REPORT")
          BODY="SimpleBeacon quick gate: $STATUS. Issues — critical=$CRIT, high=$HIGH, medium=$MED, low=$LOW. Full report files have been uploaded as workflow artifacts (simplebeacon-enterprise-report / simplebeacon-ai-hygiene-report).\n\nIf you need the full JSON inline, download the artifact from the workflow run."
          echo "Posting short PR comment (length=${#BODY})"
          gh api repos/${GITHUB_REPOSITORY}/issues/${GITHUB_PR_NUMBER}/comments -F body="$BODY" --silent
