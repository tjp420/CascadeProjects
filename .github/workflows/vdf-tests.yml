name: VDF Time-Lock Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  vdf:
    name: Run VDF Time-Lock Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run VDF Time-Lock Unit Tests
        run: npx jest ai-platform/server/lib/vdf --color --runInBand --testTimeout=20000