version: 2
updates:
  # Root monorepo
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  # ai-agent package (zero deps, kept for completeness)
  - package-ecosystem: "npm"
    directory: "/ai-agent"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ai-agent"
    commit-message:
      prefix: "chore(deps)"

  # ai-tools package
  - package-ecosystem: "npm"
    directory: "/ai-tools"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ai-tools"
    commit-message:
      prefix: "chore(deps)"

  # ai-platform
  - package-ecosystem: "npm"
    directory: "/ai-platform"
