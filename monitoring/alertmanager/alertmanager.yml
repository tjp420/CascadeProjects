global:
  resolve_timeout: 5m

templates:
  - '/etc/alertmanager/alertmanager_templates.tmpl'
  - '/etc/alertmanager/simplebeacon.tmpl'

route:
  group_by: ['alertname', 'cluster', 'namespace', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'slack-notifications'
  routes:
    # Route SimpleBeacon scan resource alerts to a dedicated receiver.
    - match:
        service: 'simplebeacon-scan'
      receiver: 'simplebeacon-receiver'
      continue: true
    # Fallback: any alerts that do not match specific routes will use the top-level receiver.

inhibit_rules:
  # Auto-inhibit warning alerts when a critical alert is active for the same resource
  - source_match:
      alertname: SimpleBeaconScanResourcePressure
      severity: critical
    target_match:
      alertname: SimpleBeaconScanResourcePressure
      severity: warning
    equal: ['cluster', 'instance', 'service']

receivers:
- name: 'slack-notifications'
  slack_configs:
  - api_url: 'https://slack.com'
    channel: '#ops-agent-framework'
    send_resolved: true
    title: '{{ template "slack.default.title" . }}'
    text: '{{ template "slack.default.text" . }}'

- name: 'simplebeacon-receiver'
  slack_configs:
  - api_url: 'https://hooks.slack.com/services/REPLACE/ME'
    channel: '#scan-failures'
    send_resolved: true
    title: '{{ template "simplebeacon.default" . }}'
    text: '{{ template "simplebeacon.default" . }}'

# Optional default receiver example (uncomment and configure if you want a separate fallback):
# - name: 'default-receiver'
#   webhook_configs:
#   - url: 'https://example.com/alert-hook'

# Note: Replace `api_url` with a secure webhook URL and mount the templates file
# into Alertmanager's `/etc/alertmanager/` path (via Docker Compose or k8s ConfigMap).