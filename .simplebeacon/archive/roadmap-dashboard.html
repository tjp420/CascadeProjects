    color: var(--text);
    line-height: 1.5;

  header {
    padding: 2rem 1.5rem 1rem;
    max-width: 1200px;
    margin: 0 auto;
  }
  header h1 { margin: 0 0 .25rem; font-size: 1.75rem; }
  header .sub { color: var(--text-dim); font-size: .95rem; }
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
  }
  .grid {
    display: grid;
    gap: 1rem;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: .75rem;
    padding: 1.25rem;
    transition: transform .15s ease, background .15s ease;
  }
  .card:hover { background: var(--card-hover); }
  .card h3 { margin: 0 0 .5rem; font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); }
  .metric { font-size: 2rem; font-weight: 700; }
  .metric.small { font-size: 1.35rem; }
  .health-good { color: var(--success); }
  .health-moderate { color: var(--warning); }
  .health-bad { color: var(--danger); }
  .progress-bg {
    background: #334155;
    border-radius: .5rem;
    height: .75rem;
    overflow: hidden;
    margin-top: .5rem;
  }
  .progress-fill {
    height: 100%;
    border-radius: .5rem;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .8s ease;
  }
  .section { margin-top: 2rem; }
  .section h2 { font-size: 1.15rem; margin: 0 0 1rem; padding-bottom: .5rem; border-bottom: 1px solid var(--border); }
  .tag {
    display: inline-block;
    padding: .2rem .55rem;
    border-radius: .35rem;
    font-size: .75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .02em;
  }
  .tag.completed { background: rgba(34,197,94,.15); color: var(--success); }
  .tag.in-progress { background: rgba(56,189,248,.15); color: var(--accent); }
  .tag.planned { background: rgba(148,163,184,.15); color: var(--text-dim); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: .55rem .5rem; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight: 600; font-size: .8rem; text-transform: uppercase; }
  td { font-size: .9rem; }
  .recommendation { display: flex; align-items: baseline; gap: .5rem; padding: .4rem 0; }
  .recommendation .badge { min-width: 4.2rem; text-align: center; }
  .badge-medium { background: rgba(245,158,11,.15); color: var(--warning); }
  .badge-low { background: rgba(148,163,184,.15); color: var(--text-dim); }
  .list { list-style: none; padding: 0; margin: 0; }
  .list li { padding: .35rem 0; }
  .list li::before { content: "•"; color: var(--accent); margin-right: .5rem; }
  .chart-row { display: flex; align-items: center; gap: .75rem; padding: .35rem 0; }
  .chart-bar { height: .6rem; border-radius: .3rem; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 720px) { .two-col { grid-template-columns: 1fr; } }
</style>

function pctColor(v){ return v>=80?'health-good':v>=60?'health-moderate':'health-bad'; }

  const es = ROADMAP.executiveSummary;
  const pm = ROADMAP.progressMetrics;
  const ca = ROADMAP.codeAnalysis;

  // Summary cards
  const cards = [
    { title: 'Completion Rate', value: es.completionRate+'%', cls: pctColor(es.completionRate) },

    { title: 'Total Files', value: ca.structure.totalFiles },

  ];
  document.getElementById('summary-cards').innerHTML = cards.map(c =>

  ).join('');

  // Sprints
  const sprints = ROADMAP.developmentPhases;
  document.getElementById('sprints').innerHTML = sprints.map(sp => {
    const tag = sp.status==='completed'?'completed':sp.status==='in-progress'?'in-progress':'planned';
    return `<div class="card" style="margin-bottom:.75rem">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem">
        <div><strong>${sp.phase}</strong> <span class="tag ${tag}">${sp.status}</span></div>
        <div style="color:var(--text-dim);font-size:.85rem">${sp.progress}%</div>
      </div>
      <div class="progress-bg"><div class="progress-fill" style="width:${sp.progress}%"></div></div>
      <div style="margin-top:.5rem;color:var(--text-dim);font-size:.85rem">${sp.description}</div>
      <div style="margin-top:.35rem;font-size:.85rem">Features: ${sp.features.join(' • ')}</div>
    </div>`;
  }).join('');

  // Categories
  const cats = ROADMAP.featureCategories;
  document.getElementById('categories').innerHTML = cats.map(cat => {
    return `<div class="chart-row">
      <div style="min-width:7.5rem;font-size:.9rem">${cat.category}</div>
      <div class="progress-bg" style="flex:1;margin:0">
        <div class="progress-fill" style="width:${cat.completionRate}%"></div>
      </div>
      <div style="min-width:3.5rem;text-align:right;font-size:.85rem">${cat.completionRate}%</div>
    </div>`;
  }).join('');

  const risk = ROADMAP.strategicInsights?.riskAssessment || { overallRisk:'MODERATE', riskCategories:{security:'MINIMAL',compliance:'MODERATE',performance:'MINIMAL',maintainability:'MODERATE'} };

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.4rem;font-size:.9rem">

  const allRecs = [

  document.getElementById('recommendations').innerHTML = allRecs.map(r => {
    const badge = r.level==='high'?'badge-medium':r.level==='medium'?'badge-medium':'badge-low';

  // Implementation phases
  const phases = ROADMAP.implementationPhases;
  document.getElementById('phases').innerHTML = phases.map(ph => {
    const tag = ph.status==='complete'?'completed':ph.status==='active'?'in-progress':'planned';
    return `<div class="card" style="margin-bottom:.75rem">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong>${ph.phase}</strong>
        <span class="tag ${tag}">${ph.status}</span>
      </div>
      <ul class="list" style="margin-top:.5rem">
        ${ph.items.map(i => `<li>${i}</li>`).join('')}
      </ul>
    </div>`;
  }).join('');

  // API list (first 16, then toggle)
  const apis = ca.aiIntegration.apis.slice(0, 20);
  document.getElementById('api-list').innerHTML = apis.map(a => `<li>${a}</li>`).join('') +
    `<li style="color:var(--text-dim)">... and ${ca.aiIntegration.apis.length - apis.length} more routes</li>`;
}

</script>
