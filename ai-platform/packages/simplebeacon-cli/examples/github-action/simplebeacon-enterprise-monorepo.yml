# Monorepo enterprise gate — copy to REPO ROOT .github/workflows/simplebeacon-enterprise-gate.yml
# Requires: ai-platform/.simplebeacon/config.json (profile: enterprise, intelligence.enabled optional)
# Live reference: CascadeProjects/.github/workflows/simplebeacon-enterprise-gate.yml

name: Simplebeacon Enterprise Guardrail

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'ai-platform/**'
      - '.github/workflows/simplebeacon-enterprise-gate.yml'
  push:
    branches: [main, master]
    paths:
      - 'ai-platform/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: ai-platform

permissions:
  contents: read
  pull-requests: write

jobs:
  enterprise-guardrail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SimpleBeacon CLI + intelligence
        run: |
          npm install --ignore-scripts --prefix packages/simplebeacon-cli
          npm install --ignore-scripts --prefix packages/simplebeacon-intelligence

      - name: Fetch Tree-sitter WASM grammars
        working-directory: packages/simplebeacon-intelligence
        run: npm run fetch-grammars

      - name: Run enterprise guardrail gate (offline)
        env:
          SIMPLEBEACON_PARALLEL: '1'
          SIMPLEBEACON_OFFLINE: '1'
        run: |
          node packages/simplebeacon-cli/bin/simplebeacon.js scan \
            --path . --format json --output .simplebeacon/report.json \
            --gate --offline --verbose
          node packages/simplebeacon-cli/bin/simplebeacon.js gate status

      - name: Post PR gate summary
        if: github.event_name == 'pull_request' && always()
        run: |
          node packages/simplebeacon-cli/bin/simplebeacon.js comment \
            --report .simplebeacon/report.json --print-only >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplebeacon-enterprise-report
          path: ai-platform/.simplebeacon/report.json
          if-no-files-found: ignore
