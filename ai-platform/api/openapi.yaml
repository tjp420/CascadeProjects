openapi: 3.1.0
info:
  title: SimpleBeacon Crypto Governance API
  version: 1.0.0
  description: |
    OpenAPI specification exposing Policy, Key Lifecycle, VRF execution, Governance (Tracks 114-121), and SIEM audit endpoints for the SimpleBeacon HSM mesh vault platform.
servers:
  - url: https://api.simplebeacon.local/v1
    description: Local development server (mTLS enforced in production)

security:
  - oauth2: ["policy:write", "vrf:execute"]

components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.simplebeacon.local/oauth/token
          scopes:
            policy:write: Create and update crypto policies
            policy:read: Read crypto policies
            vrf:execute: Execute VRF evaluations
    mutualTLS:
      type: mutualTLS
      description: Client TLS certificate is required for low-level node-to-node operations (DKG/MPCCoordinator). Use in production server-to-server endpoints.
    adminAll:
      type: apiKey
      in: header
      name: X-Admin-Authorization
      description: Admin-level authorization token for governance and telemetry endpoints (admin:all scope).

  schemas:
    CryptoPolicyEngine:
      type: object
      required: [policyId, version, latticeParams, thresholdParams, participants]
      properties:
        policyId:
          type: string
          description: Unique policy identifier
        version:
          type: string
        description:
          type: string
        latticeParams:
          $ref: '#/components/schemas/LatticeParameters'
        thresholdParams:
          $ref: '#/components/schemas/ThresholdParameters'
        zkProofs:
          $ref: '#/components/schemas/ZKProofParameters'
        allowedAlgorithms:
          type: array
          items:
            type: string
        keyLifecycle:
          $ref: '#/components/schemas/KeyLifecycleParameters'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'

    LatticeParameters:
      type: object
      required: [scheme, n, q, sigma]
      properties:
        scheme:
          type: string
        n:
          type: integer
        q:
          type: integer
        sigma:
          type: number

    ThresholdParameters:
      type: object
      required: [nShares, threshold]
      properties:
        nShares:
          type: integer
        threshold:
          type: integer
        shareEncoding:
          type: string

    ZKProofParameters:
      type: object
      properties:
        enabled:
          type: boolean
        scheme:
          type: string
        securityLevel:
          type: integer

    KeyLifecycleParameters:
      type: object
      properties:
        rotationIntervalDays:
          type: integer
        epochDurationMs:
          type: integer
        nonceWindowMs:
          type: integer

    Participant:
      type: object
      required: [id, role, endpoint, pubKeyFingerprint]
      properties:
        id:
          type: string
        role:
          type: string
        endpoint:
          type: string
          format: uri
        pubKeyFingerprint:
          type: string

    CreatePolicyRequest:
      $ref: '#/components/schemas/CryptoPolicyEngine'

    CreatePolicyResponse:
      type: object
      properties:
        policy_id:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
      examples:
        created:
          value:
            policy_id: clinical-trial-oncology-v1-alpha
            status: created
            created_at: '2026-08-02T16:00:00Z'

    GenerateThresholdKeysResponse:
      type: object
      properties:
        operation_id:
          type: string
        composite_public_key_fingerprint:
          type: string
        status:
          type: string
      examples:
        op:
          value:
            operation_id: op-20260802-0001
            composite_public_key_fingerprint: sha256:abcd...0123
            status: pending

    VRFEvaluateRequest:
      type: object
      properties:
        policy_id:
          type: string
        evaluation_context:
          type: string
          format: byte
        client_nonce:
          type: integer
        timestamp:
          type: string
          format: date-time

    VRFEvaluateResponse:
      type: object
      properties:
        vrf_output:
          type: string
          description: base64-encoded output
        proof_bundle:
          type: string
          description: base64-encoded NIZK proof bundle
        epoch_id:
          type: string
        signed_audit_token:
          type: string
      examples:
        sample:
          value:
            vrf_output: "VGhpcyBpcyBhIHNhbXBsZSB2cmYgb3V0cHV0"
            proof_bundle: "UE9NIFBST09GLVRIQU4gVEhJRkZfUFJBV0Q="
            epoch_id: epoch-2026-08-02-04
            signed_audit_token: "sha256:abcd1234..."

    VRFVerifyRequest:
      type: object
      properties:
        policy_id:
          type: string
        evaluation_context:
          type: string
          format: byte
        vrf_output:
          type: string
        proof_bundle:
          type: string

    VRFVerifyResponse:
      type: object
      properties:
        is_valid:
          type: boolean
        error_context:
          type: string

    NIZKGenerateRequest:
      type: object
      properties:
        policy_id:
          type: string
        public_inputs:
          type: object
        secret_inputs:
          type: object
        scheme:
          type: string
      required: [policy_id]

    NIZKGenerateResponse:
      type: object
      properties:
        proof_bundle:
          type: string
          description: base64-encoded mock NIZK proof bundle
        proof_size:
          type: integer
        meta:
          type: object

    NIZKVerifyRequest:
      type: object
      properties:
        policy_id:
          type: string
        public_inputs:
          type: object
        proof_bundle:
          type: string
      required: [policy_id, proof_bundle]

    NIZKVerifyResponse:
      type: object
      properties:
        is_valid:
          type: boolean
        error_context:
          type: string


    # ── Track 114-121 Governance Reusable Schemas ────────────────────

    PolicyResponse:
      type: object
      required: [success, orgId, policy]
      properties:
        success:
          type: boolean
          description: Operation success status
        orgId:
          type: string
          description: Tenant organization identifier resolved from request
        policy:
          type: object
          description: Policy attribute block for the governance track
          additionalProperties: true

    PolicyValidateRequest:
      type: object
      description: Configuration to validate against policy constraints
      additionalProperties: true

    PolicyValidateResponse:
      type: object
      required: [success, valid]
      properties:
        success:
          type: boolean
          description: Operation success status
        valid:
          type: boolean
          description: Whether the configuration passed validation

    PolicyViolationError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Error code (always POLICY_VIOLATION_BLOCKED)
          example: POLICY_VIOLATION_BLOCKED
        message:
          type: string
          description: Human-readable description of the policy violation

    TelemetryResponse:
      type: object
      required: [success, orgId, telemetry]
      properties:
        success:
          type: boolean
          description: Operation success status
        orgId:
          type: string
          description: Tenant organization identifier resolved from request
        telemetry:
          type: object
          description: Telemetry counters for the governance track
          additionalProperties:
            type: number

    AuditTelemetryResponse:
      type: object
      required: [success, telemetry]
      properties:
        success:
          type: boolean
          description: Operation success status
        telemetry:
          type: object
          description: SIEM audit telemetry counters
          additionalProperties:
            type: number

    # ── Track 112 Multipart Upload Reusable Schemas ─────────────────────

    Track112UploadCreateRequest:
      type: object
      required: [tenant, maxBytes]
      properties:
        tenant:
          type: string
          description: Target tenant for the upload session
        maxBytes:
          type: integer
          description: Maximum total bytes accepted for the session

    Track112UploadCreateResponse:
      type: object
      required: [sessionId, traceId]
      properties:
        sessionId:
          type: string
          description: Unique upload session identifier
        traceId:
          type: string
          description: Request trace identifier echoed in x-track112-trace-id header

    Track112ChunkUploadParameters:
      type: object
      required: [id, offset]
      properties:
        id:
          type: string
          in: path
          description: Upload session identifier
        offset:
          type: integer
          in: query
          description: Byte offset for the chunk within the session

    Track112CommitRequest:
      type: object
      required: [publicKeyPem, signature]
      properties:
        publicKeyPem:
          type: string
          format: pem
          description: Ed25519 public key in PEM SPKI format used to verify the root commitment
        signature:
          type: string
          format: byte
          description: Base64-encoded Ed25519 signature over the SHA-256 root of persisted chunk data

    Track112CommitResponse:
      type: object
      required: [status, root, traceId]
      properties:
        status:
          type: string
          example: committed
          description: Final commitment status of the upload session
        root:
          type: string
          format: byte
          description: Base64-encoded SHA-256 root over the persisted chunk data
        traceId:
          type: string
          description: Request trace identifier echoed in x-track112-trace-id header

    Track112Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error detail
paths:
  /track112/uploads:
    post:
      summary: Create a Track 112 multipart upload session
      tags: [Track112MultipartUpload]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Track112UploadCreateRequest'
      responses:
        '201':
          description: Upload session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track112UploadCreateResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track112Error'

  /track112/uploads/{id}/chunk:
    post:
      summary: Upload a raw chunk for a Track 112 session
      tags: [Track112MultipartUpload]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Chunk accepted
        '500':
          description: Chunk write failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track112Error'

  /track112/uploads/{id}/commit:
    post:
      summary: Commit a Track 112 session with Ed25519 root signature
      tags: [Track112MultipartUpload]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Track112CommitRequest'
      responses:
        '200':
          description: Session committed and root returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track112CommitResponse'
        '400':
          description: Missing public key or signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track112Error'
        '401':
          description: Signature verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track112Error'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track112Error'

  /policies:
    post:
      summary: Create a new Crypto Policy
      tags: [PolicyService]
      security:
        - oauth2: [policy:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicyRequest'
      responses:
        '201':
          description: Policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePolicyResponse'

  /policies/{policy_id}:
    get:
      summary: Get a policy
      tags: [PolicyService]
      security:
        - oauth2: [policy:read]
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Policy retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoPolicyEngine'

  /policies/{policy_id}/generate-keys:
    post:
      summary: Trigger distributed key generation for a policy
      tags: [KeyLifecycleService]
      security:
        - oauth2: [policy:write]
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: DKG initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateThresholdKeysResponse'

  /keys/{policy_id}/proactive-refresh:
    post:
      summary: Trigger proactive share refresh for a policy
      tags: [KeyLifecycleService]
      security:
        - oauth2: [policy:write]
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Proactive share refresh scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  epoch_id:
                    type: string
                  refreshed_at:
                    type: string
                    format: date-time

  /vrf/evaluate:
    post:
      summary: Evaluate a threshold VRF for an input context
      tags: [VRFExecutionService]
      security:
        - oauth2: [vrf:execute]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VRFEvaluateRequest'
      responses:
        '200':
          description: VRF evaluation result with proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VRFEvaluateResponse'

  /vrf/verify:
    post:
      summary: Verify a VRF output and proof for a policy
      tags: [VRFExecutionService]
      security:
        - oauth2: [vrf:execute]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VRFVerifyRequest'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VRFVerifyResponse'

  /nizk/generate:
    post:
      summary: Generate a NIZK proof bundle for a policy context (stub)
      tags: [NIZKService]
      security:
        - oauth2: [vrf:execute]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NIZKGenerateRequest'
      responses:
        '200':
          description: Generated mock proof bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NIZKGenerateResponse'

  /nizk/verify:
    post:
      summary: Verify a NIZK proof bundle (stub)
      tags: [NIZKService]
      security:
        - oauth2: [vrf:execute]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NIZKVerifyRequest'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NIZKVerifyResponse'

  # ── Track 114 cluster isolation ──────────────────────────────────
  /vault/cluster-isolation/policy:
    get:
      summary: Get Track 114 cluster isolation policy
      tags: [Track114ClusterIsolation]
      security:
        - adminAll: []
      parameters:
        - name: orgId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Active policy for Track 114 cluster isolation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'

  /vault/cluster-isolation/policy/validate:
    post:
      summary: Validate a Track 114 cluster isolation configuration
      tags: [Track114ClusterIsolation]
      security:
        - adminAll: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyValidateRequest'
      responses:
        '200':
          description: Configuration is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyValidateResponse'
        '400':
          description: Policy violation blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyViolationError'

  /vault/cluster-isolation/telemetry:
