                $ref: "#/components/schemas/TelemetryResponse"
  /vault/replication-tenant-isolation/policy:
    get:
      summary: Get replication tenant isolation policy
      tags:
        - Track124ReplicationTenantIsolation
      security:
        - adminAll: []
      responses:
        "200":
          description: Replication tenant isolation policy defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplicationTenantIsolationPolicyResponse"
  /vault/replication-tenant-isolation/policy/validate:
    post:
      summary: Validate a replication tenant context
      tags:
        - Track124ReplicationTenantIsolation
      security:
        - adminAll: []
      requestBody:
