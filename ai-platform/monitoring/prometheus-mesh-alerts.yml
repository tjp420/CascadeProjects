## Prometheus alert rules for Track 115 Multi-Enclave Confidential Mesh
## State-Reconciliation Gating Hub.
##
## These rules assume the ai-platform metrics endpoint is scraped with the
## `ai-platform-agentic-orchestration` job defined in prometheus-agentic-scrape.yml.
##
## Apply with the Prometheus Operator by wrapping this in a PrometheusRule CR,
## or load it directly into the Prometheus server's rule_files section.

groups:
  - name: mesh_reconciliation_boundary
    interval: 15s
    rules:
      - alert: MeshReconciliationBoundaryDrift
        expr: |
          (
            rate(hsm_meshgate_challenge_issued_total[5m])
            /
            (
              rate(hsm_zk_mesh_state_reconciled_total[5m])
              +
              rate(hsm_meshgate_challenge_issued_total[5m])
            )
          ) > 0.1
        for: 2m
        labels:
          severity: warning
          track: "115"
          service: "hsm-vault-mesh"
        annotations:
          summary: "Track 115 mesh claim drop ratio is above 10%"
          description: "{{ $value | humanizePercentage }} of mesh state-reconciliation claims are being dropped over the last 5 minutes, indicating possible clock drift or latency at the 10s boundary."
          runbook_url: "https://github.com/tjp420/CascadeProjects/blob/main/ai-platform/docs/runbooks/MESH_BOUNDARY_DRIFT.md"

      - alert: MeshReconciliationHighDropRate
        expr: |
          rate(hsm_meshgate_challenge_issued_total[2m]) > 100
        for: 2m
        labels:
          severity: critical
          track: "115"
          service: "hsm-vault-mesh"
        annotations:
          summary: "Track 115 mesh challenge rate is critically high"
          description: "{{ $value }} challenges/second are being issued over the last 2 minutes, possibly due to replay, stale clients, or enclave attestation failure."
          runbook_url: "https://github.com/tjp420/CascadeProjects/blob/main/ai-platform/docs/runbooks/MESH_HIGH_DROP_RATE.md"

  - name: mesh_reconciliation_flow
    interval: 30s
    rules:
      - alert: MeshStateReconciliationStall
        expr: |
          rate(hsm_zk_mesh_state_reconciled_total[10m]) == 0
          and
          rate(hsm_meshgate_pool_initialized_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
          track: "115"
          service: "hsm-vault-mesh"
        annotations:
          summary: "Track 115 mesh state reconciliations have stalled"
          description: "New pools are being initialized but no state reconciliations are completing over the last 10 minutes."
          runbook_url: "https://github.com/tjp420/CascadeProjects/blob/main/ai-platform/docs/runbooks/MESH_RECONCILIATION_STALL.md"

      - alert: MeshEpochFinalityStall
        expr: |
          rate(hsm_epoch_finality_completed_total[15m]) == 0
          and
          rate(hsm_zk_mesh_state_reconciled_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          track: "115"
          service: "hsm-vault-mesh"
        annotations:
          summary: "Track 115 epoch finality completions have stalled"
          description: "Mesh state reconciliations are occurring but no epoch finality completions are observed over the last 15 minutes."
          runbook_url: "https://github.com/tjp420/CascadeProjects/blob/main/ai-platform/docs/runbooks/MESH_EPOCH_FINALITY_STALL.md"

  # ── DKG Gossip Protocol alerts (PR #391) ───────────────────────────
  # These rules monitor the DKG transcript gossip transport layer in
  # cluster-keyring-sync.cjs. They detect stalled sessions, high rejection
  # rates, disqualification spikes, and session timeouts.
  - name: dkg_gossip_alerts
    interval: 30s
    rules:
      - alert: DkgSessionStall
        expr: |
          rate(hsm_dkg_session_initiated_total[10m]) > 0
          and
          rate(hsm_dkg_session_completed_total[10m]) == 0
        for: 5m
        labels:
          severity: critical
          track: "dkg"
          service: "cluster-keyring-sync"
        annotations:
          summary: "DKG gossip sessions are stalling"
          description: "DKG sessions are being initiated but none have completed over the last 10 minutes, indicating a possible deadlock or worker pool starvation."
          runbook_url: "https://github.com/tjp420/CascadeProjects/blob/main/ai-platform/docs/runbooks/DKG_SESSION_STALL.md"

      - alert: DkgHighRejectionRate
        expr: |
          rate(hsm_dkg_share_rejected_total[5m])
          /
          (rate(hsm_dkg_share_received_total[5m]) + 1)
          > 0.3
        for: 2m
        labels:
          severity: warning
          track: "dkg"
          service: "cluster-keyring-sync"
        annotations:
          summary: "DKG share rejection rate is above 30%"
          description: "More than 30% of DKG shares are being rejected over the last 5 minutes, indicating possible peer misconfiguration or Byzantine behavior."
          runbook_url: "https://github.com/tjp420/CascadeProjects/blob/main/ai-platform/docs/runbooks/DKG_HIGH_REJECTION_RATE.md"

      - alert: DkgHighDisqualificationRate
        expr: |
          rate(hsm_dkg_node_disqualified_total[5m]) > 5
        for: 2m
        labels:
          severity: warning
          track: "dkg"
          service: "cluster-keyring-sync"
        annotations:
          summary: "DKG node disqualification rate is critically high"
          description: "Nodes are being disqualified at a rate of more than 5 per 5 minutes, indicating possible cluster instability or Byzantine fault detection."
          runbook_url: "https://github.com/tjp420/CascadeProjects/blob/main/ai-platform/docs/runbooks/DKG_HIGH_DISQUALIFICATION_RATE.md"

      - alert: DkgSessionTimeoutSpike
        expr: |
          rate(hsm_dkg_session_timeout_total[5m]) > 2
        for: 5m
        labels:
          severity: warning
          track: "dkg"
          service: "cluster-keyring-sync"
        annotations:
          summary: "DKG session timeouts are spiking"
          description: "DKG sessions are timing out at a rate of more than 2 per 5 minutes, indicating possible network partition or peer unavailability."
          runbook_url: "https://github.com/tjp420/CascadeProjects/blob/main/ai-platform/docs/runbooks/DKG_SESSION_TIMEOUT_SPIKE.md"

  # ── STEK Rotation alerts (cluster-keyring-sync.cjs) ────────────────
  # These rules monitor the Session Token Encryption Key rotation lifecycle.
  # They detect rotation failures and validation failure spikes.
  - name: stek_rotation_alerts
    interval: 30s
    rules:
      - alert: StekRotationFailure
        expr: |
          rate(hsm_stek_rotation_total[1h]) == 0
          and
          hsm_stek_active_count == 0
        for: 10m
        labels:
          severity: critical
          track: "stek"
          service: "cluster-keyring-sync"
        annotations:
          summary: "No active STEK and rotations are not happening"
          description: "There is no active STEK and no rotations have occurred in the last hour, indicating a critical key management failure."
          runbook_url: "https://github.com/tjp420/CascadeProjects/blob/main/ai-platform/docs/runbooks/STEK_ROTATION_FAILURE.md"

      - alert: StekValidationFailureSpike
        expr: |
          rate(hsm_stek_validation_failed_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
          track: "stek"
          service: "cluster-keyring-sync"
        annotations:
          summary: "STEK validation failures are spiking"
          description: "STEK validations are failing at a rate of more than 10 per 5 minutes, indicating possible key corruption or replay attacks."
          runbook_url: "https://github.com/tjp420/CascadeProjects/blob/main/ai-platform/docs/runbooks/STEK_VALIDATION_FAILURE_SPIKE.md"

  # ── MuSig2 Protocol alerts (PR #398) ───────────────────────────────
  # These rules monitor the MuSig2/FROST threshold signature protocol.
  # They detect verification failure spikes and signing stalls.
  - name: musig2_protocol_alerts
    interval: 30s
    rules:
      - alert: Musig2VerificationFailureSpike
        expr: |
          rate(hsm_musig2_signature_verification_failed_total[5m]) > 5
        for: 2m
        labels:
          severity: warning
          track: "musig2"
          service: "mpc-schnorr"
        annotations:
          summary: "MuSig2 signature verification failures are spiking"
          description: "MuSig2 signature verifications are failing at a rate of more than 5 per 5 minutes, indicating possible key mismatch or Byzantine share submission."
          runbook_url: "https://github.com/tjp420/CascadeProjects/blob/main/ai-platform/docs/runbooks/MUSIG2_VERIFICATION_FAILURE_SPIKE.md"

      - alert: Musig2SigningStall
        expr: |
          rate(hsm_musig2_signature_assembled_total[10m]) == 0
          and
          rate(hsm_musig2_challenge_computed_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
          track: "musig2"
          service: "mpc-schnorr"
        annotations:
          summary: "MuSig2 signing has stalled"
          description: "Challenges are being computed but no signatures are being assembled over the last 10 minutes, indicating possible share collection failure or aggregator deadlock."
          runbook_url: "https://github.com/tjp420/CascadeProjects/blob/main/ai-platform/docs/runbooks/MUSIG2_SIGNING_STALL.md"
