## Prometheus scrape configuration for ai-platform agentic orchestration metrics
#
# Place this snippet into your Prometheus `prometheus.yml` under `scrape_configs`.
# Ensure your Prometheus server can authenticate as an admin user (the route is protected
# by `authorize('admin:all')` in the API). Replace `bearer_token` with a secure token
# or configure basic auth / service account auth appropriate for your deployment.

scrape_configs:
  - job_name: "ai-platform-agentic-orchestration"
    scrape_interval: 15s
    metrics_path: "/api/agentic/metrics"
    # If your server requires TLS and a custom CA, configure `tls_config` here.
    # Example bearer token usage — replace with an appropriately scoped secret.
    # WARNING: storing long-lived tokens in plaintext is insecure; use a secrets
    # manager or service account mechanism where possible.
    bearer_token: "YOUR_ADMIN_ROLE_BEARER_TOKEN"

    static_configs:
      - targets: ["localhost:3000"]
