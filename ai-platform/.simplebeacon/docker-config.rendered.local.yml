
> cascade-ai-platform@1.0.0 simplebeacon:docker:config
> docker compose -f docker-compose.simplebeacon.yml -f docker-compose.simplebeacon.full.yml --profile full config

name: simplebeacon
services:
  dashboard:
    build:
      context: C:\Users\Trevor\CascadeProjects\ai-platform
      dockerfile: docker/Dockerfile.dashboard
    cap_drop:
      - ALL
    container_name: simplebeacon_dashboard
    depends_on:
      postgres:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
    environment:
      ALLOW_LEGACY_LOGIN: "false"
      DATABASE_URL: postgresql://cascade_user:secure_password@postgres:5432/cascade_ai_platform
      ENABLE_DATABASE: "true"
      ENABLE_REDIS: "true"
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      REQUIRE_AUTH: "false"
      SEED_DEMO_USERS: "false"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:54355/api/simplebeacon/baseline').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 45s
    networks:
      simplebeacon_net: null
    ports:
      - mode: ingress
        target: 54355
        published: "54355"
        protocol: tcp
      - mode: ingress
        target: 8081
        published: "8081"
        protocol: tcp
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: volume
        source: simplebeacon_state
        target: /app/.simplebeacon
        volume: {}
  metrics-collector:
    profiles:
      - collector
      - full
    container_name: simplebeacon_collector
    depends_on:
      dashboard:
        condition: service_healthy
        required: true
    entrypoint:
      - /bin/sh
      - /scripts/collector.sh
    environment:
      SIMPLEBEACON_COLLECT_INTERVAL_SEC: "600"
      SIMPLEBEACON_DASHBOARD_TOKEN: ""
      SIMPLEBEACON_DASHBOARD_URL: http://dashboard:54355
    image: curlimages/curl:8.5.0
    networks:
      simplebeacon_net: null
    volumes:
      - type: bind
        source: C:\Users\Trevor\CascadeProjects\ai-platform\docker\simplebeacon-collector.sh
        target: /scripts/collector.sh
        read_only: true
        bind:
          create_host_path: true
  postgres:
    profiles:
      - db
      - full
    container_name: simplebeacon_postgres
    environment:
      POSTGRES_DB: cascade_ai_platform
      POSTGRES_PASSWORD: secure_password
      POSTGRES_USER: cascade_user
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U cascade_user -d cascade_ai_platform
      timeout: 5s
      interval: 10s
      retries: 5
    image: postgres:15-alpine
    networks:
      simplebeacon_net: null
    ports:
      - mode: ingress
        target: 5432
        published: "5432"
        protocol: tcp
    volumes:
      - type: volume
        source: simplebeacon_postgres_data
        target: /var/lib/postgresql/data
        volume: {}
  redis:
    profiles:
      - db
      - full
    container_name: simplebeacon_redis
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 5s
      interval: 10s
      retries: 5
    image: redis:7-alpine
    networks:
      simplebeacon_net: null
    ports:
      - mode: ingress
        target: 6379
        published: "6379"
        protocol: tcp
networks:
  simplebeacon_net:
    name: simplebeacon_net
volumes:
  simplebeacon_postgres_data:
    name: simplebeacon_simplebeacon_postgres_data
  simplebeacon_state:
    name: simplebeacon_simplebeacon_state
