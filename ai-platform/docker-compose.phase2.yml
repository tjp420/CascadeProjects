version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: simplebeacon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-simplebeacon_v1_internal}
      POSTGRES_USER: ${POSTGRES_USER:-simplebeacon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-postgres-password-change-in-production}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/init:/docker-entrypoint-initdb.d
    networks:
      - simplebeacon-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-simplebeacon_user} -d ${POSTGRES_DB:-simplebeacon_v1_internal}",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: simplebeacon-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev-redis-password-change-in-production}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - simplebeacon-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis Commander (Optional - for Redis management)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: simplebeacon-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:${REDIS_PASSWORD:-dev-redis-password-change-in-production}@redis:6379
    ports:
      - "8081:8081"
    networks:
      - simplebeacon-network
    depends_on:
      - redis
    profiles:
      - tools

  # pgAdmin (Optional - for PostgreSQL management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: simplebeacon-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD required}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - simplebeacon-network
    depends_on:
      - postgres
    profiles:
      - tools

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: simplebeacon-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - simplebeacon-network
    depends_on:
      - postgres
      - redis
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  simplebeacon-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
