name: Telemetry & Health Probe CI

on:
  push:
    branches: [ main, 'feature/*' ]
  pull_request:
    branches: [ main ]

jobs:
  validate-telemetry:
    name: Execute Hardened Health Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ai-platform/package-json

      - name: Install Scoped Dependencies
        run: |
          cd ai-platform
          npm ci
          npm install prom-client supertest --save-dev

      - name: Run Isolated Jest Verification and Emit JSON
        run: |
          cd ai-platform
          npx jest --config=jest.cjs --runInBand --json --outputFile=./test-results/jest-results.json || true

      - name: Parse Jest JSON to telemetry
        run: |
          node ai-platform/tools/ci-telemetry/parse-jest-results.cjs ai-platform/test-results/jest-results.json ai-platform/test-results/

      - name: Upload CI test metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-metrics
          path: ai-platform/test-results/
          retention-days: 7

      - name: Post PR telemetry delta (only on PRs)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          CI_TELEMETRY_REGRESSION_PERCENT: '10'
          CI_TELEMETRY_REGRESSION_MS: '2000'
        run: |
          node ai-platform/tools/ci-telemetry/report-pr-delta.cjs

  compile-staging:
    name: Execute Staging Build Compression
    needs: validate-telemetry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Compile and Bundle Production Assets
        run: |
          cd ai-platform
          npm ci
          npm run build --if-present
