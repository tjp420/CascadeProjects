name: VS Code Extension CI

on:
  push:
    branches: [main, master]
    paths:
      - 'simplebeacon-vscode-merged/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'simplebeacon-vscode-merged/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simplebeacon-vscode-merged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: simplebeacon-vscode-merged/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Package extension
        run: npx vsce package --out simplebeacon.vsix

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simplebeacon-vsix
          path: simplebeacon-vscode-merged/simplebeacon.vsix

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    defaults:
      run:
        working-directory: simplebeacon-vscode-merged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: simplebeacon-vscode-merged/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Publish to marketplace
        run: npx vsce publish -p ${{ secrets.VSCE_PAT }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
