# Opt-in AI hygiene gate — enable matching rules in .simplebeacon/config.json.
# Pilot without --gate first; then use this workflow for PR enforcement.

name: SimpleBeacon AI Hygiene Gate

on:
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-hygiene-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python (AST sidecar)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run SimpleBeacon gate (offline, parallel text rules)
        working-directory: .
        env:
          SIMPLEBEACON_PARALLEL: '1'
          SIMPLEBEACON_PARALLEL_MIN_FILES: '48'
        run: |
          npx --yes simplebeacon scan \
            --format json \
            --output .simplebeacon/report.json \
            --gate \
            --offline \
            --verbose
          npx --yes simplebeacon gate status

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplebeacon-ai-hygiene-report
          path: .simplebeacon/report.json
          if-no-files-found: ignore
