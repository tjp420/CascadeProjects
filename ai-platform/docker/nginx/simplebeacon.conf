# Nginx reverse proxy for simplebeacon.ai → Simplebeacon dashboard (port 54355)
# Install: sudo cp docker/nginx/simplebeacon.conf /etc/nginx/sites-available/simplebeacon
#          sudo ln -sf /etc/nginx/sites-available/simplebeacon /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

upstream simplebeacon_app {
    server 127.0.0.1:54355;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name simplebeacon.ai www.simplebeacon.ai;

    client_max_body_size 25m;

    location / {
        proxy_pass http://simplebeacon_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location /api/simplebeacon/scan {
        proxy_pass http://simplebeacon_app;
        proxy_read_timeout 180s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
