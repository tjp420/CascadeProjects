<!-- Language Selector Component -->
<div class="language-selector" id="language-selector">
    <div class="language-dropdown">
        <button class="language-toggle" id="language-toggle">
            <span class="language-flag" id="current-language-flag">🌐</span>
            <span class="language-name" id="current-language-name">English</span>
            <span class="dropdown-arrow">▼</span>
        </button>
        <div class="language-menu" id="language-menu">
            <div class="language-item" data-lang="en">
                <span class="flag">🇺🇸</span>
                <span class="name">English</span>
                <span class="native">English</span>
            </div>
            <div class="language-item" data-lang="es">
                <span class="flag">🇪🇸</span>
                <span class="name">Spanish</span>
                <span class="native">Español</span>
            </div>
            <div class="language-item" data-lang="fr">
                <span class="flag">🇫🇷</span>
                <span class="name">French</span>
                <span class="native">Français</span>
            </div>
            <div class="language-item" data-lang="de">
                <span class="flag">🇩🇪</span>
                <span class="name">German</span>
                <span class="native">Deutsch</span>
            </div>
            <div class="language-item" data-lang="zh">
                <span class="flag">🇨🇳</span>
                <span class="name">Chinese</span>
                <span class="native">中文</span>
            </div>
            <div class="language-item" data-lang="ja">
                <span class="flag">🇯🇵</span>
                <span class="name">Japanese</span>
                <span class="native">日本語</span>
            </div>
        </div>
    </div>
</div>

<style>
.language-selector {
    position: fixed;
    top: 20px;
    left: 80px;
    z-index: 1000;
}

.language-dropdown {
    position: relative;
}

.language-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    color: var(--text-primary);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    min-width: 120px;
    justify-content: space-between;
}

.language-toggle:hover {
    background: var(--bg-tertiary);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px var(--shadow-color);
}

.language-flag {
    font-size: 16px;
}

.language-name {
    flex: 1;
    text-align: center;
    font-weight: 500;
}

.dropdown-arrow {
    font-size: 10px;
    transition: transform 0.3s ease;
}

.language-dropdown.active .dropdown-arrow {
    transform: rotate(180deg);
}

.language-menu {
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 5px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    box-shadow: 0 4px 12px var(--shadow-color);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: all 0.3s ease;
    min-width: 200px;
    max-height: 300px;
    overflow-y: auto;
}

.language-dropdown.active .language-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.language-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    transition: background-color 0.2s ease;
    border-bottom: 1px solid var(--border-color);
}

.language-item:last-child {
    border-bottom: none;
}

.language-item:hover {
    background: var(--bg-tertiary);
}

.language-item.active {
    background: var(--accent-color);
    color: white;
}

.language-item .flag {
    font-size: 20px;
    min-width: 24px;
}

.language-item .name {
    flex: 1;
    font-weight: 500;
}

.language-item .native {
    font-size: 12px;
    color: var(--text-secondary);
    opacity: 0.8;
}

.language-item.active .native {
    color: rgba(255, 255, 255, 0.8);
}

/* Mobile Responsive */
@media (max-width: 768px) {
    .language-selector {
        top: 10px;
        left: 10px;
    }
    
    .language-toggle {
        padding: 6px 10px;
        font-size: 12px;
        min-width: 100px;
    }
    
    .language-flag {
        font-size: 14px;
    }
    
    .language-menu {
        min-width: 180px;
        max-height: 250px;
    }
    
    .language-item {
        padding: 10px 12px;
    }
    
    .language-item .flag {
        font-size: 18px;
        min-width: 20px;
    }
    
    .language-item .name {
        font-size: 14px;
    }
    
    .language-item .native {
        font-size: 11px;
    }
}

@media (max-width: 480px) {
    .language-selector {
        top: 5px;
        left: 5px;
    }
    
    .language-toggle {
        padding: 5px 8px;
        font-size: 11px;
        min-width: 80px;
    }
    
    .language-flag {
        font-size: 12px;
    }
    
    .language-name {
        display: none;
    }
    
    .dropdown-arrow {
        font-size: 8px;
    }
    
    .language-menu {
        min-width: 150px;
        max-height: 200px;
    }
    
    .language-item {
        padding: 8px 10px;
    }
    
    .language-item .flag {
        font-size: 16px;
        min-width: 18px;
    }
    
    .language-item .name {
        font-size: 13px;
    }
    
    .language-item .native {
        font-size: 10px;
    }
}

/* RTL Support */
[dir="rtl"] .language-selector {
    left: auto;
    right: 80px;
}

[dir="rtl"] .language-menu {
    left: auto;
    right: 0;
}

@media (max-width: 768px) {
    [dir="rtl"] .language-selector {
        left: auto;
        right: 10px;
    }
}

@media (max-width: 480px) {
    [dir="rtl"] .language-selector {
        left: auto;
        right: 5px;
    }
}
</style>

<script>
// Language Selector JavaScript
document.addEventListener('DOMContentLoaded', function() {
    const languageToggle = document.getElementById('language-toggle');
    const languageMenu = document.getElementById('language-menu');
    const languageItems = document.querySelectorAll('.language-item');
    const currentLanguageFlag = document.getElementById('current-language-flag');
    const currentLanguageName = document.getElementById('current-language-name');
    
    // Language flags
    const languageFlags = {
        'en': '🇺🇸',
        'es': '🇪🇸',
        'fr': '🇫🇷',
        'de': '🇩🇪',
        'zh': '🇨🇳',
        'ja': '🇯🇵'
    };
    
    // Language names
    const languageNames = {
        'en': 'English',
        'es': 'Español',
        'fr': 'Français',
        'de': 'Deutsch',
        'zh': '中文',
        'ja': '日本語'
    };
    
    // Toggle dropdown
    languageToggle.addEventListener('click', function(e) {
        e.stopPropagation();
        const dropdown = this.closest('.language-dropdown');
        dropdown.classList.toggle('active');
    });
    
    // Close dropdown when clicking outside
    document.addEventListener('click', function() {
        const dropdown = document.querySelector('.language-dropdown');
        if (dropdown) {
            dropdown.classList.remove('active');
        }
    });
    
    // Handle language selection
    languageItems.forEach(item => {
        item.addEventListener('click', function(e) {
            e.stopPropagation();
            const lang = this.dataset.lang;
            
            // Update UI
            updateLanguageUI(lang);
            
            // Set language
            if (window.i18nManager) {
                window.i18nManager.setLanguage(lang);
            }
            
            // Close dropdown
            const dropdown = this.closest('.language-dropdown');
            dropdown.classList.remove('active');
            
            // Update active state
            languageItems.forEach(i => i.classList.remove('active'));
            this.classList.add('active');
        });
    });
    
    // Update language UI
    function updateLanguageUI(lang) {
        currentLanguageFlag.textContent = languageFlags[lang] || '🌐';
        currentLanguageName.textContent = languageNames[lang] || 'English';
    }
    
    // Set initial language
    if (window.i18nManager) {
        const currentLang = window.i18nManager.getCurrentLanguage();
        updateLanguageUI(currentLang);
        
        // Set active state
        languageItems.forEach(item => {
            if (item.dataset.lang === currentLang) {
                item.classList.add('active');
            }
        });
    }
    
    // Listen for language changes
    document.addEventListener('languageChange', function(e) {
        updateLanguageUI(e.detail.language);
        
        // Update active state
        languageItems.forEach(item => {
            if (item.dataset.lang === e.detail.language) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });
    });
});
</script>
