<header class="dashboard-header">
    <div class="header-content">
        <div class="logo-section">
            <h1 class="app-title">
                <i class="fas fa-brain"></i>
                AI Coding Intelligence Dashboard
            </h1>
            <p class="app-subtitle">Comprehensive Code Analysis & Insights</p>
        </div>
        
        <nav class="main-nav">
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="#dashboard" class="nav-link active" data-section="dashboard">
                        <i class="fas fa-tachometer-alt"></i>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#analysis" class="nav-link" data-section="analysis">

                </li>
                <li class="nav-item">
                    <a href="#security" class="nav-link" data-section="security">

                    <a href="#performance" class="nav-link" data-section="performance">

                    </a>
