<!-- Code Analysis Tab -->
<div class="ai-analysis-container">
    <div class="analysis-header">
        <h2>🤖 Deep Code Scanning</h2>
        <button class="btn-primary" onclick="startDeepScan()">⚡ Scan</button>
    </div>
    <div class="metrics-grid">
        <div class="metric-card">
            <h4>Security</h4>
            <div id="security-results" class="status-text">Pending scan...</div>
        </div>
        <div class="metric-card">
            <h4>Performance</h4>
            <div id="performance-results" class="status-text">Pending scan...</div>
        </div>
    </div>
</div>
