<!-- Export History Tab -->
<div class="export-history-container">
    <div class="history-controls">
        <div class="filter-controls">
            <select id="status-filter" class="form-select">
                <option value="">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="processing">Processing</option>
                <option value="completed">Completed</option>
                <option value="failed">Failed</option>
                <option value="cancelled">Cancelled</option>
            </select>
            <select id="format-filter" class="form-select">
                <option value="">All Formats</option>
                <option value="json">JSON</option>
                <option value="csv">CSV</option>
                <option value="xlsx">XLSX</option>
                <option value="pdf">PDF</option>
                <option value="md">Markdown</option>
            </select>
            <button class="btn-secondary" id="refresh-history-btn">🔄 Refresh</button>
        </div>
        <div class="action-controls">
            <button class="btn-primary" id="clear-history-btn">🗑️ Clear History</button>
            <button class="btn-secondary" id="view-statistics-btn">📊 Statistics</button>
        </div>
    </div>

    <!-- History List -->
    <div class="history-list" id="history-list">
        <div class="loading">Loading export history...</div>
    </div>

    <!-- Statistics Modal -->
    <div class="modal" id="statistics-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Export Statistics</h3>
                <button class="modal-close" id="close-statistics-modal">&times;</button>
            </div>
            <div class="modal-body" id="statistics-content">
                <p>Loading statistics...</p>
            </div>
        </div>
    </div>

    <!-- Clear History Modal -->
    <div class="modal" id="clear-history-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Clear Export History</h3>
                <button class="modal-close" id="close-clear-modal">&times;</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to clear export history?</p>
                <div class="form-group">
                    <label for="clear-status-filter">Clear only records with status:</label>
                    <select id="clear-status-filter" class="form-select">
                        <option value="">All statuses</option>
                        <option value="completed">Completed only</option>
                        <option value="failed">Failed only</option>
                    </select>
                </div>
                <div class="form-group checkbox">
                    <input type="checkbox" id="delete-files-checkbox">
                    <label for="delete-files-checkbox">Also delete export files from storage</label>
                </div>
                <div class="form-group checkbox">
                    <input type="checkbox" id="confirm-clear-checkbox">
                    <label for="confirm-clear-checkbox">I confirm I want to clear export history</label>
                </div>
                <div class="modal-actions">
                    <button class="btn-danger" id="confirm-clear-btn">Clear History</button>
                    <button class="btn-secondary" id="cancel-clear-btn">Cancel</button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>

<script>
// Export History Manager
class ExportHistoryManager {
    constructor() {
        this.apiBaseUrl = '/api/export';
        this.history = [];
        this.init();
    }

    async init() {
        this.bindEvents();
        await this.loadHistory();
    }

    bindEvents() {
        document.getElementById('refresh-history-btn').addEventListener('click', () => this.loadHistory());
        document.getElementById('clear-history-btn').addEventListener('click', () => this.openClearModal());
        document.getElementById('view-statistics-btn').addEventListener('click', () => this.viewStatistics());
        document.getElementById('close-statistics-modal').addEventListener('click', () => this.closeStatisticsModal());
        document.getElementById('close-clear-modal').addEventListener('click', () => this.closeClearModal());
        document.getElementById('confirm-clear-btn').addEventListener('click', () => this.clearHistory());
        document.getElementById('cancel-clear-btn').addEventListener('click', () => this.closeClearModal());
        document.getElementById('status-filter').addEventListener('change', () => this.loadHistory());
        document.getElementById('format-filter').addEventListener('change', () => this.loadHistory());
    }

    async loadHistory() {
        const statusFilter = document.getElementById('status-filter').value;
        const formatFilter = document.getElementById('format-filter').value;
        
        try {
            let url = `${this.apiBaseUrl}/history?limit=50`;
            if (statusFilter) url += `&status=${statusFilter}`;
            if (formatFilter) url += `&format=${formatFilter}`;
            
            const response = await fetch(url, {
                headers: {
                    'Authorization': `Bearer ${this.getAuthToken()}`
                }
            });
            const data = await response.json();
            this.history = data.records;
            this.renderHistory();
        } catch (error) {
            console.error('Error loading history:', error);
            this.renderError('Failed to load export history');
        }
    }

    renderHistory() {
        const container = document.getElementById('history-list');
        
        if (this.history.length === 0) {
            container.innerHTML = '<div class="empty-state">No export history found</div>';
            return;
        }
        
        container.innerHTML = this.history.map(record => `
            <div class="history-item">
                <div class="history-info">
                    <div class="history-name">${record.export_name}</div>
                    <div class="history-meta">
                        <span>${this.formatDate(record.created_at)}</span>
                        <span>${record.format.toUpperCase()}</span>
                        <span>${record.file_size ? this.formatFileSize(record.file_size) : 'N/A'}</span>
                    </div>
                </div>
                <div>
                    <span class="history-status status-${record.status}">${record.status}</span>
                </div>
                <div class="history-actions">
                    ${record.status === 'completed' && record.filename ? `
                        <button class="btn-secondary" onclick="exportHistoryManager.downloadFile('${record.filename}')">Download</button>
                    ` : ''}
                    <button class="btn-secondary" onclick="exportHistoryManager.deleteRecord('${record.export_id}')">Delete</button>
                </div>
            </div>
        `).join('');
    }

    renderError(message) {
        document.getElementById('history-list').innerHTML = `
            <div class="empty-state">
                <p>${message}</p>
                <button class="btn-secondary" onclick="exportHistoryManager.loadHistory()">Retry</button>
            </div>
        `;
    }

    openClearModal() {
        document.getElementById('clear-history-modal').style.display = 'flex';
    }

    closeClearModal() {
        document.getElementById('clear-history-modal').style.display = 'none';
        document.getElementById('confirm-clear-checkbox').checked = false;
        document.getElementById('delete-files-checkbox').checked = false;
    }

    async clearHistory() {
        const confirmCheckbox = document.getElementById('confirm-clear-checkbox');
        const statusFilter = document.getElementById('clear-status-filter').value;
        const deleteFiles = document.getElementById('delete-files-checkbox').checked;
        
        if (!confirmCheckbox.checked) {
            alert('Please confirm you want to clear export history');
            return;
        }
        
        try {
            const response = await fetch(`${this.apiBaseUrl}/history/clear`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${this.getAuthToken()}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    status: statusFilter || null,
                    delete_files: deleteFiles,
                    confirm: true
                })
            });

            if (!response.ok) {
                throw new Error(`Failed to clear history: ${response.statusText}`);
            }

            const result = await response.json();
            alert(`Cleared ${result.records_deleted} export records${result.files_deleted > 0 ? ` and ${result.files_deleted} files` : ''}`);
            this.closeClearModal();
            await this.loadHistory();
            
        } catch (error) {
            console.error('Error clearing history:', error);
            alert(`Failed to clear history: ${error.message}`);
        }
    }

    async viewStatistics() {
        try {
            const response = await fetch(`${this.apiBaseUrl}/history/statistics`, {
                headers: {
                    'Authorization': `Bearer ${this.getAuthToken()}`
                }
            });
            const stats = await response.json();
            this.renderStatistics(stats);
            document.getElementById('statistics-modal').style.display = 'flex';
        } catch (error) {
            console.error('Error loading statistics:', error);
            alert('Failed to load statistics');
        }
    }

    renderStatistics(stats) {
        const container = document.getElementById('statistics-content');
        container.innerHTML = `
            <div class="stat-item">
                <span class="stat-label">Total Exports</span>
                <span class="stat-value">${stats.total_exports}</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Total File Size</span>
                <span class="stat-value">${stats.total_file_size_mb} MB</span>
            </div>
            ${Object.entries(stats.status_breakdown).map(([status, count]) => `
                <div class="stat-item">
                    <span class="stat-label">${status.charAt(0).toUpperCase() + status.slice(1)}</span>
                    <span class="stat-value">${count}</span>
                </div>
            `).join('')}
            ${Object.entries(stats.format_breakdown).map(([format, count]) => `
                <div class="stat-item">
                    <span class="stat-label">${format.toUpperCase()}</span>
                    <span class="stat-value">${count}</span>
                </div>
            `).join('')}
        `;
    }

    closeStatisticsModal() {
        document.getElementById('statistics-modal').style.display = 'none';
    }

    downloadFile(filename) {
        window.location.href = `${this.apiBaseUrl}/download/${filename}`;
    }

    async deleteRecord(exportId) {
        if (!confirm('Are you sure you want to delete this export record?')) return;

        try {
            const response = await fetch(`${this.apiBaseUrl}/history/${exportId}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${this.getAuthToken()}`
                }
            });

            if (!response.ok) {
                throw new Error(`Failed to delete record: ${response.statusText}`);
            }

            await this.loadHistory();
        } catch (error) {
            console.error('Error deleting record:', error);
            alert(`Failed to delete record: ${error.message}`);
        }
    }

    formatDate(dateString) {
        const date = new Date(dateString);
        return date.toLocaleString();
    }

    formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    getAuthToken() {
        return localStorage.getItem('authToken') || '';
    }
}

// Initialize export history manager when DOM is ready
let exportHistoryManager;
document.addEventListener('DOMContentLoaded', () => {
    exportHistoryManager = new ExportHistoryManager();
});
</script>
