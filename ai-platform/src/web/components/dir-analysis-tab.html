<!-- DIR Analysis Tab -->
<div class="dir-analysis-container">
    <div class="analysis-header">
        <h2>🔍 Codebase Analysis</h2>
        <div class="directory-selector">
            <label for="directory-input">📁 Select Directory:</label>
            <div class="directory-input-group">
                <input type="text" id="directory-input" placeholder="Enter directory path or click browse..." value="./">
                <button class="btn-secondary" onclick="window.browseDirectory()">
                    <span class="btn-icon">📂</span>
                    Browse
                </button>
                <button class="btn-secondary" onclick="window.resetDirectory()">
                    <span class="btn-icon">🔄</span>
                    Reset
                </button>
            </div>
            <div class="directory-info" id="directory-info" style="display: none;">
                <div class="selected-directory-display">
                    <span class="selected-label">Currently Selected:</span>
                    <span id="selected-path" class="selected-path-text"></span>
                </div>
                <div class="directory-actions">
                    <button class="btn-small btn-primary" onclick="window.analyzeSelectedDirectory()">
                        <span class="btn-icon">🔍</span>
                        Analyze This Directory
                    </button>
                </div>
            </div>
            <div class="directory-status" id="directory-status">
                <span class="status-text">📁 Ready to analyze: <strong>./</strong></span>
            </div>
        </div>
        <div class="analysis-controls">
            <button class="btn-primary" onclick="if(window.dashboard && window.dashboard.ai) { window.analyzeSelectedDirectory(); } else { console.error('AI Bridge not available'); }">
                <span class="btn-icon">🔍</span>
                Analyze Selected Directory
            </button>
            <button class="btn-secondary" id="downloadBtn" style="display: none;" onclick="if(window.lastAnalysis) { window.dashboard.ai.downloadReport(window.lastAnalysis.data, window.lastAnalysis.analysis, 'markdown'); } else { console.error('No analysis data available'); }">
                <span class="btn-icon">📄</span>
                Download Markdown
            </button>
            <button class="btn-secondary" id="downloadPdfBtn" style="display: none;" onclick="if(window.lastAnalysis) { window.dashboard.ai.downloadReport(window.lastAnalysis.data, window.lastAnalysis.analysis, 'pdf'); } else { console.error('No analysis data available'); }">
                <span class="btn-icon">📑</span>
                Download PDF
            </button>
            <button class="btn-secondary" id="downloadExcelBtn" style="display: none;" onclick="if(window.lastAnalysis) { window.dashboard.ai.downloadReport(window.lastAnalysis.data, window.lastAnalysis.analysis, 'excel'); } else { console.error('No analysis data available'); }">
                <span class="btn-icon">📊</span>
                Download Excel
            </button>
            <button class="btn-secondary" id="downloadChecklistBtn" style="display: none;" onclick="if(window.lastAnalysis) { window.dashboard.ai.generateChecklistReport(window.lastAnalysis.data, window.lastAnalysis.analysis); } else { console.error('No analysis data available'); }">
                <span class="btn-icon">📋</span>
                Generate Checklist
            </button>
        </div>
    </div>
    
    <!-- Advanced Analytics Tabs -->
    <div class="analytics-tabs" id="analytics-tabs" style="display: none;">
        <button class="analytics-tab active" data-tab="overview" onclick="switchAnalyticsTab('overview')">📊 Overview</button>
        <button class="analytics-tab" data-tab="tree" onclick="switchAnalyticsTab('tree')">🌳 Directory Tree</button>
        <button class="analytics-tab" data-tab="graph" onclick="switchAnalyticsTab('graph')">🔗 Dependencies</button>
        <button class="analytics-tab" data-tab="insights" onclick="switchAnalyticsTab('insights')">💡 Insights</button>
    </div>
    
    <!-- Tab Content -->
    <div class="analytics-content">
        <div class="tab-pane active" id="overview-tab">
            <div id="dir-results-content">
                <div class="empty-state">
                    <p>Click "Analyze Current" to perform a deep scan of your codebase structure and quality.</p>
                </div>
            </div>
        </div>
        
        <div class="tab-pane" id="tree-tab">
            <div id="interactive-tree-container">
                <div class="real-analytics-content">
                    <h3>🌳 Directory Structure</h3>
                    <div id="directory-tree-data"></div>
                </div>
            </div>
        </div>
        
        <div class="tab-pane" id="graph-tab">
            <div id="dependency-graph-container">
                <div class="real-analytics-content">
                    <h3>🔗 File Type Distribution</h3>
                    <div id="file-type-graph"></div>
                </div>
            </div>
        </div>
        
        <div class="tab-pane" id="insights-tab">
            <div id="insights-container">
                <div class="real-analytics-content">
                    <h3>💡 AI-Powered Insights</h3>
                    <div id="ai-insights-data"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Manual trigger for debugging - can be called from browser console
window.forceInitializeTabs = function() {
    console.log('🔧 Force initializing all tabs...');
    
    // Initialize tree tab
    if (typeof window.initializeInteractiveTree === 'function') {
        window.initializeInteractiveTree({ data: {} });
    } else {
        console.error('❌ initializeInteractiveTree not available');
    }
    
    // Initialize graph tab
    if (typeof window.initializeDependencyGraph === 'function') {
        window.initializeDependencyGraph({ data: {} });
    } else {
        console.error('❌ initializeDependencyGraph not available');
    }
    
    // Initialize insights tab
    if (typeof window.initializeInsights === 'function') {
        window.initializeInsights({ data: {} });
    } else {
        console.error('❌ initializeInsights not available');
    }
    
    console.log('✅ Force initialization complete');
};

function initializeAdvancedAnalytics(analysis) {
    console.log('🚀 Initializing advanced analytics...');
    console.log('📊 Analysis data received:', analysis);
    
    // Show analytics tabs
    const analyticsTabs = document.getElementById('analytics-tabs');
    if (analyticsTabs) {
        analyticsTabs.style.display = 'flex';
        console.log('✅ Analytics tabs shown');
    } else {
        console.warn('⚠️ Analytics tabs element not found');
    }
    
    // Show all export buttons
    const downloadBtn = document.getElementById('downloadBtn');
    const downloadPdfBtn = document.getElementById('downloadPdfBtn');
    const downloadExcelBtn = document.getElementById('downloadExcelBtn');
    
    if (downloadBtn) downloadBtn.style.display = 'inline-block';
    if (downloadPdfBtn) downloadPdfBtn.style.display = 'inline-block';
    if (downloadExcelBtn) downloadExcelBtn.style.display = 'inline-block';
    
    // Initialize tab switching
    const tabs = document.querySelectorAll('.analytics-tab');
    tabs.forEach(tab => {
        tab.addEventListener('click', (e) => {
            const targetTab = e.target.getAttribute('data-tab');
            switchAnalyticsTab(targetTab);
        });
    });
    
    // Initialize interactive tree viewer
    setTimeout(() => {
        initializeInteractiveTree(analysis);
    }, 500);
    
    // Initialize dependency graph
    setTimeout(() => {
        initializeDependencyGraph(analysis);
    }, 1000);
    
    // Initialize insights
    setTimeout(() => {
        initializeInsights(analysis);
    }, 1500);
}

window.switchAnalyticsTab = function(tabName) {
    console.log('🔄 Switching to analytics tab: ' + tabName);
    
    try {
        // Hide all tab panes
        document.querySelectorAll('.tab-pane').forEach(function(pane) {
            pane.classList.remove('active');
        });
        
        // Remove active class from all tab buttons
        document.querySelectorAll('.analytics-tab').forEach(function(tab) {
            tab.classList.remove('active');
        });
        
        // Show selected tab
        var targetPane = document.getElementById(tabName + '-tab');
        if (targetPane) {
            targetPane.classList.add('active');
            console.log('✅ Tab pane activated: ' + tabName + '-tab');
            
            // Initialize content when tab is switched
            if (tabName === 'tree') {
                if (typeof window.initializeInteractiveTree === 'function') {
                    window.initializeInteractiveTree(window.lastAnalysis);
                }
            } else if (tabName === 'graph') {
                if (typeof window.initializeDependencyGraph === 'function') {
                    window.initializeDependencyGraph(window.lastAnalysis);
                }
            } else if (tabName === 'insights') {
                if (typeof window.initializeInsights === 'function') {
                    window.initializeInsights(window.lastAnalysis);
                }
            }
        } else {
            console.error('❌ Tab pane not found: ' + tabName + '-tab');
        }
        
        // Add active class to clicked tab
        var targetTab = document.querySelector('[data-tab="' + tabName + '"]');
        if (targetTab) {
            targetTab.classList.add('active');
        }
    } catch (error) {
        console.error('❌ Error switching analytics tab:', error);
        console.error('Error details:', error.message);
    }
};

window.initializeInteractiveTree = function(analysis) {
    console.log('🌳 Initializing interactive tree with real data...');
    var container = document.getElementById('directory-tree-data');
    if (!container) {
        console.warn('⚠️ directory-tree-data not found');
        return;
    }
    
    try {
        const data = analysis.data || analysis;
        const fileTypes = data?.file_types || {};
        const totalFiles = data?.total_files || data?.metadata?.totalFiles || 0;
        const totalDirectories = data?.total_directories || data?.metadata?.totalDirectories || 0;
        
        var html = '<div class="tree-visualization">';
        html += '<h4>📁 Directory Structure Overview</h4>';
        html += '<div class="tree-stats">';
        html += '<div class="tree-stat"><strong>Total Files:</strong> ' + totalFiles.toLocaleString() + '</div>';
        html += '<div class="tree-stat"><strong>Total Directories:</strong> ' + totalDirectories.toLocaleString() + '</div>';
        html += '<div class="tree-stat"><strong>File Types:</strong> ' + Object.keys(fileTypes).length + '</div>';
        html += '</div>';
        
        html += '<div class="file-type-breakdown">';
        html += '<h5>📄 File Type Distribution:</h5>';
        Object.entries(fileTypes).sort((a, b) => b[1] - a[1]).forEach(([ext, count]) => {
            const percentage = totalFiles > 0 ? ((count / totalFiles) * 100).toFixed(1) : 0;
            html += '<div class="file-type-row">';
            html += '<span class="file-ext">' + ext + '</span>';
            html += '<span class="file-count">' + count + '</span>';
            html += '<span class="file-percent">' + percentage + '%</span>';
            html += '</div>';
        });
        html += '</div>';
        
        html += '</div>';
        container.innerHTML = html;
        
        if (!document.getElementById('tree-visualization-styles')) {
            var style = document.createElement('style');
            style.id = 'tree-visualization-styles';
            style.textContent = `
                .tree-visualization { padding: 20px; background: white; border-radius: 8px; border: 1px solid #e5e7eb; }
                .tree-stats { display: flex; gap: 20px; margin-bottom: 20px; padding: 15px; background: #f9fafb; border-radius: 6px; }
                .tree-stat { color: #374151; }
                .file-type-breakdown { margin-top: 20px; }
                .file-type-row { display: flex; justify-content: space-between; padding: 10px; background: #f9fafb; border-radius: 4px; margin-bottom: 8px; }
                .file-ext { font-weight: bold; color: #1f2937; }
                .file-count { color: #6b7280; }
                .file-percent { color: #3b82f6; font-weight: bold; }
            `;
            document.head.appendChild(style);
        }
        
        console.log('✅ Interactive tree initialized with real data');
    } catch (error) {
        console.error('❌ Failed to initialize tree:', error);
        container.innerHTML = '<div class="placeholder-content"><div class="placeholder-icon">⚠️</div><h3>Error Loading Tree</h3><p>Failed to load tree: </p>';
        container.querySelector('p').appendChild(document.createTextNode(error.message));
    }
};

window.initializeDependencyGraph = function(analysis) {
    console.log('🔄 Initializing file type graph with real data...');
    var container = document.getElementById('file-type-graph');
    if (!container) {
        console.warn('⚠️ file-type-graph not found');
        return;
    }
    
    try {
        if (!window.lastAnalysis || !window.lastAnalysis.data) {
            container.innerHTML = '<div class="placeholder-content"><p>No analysis data available. Please run an analysis first.</p></div>';
            return;
        }
        
        var data = window.lastAnalysis.data;
        var fileTypes = data.file_types || {};
        var totalFiles = data.total_files || 0;
        
        var html = '<div class="file-type-chart">';
        html += '<h4>File Type Distribution</h4>';
        
        var sortedTypes = Object.entries(fileTypes).sort((a, b) => b[1] - a[1]);
        
        // Create bar chart visualization
        html += '<div class="chart-bars">';
        sortedTypes.forEach(([ext, count]) => {
            var percentage = ((count / totalFiles) * 100).toFixed(1);
            var barWidth = percentage + '%';
            html += '<div class="chart-bar-container">';
            html += '<div class="chart-bar-label">' + ext + '</div>';
            html += '<div class="chart-bar-wrapper">';
            html += '<div class="chart-bar" style="width: ' + barWidth + '"></div>';
            html += '<div class="chart-bar-value">' + percentage + '%</div>';
            html += '</div>';
            html += '<div class="chart-bar-count">' + count.toLocaleString() + ' files</div>';
            html += '</div>';
        });
        html += '</div>';
        
        html += '</div>';
        
        container.innerHTML = html;
        console.log('✅ File type graph initialized with real data');
    } catch (error) {
        console.error('❌ Failed to initialize file type graph:', error);
        container.innerHTML = '<div class="placeholder-content"><div class="placeholder-icon">⚠️</div><h3>Error Loading Graph</h3><p>Failed to load file type graph: </p>';
        container.querySelector('p').appendChild(document.createTextNode(error.message));
    }
};

window.initializeInsights = function(analysis) {
    console.log('🔄 Initializing AI insights with real data...');
    var container = document.getElementById('ai-insights-data');
    if (!container) {
        console.warn('⚠️ ai-insights-data not found');
        return;
    }
    
    try {
        if (!window.lastAnalysis || !window.lastAnalysis.analysis) {
            container.innerHTML = '<div class="placeholder-content"><p>No analysis data available. Please run an analysis first.</p></div>';
            return;
        }
        
        var analysisData = window.lastAnalysis.analysis;
        var data = window.lastAnalysis.data;
        var insights = analysisData.insights || [];
        var recommendations = analysisData.recommendations || [];
        var risks = analysisData.risks || [];
        
        var html = '<div class="insights-content">';
        
        // Show AI Insights
        if (insights.length > 0) {
            html += '<div class="insights-section"><h4>💡 AI Insights</h4>';
            insights.forEach(function(insight, index) {
                var title = insight.title || insight.message || 'Insight ' + (index + 1);
                html += '<div class="insight-card">';
                html += '<div class="insight-header">' + title + '</div>';
                if (insight.description) {
                    html += '<div class="insight-description">' + insight.description + '</div>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        
        // Show Recommendations
        if (recommendations.length > 0) {
            html += '<div class="insights-section"><h4>🎯 Recommendations</h4>';
            recommendations.forEach(function(rec, index) {
                var title = rec.title || rec.message || 'Recommendation ' + (index + 1);
                html += '<div class="recommendation-card">';
                html += '<div class="recommendation-header">' + title + '</div>';
                if (rec.description) {
                    html += '<div class="recommendation-description">' + rec.description + '</div>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        
        // Show Risks
        if (risks.length > 0) {
            html += '<div class="insights-section"><h4>⚠️ Risks</h4>';
            risks.forEach(function(risk, index) {
                var title = risk.title || risk.message || 'Risk ' + (index + 1);
                html += '<div class="risk-card">';
                html += '<div class="risk-header">' + title + '</div>';
                if (risk.description) {
                    html += '<div class="risk-description">' + risk.description + '</div>';
                }
                html += '</div>';
            });
            html += '</div>';
        }
        
        // Show Quality Metrics if available
        if (analysisData.overview) {
            html += '<div class="insights-section"><h4>📊 Quality Metrics</h4>';
            html += '<div class="quality-metrics">';
            if (analysisData.overview.codeQuality !== undefined) {
                html += '<div class="metric-item"><strong>Code Quality:</strong> ' + analysisData.overview.codeQuality + '/100</div>';
            }
            if (analysisData.overview.testCoverage !== undefined) {
                html += '<div class="metric-item"><strong>Test Coverage:</strong> ' + analysisData.overview.testCoverage + '%</div>';
            }
            if (data.metrics?.healthScore !== undefined) {
                html += '<div class="metric-item"><strong>Health Score:</strong> ' + data.metrics.healthScore + '/100</div>';
            }
            html += '</div></div>';
        }
        
        if (insights.length === 0 && recommendations.length === 0 && risks.length === 0) {
            html += '<div class="placeholder-content"><p>No AI insights available yet. Run a full analysis to generate insights.</p></div>';
        }
        
        html += '</div>';
        
        container.innerHTML = html;
        console.log('✅ AI insights initialized with real data');
    } catch (error) {
        console.error('❌ Failed to initialize insights:', error);
        container.innerHTML = '<div class="placeholder-content"><div class="placeholder-icon">⚠️</div><h3>Error Loading Insights</h3><p>Failed to load insights: </p>';
        container.querySelector('p').appendChild(document.createTextNode(error.message));
    }
};

// Update Dir Results function
function updateDirResults(analysis) {
    console.log('🔄 Updating DIR results with analysis:', analysis);
    
    const resultsDiv = document.getElementById('dir-results-content');
    if (!resultsDiv) {
        console.error('❌ Results container not found');
        return;
    }
    
    const data = analysis.data || analysis;
    const analysisData = analysis.analysis || analysis;
    
    // Extract metrics with fallbacks
    const totalFiles = data?.total_files || data?.metadata?.totalFiles || analysisData?.overview?.totalFiles || 0;
    const totalDirectories = data?.total_directories || data?.metadata?.totalDirectories || analysisData?.overview?.totalDirectories || 0;
    const codeQuality = analysisData?.overview?.codeQuality || data?.metrics?.Quality || 0;
    const testCoverage = analysisData?.overview?.testCoverage || data?.metrics?.TestCoverage || 0;
    
    // Store analysis data for export functions
    window.lastAnalysis = { data: data, analysis: analysisData };
    
    // Show export buttons after analysis
    const downloadBtn = document.getElementById('downloadBtn');
    const downloadPdfBtn = document.getElementById('downloadPdfBtn');
    const downloadExcelBtn = document.getElementById('downloadExcelBtn');
    const downloadChecklistBtn = document.getElementById('downloadChecklistBtn');
    
    if (downloadBtn) downloadBtn.style.display = 'inline-block';
    if (downloadPdfBtn) downloadPdfBtn.style.display = 'inline-block';
    if (downloadExcelBtn) downloadExcelBtn.style.display = 'inline-block';
    if (downloadChecklistBtn) downloadChecklistBtn.style.display = 'inline-block';
    
    let html = '<div class="analysis-results">';
    html += '<div class="results-header">';
    html += '<h3>📊 Analysis Results</h3>';
    html += '<div class="analysis-meta">';
    html += '<span>Generated: ' + new Date().toLocaleString() + '</span>';
    html += '</div></div>';
    
    html += '<div class="metrics-grid">';
    html += '<div class="metric-card"><div class="metric-value">' + totalFiles + '</div><div class="metric-label">Files</div></div>';
    html += '<div class="metric-card"><div class="metric-value">' + totalDirectories + '</div><div class="metric-label">Directories</div></div>';
    html += '<div class="metric-card"><div class="metric-value">' + codeQuality + '%</div><div class="metric-label">Code Quality</div></div>';
    html += '<div class="metric-card"><div class="metric-value">' + testCoverage + '%</div><div class="metric-label">Test Coverage</div></div>';
    html += '</div>';
    
    html += '<div class="analysis-section">';
    html += '<h4>📁 File Types</h4>';
    html += '<div class="file-types">';
    const fileTypes = data?.file_types || {};
    Object.entries(fileTypes).forEach(([ext, count]) => {
        html += '<div class="file-type-item"><span>' + ext + '</span><span>' + count + '</span></div>';
    });
    html += '</div></div>';
    
    html += '</div>';
    resultsDiv.innerHTML = html;
    
    // Add styles if not already present
    if (!document.getElementById('dir-analysis-styles')) {
        const style = document.createElement('style');
        style.id = 'dir-analysis-styles';
        style.textContent = `
            .analysis-results { padding: 20px; background: white; border-radius: 8px; margin-top: 20px; border: 1px solid #e5e7eb; }
            .results-header { margin-bottom: 20px; }
            .analysis-meta { display: flex; gap: 20px; font-size: 12px; color: #6b7280; }
            .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
            .metric-card { background: #f9fafb; padding: 15px; border-radius: 6px; text-align: center; }
            .metric-value { font-size: 24px; font-weight: bold; color: #1f2937; }
            .metric-label { font-size: 12px; color: #6b7280; margin-top: 5px; }
            .analysis-section { margin-bottom: 20px; }
            .analysis-section h4 { margin-bottom: 10px; color: #1f2937; }
            .file-types { display: flex; flex-direction: column; gap: 8px; }
            .file-type-item { display: flex; justify-content: space-between; padding: 8px; background: #f9fafb; border-radius: 4px; }
        `;
        document.head.appendChild(style);
    }
    
    console.log('✅ Results updated successfully');
}

</script>
</script>
