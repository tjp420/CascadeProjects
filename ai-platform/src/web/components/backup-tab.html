<!-- Backup Management Tab Component -->
<div id="backup-tab" class="tab-content" style="display: none;">
    <div class="backup-header">
        <div class="header-content">
            <div class="header-title">
                <i class="fas fa-database" style="font-size: 2rem; color: var(--primary-color)"></i>
                <h2>Backup Manager</h2>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="backupManager.loadBackupList()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
                <button class="btn btn-primary" onclick="showCreateBackupModal()">
                    <i class="fas fa-plus"></i> Create Backup
                </button>
            </div>
        </div>
    </div>

    <!-- Backup Progress -->
    <div id="backup-progress" class="backup-progress" style="display: none;">
        <h3>Backup Progress</h3>
        <div id="progress-list"></div>
    </div>

    <!-- Backup Statistics -->
    <section class="backup-stats">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon primary">
                        <i class="fas fa-database"></i>
                    </div>
                </div>
                <div class="stat-value" id="total-backups">-</div>
                <div class="stat-label">Total Backups</div>
                <div class="stat-change">Loading...</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon success">
                        <i class="fas fa-hdd"></i>
                    </div>
                </div>
                <div class="stat-value" id="total-size">-</div>
                <div class="stat-label">Total Size</div>
                <div class="stat-change">Loading...</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon info">
                        <i class="fas fa-clock"></i>
                    </div>
                </div>
                <div class="stat-value" id="recent-backups">-</div>
                <div class="stat-label">Recent (7 days)</div>
                <div class="stat-change">Loading...</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon warning">
                        <i class="fas fa-calendar"></i>
                    </div>
                </div>
                <div class="stat-value" id="last-backup">-</div>
                <div class="stat-label">Last Backup</div>
                <div class="stat-change">Loading...</div>
            </div>
        </div>
    </section>

    <!-- Backup List -->
    <section class="backup-list-section">
        <div class="section-header">
            <h3>Available Backups</h3>
            <div class="list-controls">
                <input type="text" id="backup-search" placeholder="Search backups..." class="search-input">
                <select id="backup-sort" class="sort-select">
                    <option value="date-desc">Newest First</option>
                    <option value="date-asc">Oldest First</option>
                    <option value="size-desc">Largest First</option>
                    <option value="size-asc">Smallest First</option>
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                </select>
            </div>
        </div>
        
        <div id="backup-list" class="backup-list">
            <!-- Backup items will be populated here -->
        </div>
    </section>
</div>

<!-- Create Backup Modal -->
<div id="create-backup-modal" class="modal-backup" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Create New Backup</h3>
            <button class="modal-close" onclick="hideCreateBackupModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <form id="backup-form" class="backup-form">
            <div class="form-section">
                <h4>Basic Settings</h4>
                <div class="form-group">
                    <label for="backup-name">Backup Name</label>
                    <input type="text" id="backup-name" name="backup_name" 
                           placeholder="Leave empty for auto-generated name" 
                           class="form-input">
                </div>
                
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="compression" checked>
                        <span>Enable Compression</span>
                    </label>
                </div>
            </div>

            <div class="form-section">
                <h4>Include Patterns</h4>
                <div class="pattern-list">
                    <label class="checkbox-label">
                        <input type="checkbox" name="include_patterns[]" value="src/**" checked>
                        <span>Source code (src/**)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="include_patterns[]" value="web/**" checked>
                        <span>Web application (web/**)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="include_patterns[]" value="tests/**" checked>
                        <span>Test files (tests/**)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="include_patterns[]" value="tools/**">
                        <span>Tools (tools/**)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="include_patterns[]" value="docs/**">
                        <span>Documentation (docs/**)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="include_patterns[]" value="*.md" checked>
                        <span>Markdown files (*.md)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="include_patterns[]" value="*.json" checked>
                        <span>JSON files (*.json)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="include_patterns[]" value="*.py" checked>
                        <span>Python files (*.py)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="include_patterns[]" value="*.js" checked>
                        <span>JavaScript files (*.js)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="include_patterns[]" value=".env.example">
                        <span>Environment template (.env.example)</span>
                    </label>
                </div>
            </div>

            <div class="form-section">
                <h4>Exclude Patterns</h4>
                <div class="pattern-list">
                    <label class="checkbox-label">
                        <input type="checkbox" name="exclude_patterns[]" value="node_modules/**" checked>
                        <span>Node.js dependencies (node_modules/**)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="exclude_patterns[]" value="__pycache__/**" checked>
                        <span>Python cache (__pycache__/**)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="exclude_patterns[]" value="*.pyc" checked>
                        <span>Python compiled files (*.pyc)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="exclude_patterns[]" value=".git/**" checked>
                        <span>Git repository (.git/**)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="exclude_patterns[]" value="backups/**" checked>
                        <span>Existing backups (backups/**)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="exclude_patterns[]" value="dist/**" checked>
                        <span>Distribution files (dist/**)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="exclude_patterns[]" value="build/**" checked>
                        <span>Build artifacts (build/**)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="exclude_patterns[]" value=".pytest_cache/**" checked>
                        <span>Pytest cache (.pytest_cache/**)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="exclude_patterns[]" value="*.log" checked>
                        <span>Log files (*.log)</span>
                    </label>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="hideCreateBackupModal()">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-database"></i> Create Backup
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Backup Details Modal -->
<div id="backup-details-modal" class="modal-backup" style="display: none;">
    <div class="modal-content large">
        <div class="modal-header">
            <h3>Backup Details</h3>
            <button class="modal-close" onclick="hideBackupDetailsModal()">

<script>
// Modal functions
function showCreateBackupModal() {
    document.getElementById('create-backup-modal').style.display = 'flex';
}

function hideCreateBackupModal() {
    document.getElementById('create-backup-modal').style.display = 'none';
}

function hideBackupDetailsModal() {
    document.getElementById('backup-details-modal').style.display = 'none';
}

// Load backup statistics
async function loadBackupStats() {
    try {
        const stats = await backupManager.getBackupStats();
        if (stats) {
            document.getElementById('total-backups').textContent = stats.total_backups;
            document.getElementById('total-size').textContent = backupManager.formatFileSize(stats.total_size_mb * 1024 * 1024);
            document.getElementById('recent-backups').textContent = stats.recent_backups;
            
            const lastBackup = stats.newest_backup ? new Date(stats.newest_backup).toLocaleDateString() : 'Never';
            document.getElementById('last-backup').textContent = lastBackup;
        }
    } catch (error) {
        console.error('Failed to load backup stats:', error);
    }
}

// Initialize backup statistics when tab is shown
document.addEventListener('DOMContentLoaded', () => {
    // Load stats every 30 seconds
    setInterval(loadBackupStats, 30000);
    loadBackupStats(); // Initial load
});
</script>
