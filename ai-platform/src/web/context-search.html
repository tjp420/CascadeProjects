<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Context Search - Cascade AI Platform</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --dark-color: #1f2937;
            --light-color: #f3f4f6;
            --border-color: #e5e7eb;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .main-container {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .search-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .stats-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .result-item {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 4px solid var(--primary-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .result-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .search-input {
            border-radius: 8px;
            border: 2px solid var(--border-color);
            padding: 0.75rem 1rem;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn-search {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
            color: white;
        }

        .file-path {
            font-family: 'Monaco', 'Menlo', monospace;
            background: var(--light-color);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.875rem;
        }

        .match-line {
            background: #fff3cd;
            padding: 0.5rem;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.875rem;
            margin: 0.5rem 0;
        }

        .context-line {
            opacity: 0.7;
            font-size: 0.8rem;
        }

        .badge-category {
            background: var(--primary-color);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-item {
            text-align: center;
            padding: 1rem;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
            border-radius: 8px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--dark-color);
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <div class="text-center mb-4">
            <h1 class="text-white mb-2">
                <i class="fas fa-search me-2"></i>
                Global Context Search
            </h1>
            <p class="text-white-50">Search across your entire codebase with AI-powered context awareness</p>
        </div>

        <!-- Search Interface -->
        <div class="search-card">
            <div class="row g-3">
                <div class="col-md-8">
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="form-control search-input" 
                        placeholder="Search for functions, classes, variables, or any text..."
                        autocomplete="off"
                    >
                </div>
                <div class="col-md-4">
                    <button id="searchBtn" class="btn btn-search w-100">
                        <i class="fas fa-search me-2"></i>
                        Search
                    </button>
                </div>
            </div>
            
            <!-- Search Options -->
            <div class="row mt-3">
                <div class="col-md-4">
                    <select id="categoryFilter" class="form-select">
                        <option value="">All Categories</option>
                        <option value="code">Code Files</option>
                        <option value="web">Web Files</option>
                        <option value="data">Data Files</option>
                        <option value="docs">Documentation</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <select id="typeFilter" class="form-select">
                        <option value="">All File Types</option>
                        <option value=".js">JavaScript</option>
                        <option value=".html">HTML</option>
                        <option value=".css">CSS</option>
                        <option value=".json">JSON</option>
                        <option value=".md">Markdown</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <input 
                        type="number" 
                        id="limitFilter" 
                        class="form-control" 
                        placeholder="Results limit (default: 50)"
                        min="1"
                        max="100"
                        value="50"
                    >
                </div>
            </div>
        </div>

        <!-- Statistics -->
        <div class="stats-card" id="statsCard">
            <h5 class="mb-3">
                <i class="fas fa-chart-bar me-2"></i>
                Context Statistics
            </h5>
            <div class="stats-grid" id="statsGrid">
                <!-- Stats will be populated here -->
            </div>
        </div>

        <!-- Loading Spinner -->
        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Searching through your codebase...</p>
        </div>

        <!-- Search Results -->
        <div id="searchResults">
            <!-- Results will be populated here -->
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        class ContextSearch {
            constructor() {
                this.searchInput = document.getElementById('searchInput');
                this.searchBtn = document.getElementById('searchBtn');
                this.categoryFilter = document.getElementById('categoryFilter');
                this.typeFilter = document.getElementById('typeFilter');
                this.limitFilter = document.getElementById('limitFilter');
                this.loadingSpinner = document.getElementById('loadingSpinner');
                this.searchResults = document.getElementById('searchResults');
                this.statsGrid = document.getElementById('statsGrid');
                
                this.initializeEventListeners();
                this.loadStatistics();
            }

            initializeEventListeners() {
                this.searchBtn.addEventListener('click', () => this.performSearch());
                this.searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.performSearch();
                    }
                });

                // Auto-search on filter change
                [this.categoryFilter, this.typeFilter, this.limitFilter].forEach(element => {
                    element.addEventListener('change', () => {
                        if (this.searchInput.value.trim()) {
                            this.performSearch();
                        }
                    });
                });
            }

            async loadStatistics() {
                try {
                    const response = await fetch('/api/context/stats');
                    const stats = await response.json();
                    this.displayStatistics(stats);
                } catch (error) {
                    console.error('Failed to load statistics:', error);
                }
            }

            displayStatistics(stats) {
                this.statsGrid.innerHTML = `
                    <div class="stat-item">
                        <div class="stat-number">${stats.totalFiles.toLocaleString()}</div>
                        <div class="stat-label">Total Files</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">${this.formatFileSize(stats.totalSize)}</div>
                        <div class="stat-label">Total Size</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">${Object.keys(stats.categories || {}).length}</div>
                        <div class="stat-label">Categories</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">${stats.scanDuration || 0}ms</div>
                        <div class="stat-label">Scan Time</div>
                    </div>
                `;
            }

            async performSearch() {
                const query = this.searchInput.value.trim();
                if (!query) {
                    this.showError('Please enter a search query');
                    return;
                }

                this.showLoading(true);

                try {
                    const params = new URLSearchParams({
                        q: query,
                        category: this.categoryFilter.value,
                        type: this.typeFilter.value,
                        limit: this.limitFilter.value || '50'
                    });

                    const response = await fetch(`/api/context/search?${params}`);
                    const data = await response.json();

                    if (response.ok) {
                        this.displayResults(data);
                    } else {
                        this.showError(data.error || 'Search failed');
                    }
                } catch (error) {
                    this.showError('Network error: ' + error.message);
                } finally {
                    this.showLoading(false);
                }
            }

            displayResults(data) {
                const { results, total, context } = data;

                if (results.length === 0) {
                    this.searchResults.innerHTML = `
                        <div class="search-card">
                            <div class="text-center text-muted">
                                <i class="fas fa-search fa-3x mb-3"></i>
                                <h5>No results found</h5>
                                <p>Try adjusting your search terms or filters</p>
                            </div>
                        </div>
                    `;
                    return;
                }

                const resultsHtml = `
                    <div class="search-card">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5>
                                <i class="fas fa-search me-2"></i>
                                Search Results
                            </h5>
                            <span class="badge bg-primary">${total} results</span>
                        </div>
                        <div class="mb-2 text-muted">
                            Found in ${context.totalFiles} files (${this.formatFileSize(context.totalSize)})
                        </div>
                        ${results.map(result => this.renderResult(result)).join('')}
                    </div>
                `;

                this.searchResults.innerHTML = resultsHtml;
            }

            renderResult(result) {
                const { path, type, category, matches, score } = result;
                
                return `
                    <div class="result-item">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div>
                                <span class="file-path">${path}</span>
                                <span class="badge-category ms-2">${category}</span>
                                <span class="badge bg-secondary ms-1">${type}</span>
                            </div>
                            <small class="text-muted">Score: ${score.toFixed(2)}</small>
                        </div>
                        
                        ${matches.slice(0, 3).map(match => `
                            <div class="match-line">
                                <strong>Line ${match.lineNumber}:</strong> ${match.content}
                                ${match.context ? `
                                    <div class="mt-1">
                                        ${match.context.map(ctx => `
                                            <div class="context-line ${ctx.isMatch ? 'match-line' : ''}">
                                                Line ${ctx.lineNumber}: ${ctx.content}
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                        
                        ${matches.length > 3 ? `
                            <div class="text-muted mt-2">
                                <small><i class="fas fa-ellipsis-h"></i> ${matches.length - 3} more matches</small>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            showError(message) {
                this.searchResults.innerHTML = `
                    <div class="search-card">
                        <div class="alert alert-danger" role="alert">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            ${message}
                        </div>
                    </div>
                `;
            }

            showLoading(show) {
                this.loadingSpinner.style.display = show ? 'block' : 'none';
                if (show) {
                    this.searchResults.innerHTML = '';
                }
            }

            formatFileSize(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
            }
        }

        // Initialize the search interface
        document.addEventListener('DOMContentLoaded', () => {
            new ContextSearch();
        });
    </script>
</body>
</html>
