<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGUF Navigation - Cascade AI Platform</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Styles -->
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-gradient: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --warning-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --info-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #475569;
            --accent-color: #6366f1;
            --accent-hover: #818cf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Modern Sidebar Styles */
        .sidebar-modern {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            z-index: 1000;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }

        .sidebar-modern.collapsed {
            transform: translateX(-240px);
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container {
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .logo i {
            color: var(--accent-color);
            font-size: 2rem;
        }

        .logo-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .nav-container {
            padding: 1rem 0;
        }

        .nav-section-modern {
            margin-bottom: 2rem;
        }

        .nav-title-modern {
            padding: 0.5rem 1.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-item-modern {
            margin: 0.25rem 0;
        }

        .nav-link-modern {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .nav-link-modern:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .nav-link-modern.active {
            background: var(--bg-card);
            color: var(--accent-color);
            border-left-color: var(--accent-color);
        }

        .nav-icon-modern {
            width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-toggle {
            padding: 0.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sidebar-toggle:hover {
            background: var(--accent-color);
            color: white;
        }

        .sidebar-info {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Main Content */
        .main-content-with-sidebar {
            margin-left: 280px;
            min-height: 100vh;
            transition: margin-left 0.3s ease;
        }

        .sidebar-modern.collapsed ~ .main-content-with-sidebar {
            margin-left: 40px;
        }

        .page-header {
            padding: 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .page-content {
            padding: 2rem;
        }

        .content-wrapper {
            max-width: 1200px;
            margin: 0 auto;
        }

        .content-section {
            margin-bottom: 2rem;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar-modern {
                transform: translateX(-240px);
            }
            
            .sidebar-modern.collapsed {
                transform: translateX(0);
            }
            
            .main-content-with-sidebar {
                margin-left: 0;
            }
            
            .sidebar-modern.collapsed ~ .main-content-with-sidebar {
                margin-left: 280px;
            }
        }

        /* Preserve existing styles from original file */
        
        :root {
            --color-primary: #6366f1;
            --color-secondary: #8b5cf6;
            --color-success: #10b981;
            --color-warning: #f59e0b;
            --color-danger: #ef4444;
            --color-gguv: #059669;
            --color-gguv-light: #10b981;
            --color-dark: #1e293b;
            --color-darker: #0f172a;
            --color-light: #f8fafc;
            --color-text: #e2e8f0;
            --color-text-muted: #94a3b8;
            --border-radius: 0.75rem;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--color-darker) 0%, var(--color-dark) 100%);
            color: var(--color-text);
            min-height: 100vh;
            line-height: 1.6;
            padding: 2rem;
        }

        /* Enhanced Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 320px;
            height: 100vh;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(148, 163, 184, 0.1);
            z-index: 1000;
            transition: var(--transition);
            overflow-y: auto;
            padding: 2rem 0;
        }

        .sidebar-header {
            padding: 0 1.5rem 2rem;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            background: rgba(99, 102, 241, 0.05);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 0.5rem;
        }

        .sidebar-subtitle {
            color: var(--color-text-muted);
            font-size: 0.875rem;
        }

        /* Enhanced Navigation Sections */
        .nav-section {
            padding: 1.5rem 0;
        }

        .nav-section.gguv-section {
            border-left: 3px solid var(--color-gguv);
            background: rgba(16, 185, 129, 0.05);
            margin: 0 1rem;
            padding: 1rem;
            border-radius: 0.5rem;
        }

        .nav-section-title {
            padding: 0 1.5rem;
            margin-bottom: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--color-text-muted);
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-section-title.gguv-title {
            color: var(--color-gguv);
            font-weight: 700;
        }

        .nav-section-title.gguv-title::before {
            content: '🤖';
            font-size: 1rem;
        }

        .nav-item {
            margin: 0.25rem 0;
        }

        /* Enhanced Navigation Links */
        .nav-link {
            display: flex;
            align-items: center;
            padding: 0.875rem 1.5rem;
            color: var(--color-text);
            text-decoration: none;
            transition: var(--transition);
            border-left: 3px solid transparent;
            position: relative;
            border-radius: 0 0.5rem 0.5rem 0;
        }

        .nav-link:hover {
            background: rgba(99, 102, 241, 0.1);
            color: var(--color-primary);
            border-left-color: var(--color-primary);
        }

        .nav-link.active {
            background: rgba(99, 102, 241, 0.15);
            color: var(--color-primary);
            border-left-color: var(--color-primary);
        }

        .nav-link.gguv-active {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(5, 150, 105, 0.1));
            border-left-color: var(--color-gguv);
            color: var(--color-gguv);
        }

        .nav-link.gguv-loading {
            position: relative;
            pointer-events: none;
        }

        .nav-link.gguv-loading::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.2), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .nav-icon {
            width: 20px;
            margin-right: 0.875rem;
            text-align: center;
            transition: var(--transition);
        }

        .nav-link:hover .nav-icon {
            transform: scale(1.1);
        }

        .nav-label {
            flex: 1;
            font-weight: 500;
        }

        /* Enhanced GGUF Badge */
        .nav-badge {
            margin-left: auto;
            padding: 0.125rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.025em;
            transition: var(--transition);
        }

        .nav-badge.badge-gguv {
            background: linear-gradient(135deg, var(--color-gguv), var(--color-gguv-light));
            color: white;
            box-shadow: 0 2px 4px rgba(16, 185, 129, 0.3);
        }

        .nav-badge.badge-gguv:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(16, 185, 129, 0.4);
        }

        /* Loading Indicator */
        .nav-loading {
            margin-left: 0.5rem;
            color: var(--color-gguv);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main Content */
        .main-content {
            margin-left: 320px;
            padding: 2rem;
            min-height: 100vh;
        }

        /* Demo Content */
        .demo-section {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: var(--border-radius);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .demo-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .demo-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-gguv), var(--color-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .demo-header p {
            color: var(--color-text-muted);
            font-size: 1.125rem;
        }

        /* Status Cards */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .status-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            text-align: center;
            transition: var(--transition);
        }

        .status-card:hover {
            transform: translateY(-4px);
            border-color: var(--color-gguv);
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.2);
        }

        .status-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-gguv);
            margin-bottom: 0.5rem;
        }

        .status-label {
            color: var(--color-text-muted);
            font-size: 0.875rem;
        }

        /* Action Buttons */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .action-btn {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: var(--border-radius);
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            color: var(--color-text);
            text-decoration: none;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            border-color: var(--color-gguv);
            color: var(--color-gguv);
        }

        .action-btn i {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        /* Progress Bar */
        .progress-container {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .progress-bar {
            background: rgba(148, 163, 184, 0.2);
            border-radius: 9999px;
            height: 8px;
            overflow: hidden;
            margin: 1rem 0;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--color-gguv), var(--color-primary));
            height: 100%;
            border-radius: 9999px;
            transition: width 0.5s ease;
        }

        /* Notification System */
        .notification {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 9999;
            background: var(--color-gguv);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transform: translateX(400px);
            transition: var(--transition);
            max-width: 400px;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: var(--color-danger);
        }

        .notification.warning {
            background: var(--color-warning);
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%);
            }
            
            .sidebar.open {
                transform: translateX(0);
            }
            
            .main-content {
                margin-left: 0;
            }
        }

        /* Accessibility */
        .nav-link:focus {
            outline: 2px solid var(--color-gguv);
            outline-offset: 2px;
        }

        .nav-link[aria-current="page"] {
            background: rgba(16, 185, 129, 0.15);
        }
    
    </style>
</head>
<body>
    <!-- Navigation Container - This will be populated by navigation-loader.js -->

    <!-- Main Content Area -->

            <!-- GGUF Status Display -->
            <div class="status-grid">

                    <div class="status-value" id="processing-speed">98.7%</div>

                </div>

            <div class="progress-container">

                    <i class="fas fa-download"></i>

                </button>

                    <i class="fas fa-rocket"></i>

    <!-- Notification Container -->

    <!-- Enhanced JavaScript -->
    <script>
        // GGUF Navigation Controller
        class GGUFNavigationController {
            constructor() {
                this.activeSection = 'mock-data-analyzer';
                this.gguvState = {
                    modelLoaded: false,
                    analysisComplete: false,
                    error: null,
                    loading: false
                };
                this.progress = 75;
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.startProgressSimulation();
                console.log('🚀 GGUF Navigation Controller initialized');
            }

            setupEventListeners() {
                // Handle keyboard navigation
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.clearError();
                    }
                    if (e.ctrlKey && e.key === 'g') {
                        e.preventDefault();
                        this.focusGGUFSection();
                    }
                });

                // Handle visibility changes
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        this.pauseProgress();
                    } else {
                        this.resumeProgress();
                    }
                });
            }

            async handleNavigation(sectionId, element) {
                try {
                    // Remove active state from all nav links
                    document.querySelectorAll('.nav-link').forEach(link => {
                        link.classList.remove('active', 'gguv-active');
                        link.setAttribute('aria-current', 'false');
                    });

                    // Add active state to clicked link
                    element.classList.add('active');
                    element.setAttribute('aria-current', 'page');

                    // Update active section
                    this.activeSection = sectionId;
                    
                    console.log(`🔄 Navigated to ${sectionId}`);
                    this.showNotification(`Switched to ${sectionId}`, 'info');
                } catch (error) {
                    console.error('Navigation error:', error);
                    this.showNotification('Navigation failed', 'error');
                }
            }

            async handleGGUFNavigation(sectionId, element) {
                try {
                    // Set loading state
                    this.setGGUFLoading(element, true);
                    
                    // Remove active states
                    document.querySelectorAll('.nav-link').forEach(link => {
                        link.classList.remove('active', 'gguv-active');
                        link.setAttribute('aria-current', 'false');
                    });

                    // Simulate GGUF-specific loading
                    await this.loadGGUFData(sectionId);
                    
                    // Set active state
                    element.classList.add('gguv-active');
                    element.setAttribute('aria-current', 'page');
                    
                    // Update state
                    this.activeSection = sectionId;
                    this.gguvState.loading = false;
                    this.gguvState.error = null;
                    
                    console.log(`🤖 GGUF Navigation to ${sectionId}`);
                    this.showNotification(`GGUF ${sectionId} loaded successfully!`, 'success');
                    
                } catch (error) {
                    console.error('GGUF Navigation error:', error);
                    this.setGGUFError(element, error);
                }
            }

            setGGUFLoading(element, loading) {
                this.gguvState.loading = loading;
                
                if (loading) {
                    element.classList.add('gguv-loading');
                    // Add loading indicator
                    if (!element.querySelector('.nav-loading')) {
                        const loadingIndicator = document.createElement('span');
                        loadingIndicator.className = 'nav-loading';
                        loadingIndicator.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                        element.appendChild(loadingIndicator);
                    }
                } else {
                    element.classList.remove('gguv-loading');
                    // Remove loading indicator
                    const loadingIndicator = element.querySelector('.nav-loading');
                    if (loadingIndicator) {
                        loadingIndicator.remove();
                    }
                }
            }

            setGGUFError(element, error) {
                this.gguvState.error = error;
                element.classList.remove('gguv-loading');
                element.classList.add('error');
                
                // Remove loading indicator
                const loadingIndicator = element.querySelector('.nav-loading');
                if (loadingIndicator) {
                    loadingIndicator.remove();
                }
                
                this.showNotification(`GGUF Error: ${error.message}`, 'error');
            }

            async loadGGUFData(sectionId) {
                // Simulate API call
                await this.delay(1500);
                
                // Update progress
                this.updateProgress(85, 'Loading GGUF model data...');
                
                // Simulate data loading
                await this.delay(1000);
                
                // Update status
                if (sectionId === 'mock-data-analyzer') {
                    this.updateStatus('model-status', 'Active');
                    this.updateStatus('accuracy-score', '96.8%');
                    this.updateStatus('processing-speed', '99.2%');
                    this.updateStatus('efficiency-rate', '94.1%');
                }
                
                this.updateProgress(100, 'Ready');
            }

            updateStatus(elementId, value) {
                const element = document.getElementById(elementId);
                if (element) {
                    element.textContent = value;
                    element.style.animation = 'fadeIn 0.5s ease-out';
                }
            }

            updateProgress(value, status) {
                this.progress = value;
                const progressFill = document.getElementById('progress-fill');
                const progressText = document.getElementById('progress-text');
                const progressStatus = document.getElementById('progress-status');
                
                if (progressFill) progressFill.style.width = `${value}%`;
                if (progressText) progressText.textContent = `${value}% Complete`;
                if (progressStatus) progressStatus.textContent = status;
            }

            startProgressSimulation() {
                setInterval(() => {
                    if (this.progress < 100) {
                        this.progress += Math.random() * 2;
                        if (this.progress > 100) this.progress = 100;
                        this.updateProgress(this.progress, 'Processing...');
                    }
                }, 3000);
            }

            pauseProgress() {
                // Pause progress simulation
            }

            resumeProgress() {
                // Resume progress simulation
            }

            focusGGUFSection() {
                const gguvSection = document.querySelector('.gguv-section');
                if (gguvSection) {
                    gguvSection.scrollIntoView({ behavior: 'smooth' });

    <!-- JavaScript -->
    <script src="/js/navigation-loader.js"></script>
    <script>
        // GGUF Navigation Controller
        class GGUFNavigationController {
            constructor() {
                this.activeSection = 'mock-data-analyzer';
                this.gguvState = {
                    modelLoaded: false,
                    analysisComplete: false,
                    error: null,
                    loading: false
                };
                this.progress = 75;
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.startProgressSimulation();
                console.log('🚀 GGUF Navigation Controller initialized');
            }

            setupEventListeners() {
                // Handle keyboard navigation
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.clearError();
                    }
                    if (e.ctrlKey && e.key === 'g') {
                        e.preventDefault();
                        this.focusGGUFSection();
                    }
                });

                // Handle visibility changes
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        this.pauseProgress();
                    } else {
                        this.resumeProgress();
                    }
                });
            }

            async handleNavigation(sectionId, element) {
                try {
                    // Remove active state from all nav links
                    document.querySelectorAll('.nav-link').forEach(link => {
                        link.classList.remove('active', 'gguv-active');
                        link.setAttribute('aria-current', 'false');
                    });

                    // Add active state to clicked link
                    element.classList.add('active');
                    element.setAttribute('aria-current', 'page');

                    // Update active section
                    this.activeSection = sectionId;
                    
                    console.log(`🔄 Navigated to ${sectionId}`);
                    this.showNotification(`Switched to ${sectionId}`, 'info');
                } catch (error) {
                    console.error('Navigation error:', error);
                    this.showNotification('Navigation failed', 'error');
                }
            }

            async handleGGUFNavigation(sectionId, element) {
                try {
                    // Set loading state
                    this.setGGUFLoading(element, true);
                    
                    // Remove active states
                    document.querySelectorAll('.nav-link').forEach(link => {
                        link.classList.remove('active', 'gguv-active');
                        link.setAttribute('aria-current', 'false');
                    });

                    // Simulate GGUF-specific loading
                    await this.loadGGUFData(sectionId);
                    
                    // Set active state
                    element.classList.add('gguv-active');
                    element.setAttribute('aria-current', 'page');
                    
                    // Update state
                    this.activeSection = sectionId;
                    this.gguvState.loading = false;
                    this.gguvState.error = null;
                    
                    console.log(`🤖 GGUF Navigation to ${sectionId}`);
                    this.showNotification(`GGUF ${sectionId} loaded successfully!`, 'success');
                    
                } catch (error) {
                    console.error('GGUF Navigation error:', error);
                    this.setGGUFError(element, error);
                }
            }

            setGGUFLoading(element, loading) {
                this.gguvState.loading = loading;
                
                if (loading) {
                    element.classList.add('gguv-loading');
                    // Add loading indicator
                    if (!element.querySelector('.nav-loading')) {
                        const loadingIndicator = document.createElement('span');
                        loadingIndicator.className = 'nav-loading';
                        loadingIndicator.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                        element.appendChild(loadingIndicator);
                    }
                } else {
                    element.classList.remove('gguv-loading');
                    // Remove loading indicator
                    const loadingIndicator = element.querySelector('.nav-loading');
                    if (loadingIndicator) {
                        loadingIndicator.remove();
                    }
                }
            }

            setGGUFError(element, error) {
                this.gguvState.error = error;
                element.classList.remove('gguv-loading');
                element.classList.add('error');
                
                // Remove loading indicator
                const loadingIndicator = element.querySelector('.nav-loading');
                if (loadingIndicator) {
                    loadingIndicator.remove();
                }
                
                this.showNotification(`GGUF Error: ${error.message}`, 'error');
            }

            async loadGGUFData(sectionId) {
                // Simulate API call
                await this.delay(1500);
                
                // Update progress
                this.updateProgress(85, 'Loading GGUF model data...');
                
                // Simulate data loading
                await this.delay(1000);
                
                // Update status
                if (sectionId === 'mock-data-analyzer') {
                    this.updateStatus('model-status', 'Active');
                    this.updateStatus('accuracy-score', '96.8%');
                    this.updateStatus('processing-speed', '99.2%');
                    this.updateStatus('efficiency-rate', '94.1%');
                }
                
                this.updateProgress(100, 'Ready');
            }

            updateStatus(elementId, value) {
                const element = document.getElementById(elementId);
                if (element) {
                    element.textContent = value;
                    element.style.animation = 'fadeIn 0.5s ease-out';
                }
            }

            updateProgress(value, status) {
                this.progress = value;
                const progressFill = document.getElementById('progress-fill');
                const progressText = document.getElementById('progress-text');
                const progressStatus = document.getElementById('progress-status');
                
                if (progressFill) progressFill.style.width = `${value}%`;
                if (progressText) progressText.textContent = `${value}% Complete`;
                if (progressStatus) progressStatus.textContent = status;
            }

            startProgressSimulation() {
                setInterval(() => {
                    if (this.progress < 100) {
                        this.progress += Math.random() * 2;
                        if (this.progress > 100) this.progress = 100;
                        this.updateProgress(this.progress, 'Processing...');
                    }
                }, 3000);
            }

            pauseProgress() {
                // Pause progress simulation
            }

            resumeProgress() {
                // Resume progress simulation
            }

            focusGGUFSection() {
                const gguvSection = document.querySelector('.gguv-section');
                if (gguvSection) {
                    gguvSection.scrollIntoView({ behavior: 'smooth' });
                    gguvSection.focus();
                }
            }

            clearError() {
                this.gguvState.error = null;
                document.querySelectorAll('.nav-link.error').forEach(link => {
                    link.classList.remove('error');
                });
            }

            showNotification(message, type = 'success') {
                const notification = document.getElementById('notification');
                notification.textContent = message;
                notification.className = `notification ${type}`;
                
                setTimeout(() => {
                    notification.classList.add('show');
                }, 100);
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }

            delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }
        }

        // Initialize controller
        const gguvController = new GGUFNavigationController();

        // Global functions for onclick handlers
        async function handleNavigation(sectionId, element) {
            await gguvController.handleNavigation(sectionId, element);
        }

        async function handleGGUFNavigation(sectionId, element) {
            await gguvController.handleGGUFNavigation(sectionId, element);
        }

        // Demo functions for testing
        async function simulateGGUFAnalysis() {
            const navElement = document.getElementById('gguv-analyzer-nav');
            await gguvController.handleGGUFNavigation('mock-data-analyzer', navElement);
        }

        async function simulateGGUFModelLoad() {
            const navElement = document.getElementById('gguv-model-nav');
            await gguvController.handleGGUFNavigation('model-analysis', navElement);
        }

        async function simulateGGUFOptimization() {
            const navElement = document.getElementById('gguv-optimization-nav');
            await gguvController.handleGGUFNavigation('optimization', navElement);
        }

        async function simulateGGUFError() {
            const navElement = document.getElementById('gguv-analyzer-nav');
            gguvController.setGGUFError(navElement, new Error('Network connection failed'));
        }

        // Welcome message
        setTimeout(() => {
            gguvController.showNotification('Welcome to GGUF Enhanced Navigation! 🤖', 'success');
        }, 1000);
    </script>
