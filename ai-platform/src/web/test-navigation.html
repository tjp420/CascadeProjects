<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Test - Cascade AI Platform</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: #2d2d2d;
            border-radius: 8px;
            padding: 30px;
        }
        
        .test-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .test-results {
            background: #1e1e1e;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }
        
        .status-item:last-child {
            border-bottom: none;
        }
        
        .status-success {
            color: #22c55e;
        }
        
        .status-error {
            color: #ef4444;
        }
        
        .status-pending {
            color: #f59e0b;
        }
        
        .btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        
        .btn:hover {
            background: #818cf8;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="test-header">
            <h1>🧪 Centralized Navigation Test</h1>
            <p>Testing the centralized navigation system</p>
        </div>

        <!-- Navigation Container -->

        <!-- Main Content Area -->
        
                <div class="status-item">
                    <span>Active State Detection:</span>
                    <span id="active-status" class="status-pending">Testing...</span>
                </div>
                <div class="status-item">
                    <span>Mobile Responsiveness:</span>
                    <span id="mobile-status" class="status-pending">Testing...</span>
                </div>
                <div class="status-item">
                    <span>Server Routes:</span>
                    <span id="routes-status" class="status-pending">Testing...</span>
                </div>
            </div>

            <div>
                <h3>Manual Tests</h3>
                <button class="btn" onclick="testNavigationLinks()">Test Navigation Links</button>
                <button class="btn" onclick="testActiveState()">Test Active State</button>
                <button class="btn" onclick="testMobileView()">Test Mobile View</button>
                <button class="btn" onclick="testServerRoutes()">Test Server Routes</button>
            </div>

            <div id="test-output"></div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="/js/navigation-loader.js"></script>
    <script>
        // Test functions
        function updateStatus(id, status, message) {
            const element = document.getElementById(id);
            element.className = `status-${status}`;
            element.textContent = message;
        }

        function addOutput(message) {
            const output = document.getElementById('test-output');
            output.innerHTML += `<div style="margin: 10px 0; padding: 10px; background: #1e1e1e; border-radius: 4px;">${message}</div>`;
        }

        // Test navigation component loading
        setTimeout(() => {
            const navContainer = document.querySelector('.navigation-container');
            if (navContainer && navContainer.children.length > 0) {
                updateStatus('nav-status', 'success', '✅ Loaded');
                addOutput('✅ Navigation component loaded successfully');
            } else {
                updateStatus('nav-status', 'error', '❌ Failed');
                addOutput('❌ Navigation component failed to load');
            }
        }, 2000);

        // Test active state detection
        setTimeout(() => {
            const activeLinks = document.querySelectorAll('.nav-link-modern.active');
            if (activeLinks.length > 0) {
                updateStatus('active-status', 'success', `✅ ${activeLinks.length} active`);
                addOutput(`✅ Active state detected for ${activeLinks.length} link(s)`);
            } else {
                updateStatus('active-status', 'error', '❌ None');
                addOutput('❌ No active state detected');
            }
        }, 2500);

        // Test mobile responsiveness
        setTimeout(() => {
            const sidebar = document.getElementById('main-sidebar');
            if (sidebar) {
                updateStatus('mobile-status', 'success', '✅ Responsive');
                addOutput('✅ Mobile responsiveness working');
            } else {
                updateStatus('mobile-status', 'error', '❌ Failed');
                addOutput('❌ Mobile responsiveness failed');
            }
        }, 3000);

        // Test server routes
        fetch('/components/navigation-sidebar.html')
            .then(response => {
                if (response.ok) {
                    updateStatus('routes-status', 'success', '✅ Working');
                    addOutput('✅ Navigation component route working');
                } else {
                    updateStatus('routes-status', 'error', '❌ Failed');
                    addOutput('❌ Navigation component route failed');
                }
            })
            .catch(error => {
                updateStatus('routes-status', 'error', '❌ Error');
                addOutput(`❌ Server route error: ${error.message}`);
            });

        // Manual test functions
        function testNavigationLinks() {
            const links = document.querySelectorAll('.nav-link-modern');
            addOutput(`🔗 Found ${links.length} navigation links`);
            links.forEach((link, index) => {
                const href = link.getAttribute('href');
                const text = link.textContent.trim();
                addOutput(`  ${index + 1}. ${text} → ${href}`);
            });
        }

        function testActiveState() {
            const currentPath = window.location.pathname;
            const activeLinks = document.querySelectorAll('.nav-link-modern.active');
            addOutput(`📍 Current path: ${currentPath}`);
            addOutput(`🎯 Active links: ${activeLinks.length}`);
            activeLinks.forEach(link => {
                addOutput(`  ✓ ${link.textContent.trim()} (${link.getAttribute('href')})`);
            });
        }

        function testMobileView() {
            const sidebar = document.getElementById('main-sidebar');
            if (sidebar) {
                addOutput(`📱 Testing mobile view...`);
                sidebar.classList.add('collapsed');
                setTimeout(() => {
                    sidebar.classList.remove('collapsed');
                    addOutput(`📱 Mobile toggle test completed`);
                }, 1000);
            }
        }

        function testServerRoutes() {
            addOutput(`🌐 Testing server routes...`);
            
            // Test navigation component route
            fetch('/components/navigation-sidebar.html')
                .then(response => {
                    addOutput(`  Navigation component: ${response.status} ${response.ok ? '✅' : '❌'}`);
                })
                .catch(error => {
                    addOutput(`  Navigation component: ❌ ${error.message}`);
                });

            // Test navigation loader route
            fetch('/js/navigation-loader.js')
                .then(response => {
                    addOutput(`  Navigation loader: ${response.status} ${response.ok ? '✅' : '❌'}`);
                })
                .catch(error => {
                    addOutput(`  Navigation loader: ❌ ${error.message}`);
                });
        }

        // Auto-run tests after page load
        window.addEventListener('load', () => {
            setTimeout(() => {
                addOutput('🧪 Running automated tests...');
                testNavigationLinks();
                testActiveState();
                testMobileView();
                testServerRoutes();
            }, 4000);
        });
    </script>
</body>
</html>
