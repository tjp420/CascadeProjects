<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Auth Test - Cascade AI Platform</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Styles -->
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-gradient: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --warning-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --info-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #475569;
            --accent-color: #6366f1;
            --accent-hover: #818cf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Modern Sidebar Styles */
        .sidebar-modern {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            z-index: 1000;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }

        .sidebar-modern.collapsed {
            transform: translateX(-240px);
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container {
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .logo i {
            color: var(--accent-color);
            font-size: 2rem;
        }

        .logo-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .nav-container {
            padding: 1rem 0;
        }

        .nav-section-modern {
            margin-bottom: 2rem;
        }

        .nav-title-modern {
            padding: 0.5rem 1.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-item-modern {
            margin: 0.25rem 0;
        }

        .nav-link-modern {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .nav-link-modern:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .nav-link-modern.active {
            background: var(--bg-card);
            color: var(--accent-color);
            border-left-color: var(--accent-color);
        }

        .nav-icon-modern {
            width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-toggle {
            padding: 0.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sidebar-toggle:hover {
            background: var(--accent-color);
            color: white;
        }

        .sidebar-info {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Main Content */
        .main-content-with-sidebar {
            margin-left: 280px;
            min-height: 100vh;
            transition: margin-left 0.3s ease;
        }

        .sidebar-modern.collapsed ~ .main-content-with-sidebar {
            margin-left: 40px;
        }

        .page-header {
            padding: 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .page-content {
            padding: 2rem;
        }

        .content-wrapper {
            max-width: 1200px;
            margin: 0 auto;
        }

        .content-section {
            margin-bottom: 2rem;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar-modern {
                transform: translateX(-240px);
            }
            
            .sidebar-modern.collapsed {
                transform: translateX(0);
            }
            
            .main-content-with-sidebar {
                margin-left: 0;
            }
            
            .sidebar-modern.collapsed ~ .main-content-with-sidebar {
                margin-left: 280px;
            }
        }

        /* Preserve existing styles from original file */
        
    </style>
</head>
<body>
    <!-- Navigation Container - This will be populated by navigation-loader.js -->

    <!-- Main Content Area -->
    
            <div class="card-body">
                <button id="testInvalidBtn" class="btn btn-danger">Test Wrong Credentials</button>
                <button id="testValidBtn" class="btn btn-success ms-2">Test Valid Credentials</button>
                
                <div id="result" class="mt-3 alert alert-info">
                    Click a button to test authentication
                </div>
            </div>
        </div>
        
        <div class="card mt-4">
            <div class="card-header bg-info text-white">
                <h5>Available Demo Credentials</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-3">
                        <small>
                            <strong>Admin:</strong><br>
                            admin@demo.com<br>
                            admin123
                        </small>
                    </div>
                    <div class="col-md-3">
                        <small>
                            <strong>Analyst:</strong><br>
                            analyst@demo.com<br>
                            analyst123
                        </small>
                    </div>
                    <div class="col-md-3">
                        <small>
                            <strong>Developer:</strong><br>
                            developer@demo.com<br>
                            dev123
                        </small>
                    </div>
                    <div class="col-md-3">
                        <small>
                            <strong>Viewer:</strong><br>
                            viewer@demo.com<br>
                            view123
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth/auth_manager.js"></script>
    <script>
        const resultDiv = document.getElementById('result');
        
        // Test invalid credentials
        document.getElementById('testInvalidBtn').addEventListener('click', async () => {
            resultDiv.className = 'alert alert-warning';
            resultDiv.innerHTML = '<strong>Testing invalid credentials...</strong>';
            
            try {
                const result = await window.authManager.login('wrong@demo.com', 'wrongpass');
                
                if (!result.success) {
                    resultDiv.className = 'alert alert-danger';
                    resultDiv.innerHTML = `
                        <strong>❌ Invalid Credentials Error:</strong><br>
                        <code>${result.error}</code><br><br>
                        <em>✅ This helpful error shows users exactly what credentials to use!</em>
                    `;
                }
            } catch (error) {
                resultDiv.className = 'alert alert-danger';
                resultDiv.innerHTML = `<strong>Error:</strong> ${error.message}`;
            }
        });
        
        // Test valid credentials
        document.getElementById('testValidBtn').addEventListener('click', async () => {
            resultDiv.className = 'alert alert-warning';
            resultDiv.innerHTML = '<strong>Testing valid credentials...</strong>';
            
            try {
                const result = await window.authManager.login('admin@demo.com', 'admin123');
                
                if (result.success) {
                    resultDiv.className = 'alert alert-success';
                    resultDiv.innerHTML = `
                        <strong>✅ Login Successful!</strong><br>
                        User: ${result.user.name}<br>
                        Email: ${result.user.email}<br>
                        Role: ${result.user.role}
                    `;
                }
            } catch (error) {
                resultDiv.className = 'alert alert-danger';
                resultDiv.innerHTML = `<strong>Error:</strong> ${error.message}`;
            }
        });
    </script>

    </div>

    <!-- JavaScript -->
    <script src="/js/navigation-loader.js"></script>

</body>
</html>
