<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Generation System - Cascade AI Platform</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Styles -->
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-gradient: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --warning-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --info-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #475569;
            --accent-color: #6366f1;
            --accent-hover: #818cf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Modern Sidebar Styles */
        .sidebar-modern {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            z-index: 1000;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }

        .sidebar-modern.collapsed {
            transform: translateX(-240px);
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container {
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .logo i {
            color: var(--accent-color);
            font-size: 2rem;
        }

        .logo-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .nav-container {
            padding: 1rem 0;
        }

        .nav-section-modern {
            margin-bottom: 2rem;
        }

        .nav-title-modern {
            padding: 0.5rem 1.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-item-modern {
            margin: 0.25rem 0;
        }

        .nav-link-modern {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .nav-link-modern:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .nav-link-modern.active {
            background: var(--bg-card);
            color: var(--accent-color);
            border-left-color: var(--accent-color);
        }

        .nav-icon-modern {
            width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-toggle {
            padding: 0.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sidebar-toggle:hover {
            background: var(--accent-color);
            color: white;
        }

        .sidebar-info {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Main Content */
        .main-content-with-sidebar {
            margin-left: 280px;
            min-height: 100vh;
            transition: margin-left 0.3s ease;
        }

        .sidebar-modern.collapsed ~ .main-content-with-sidebar {
            margin-left: 40px;
        }

        .page-header {
            padding: 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .page-content {
            padding: 2rem;
        }

        .content-wrapper {
            max-width: 1200px;
            margin: 0 auto;
        }

        .content-section {
            margin-bottom: 2rem;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar-modern {
                transform: translateX(-240px);
            }
            
            .sidebar-modern.collapsed {
                transform: translateX(0);
            }
            
            .main-content-with-sidebar {
                margin-left: 0;
            }
            
            .sidebar-modern.collapsed ~ .main-content-with-sidebar {
                margin-left: 280px;
            }
        }

        /* Preserve existing styles from original file */
        
        :root {
            --color-primary: #6366f1;
            --color-secondary: #8b5cf6;
            --color-success: #10b981;
            --color-warning: #f59e0b;
            --color-danger: #ef4444;
            --color-generating: #6366f1;
            --color-idle: #10b981;
            --color-dark: #1e293b;
            --color-darker: #0f172a;
            --color-light: #f8fafc;
            --color-text: #e2e8f0;
            --color-text-muted: #94a3b8;
            --border-radius: 0.75rem;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--color-darker) 0%, var(--color-dark) 100%);
            color: var(--color-text);
            min-height: 100vh;
            line-height: 1.6;
            padding: 2rem;
        }

        /* Enhanced Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 320px;
            height: 100vh;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(148, 163, 184, 0.1);
            z-index: 1000;
            transition: var(--transition);
            overflow-y: auto;
            padding: 2rem 0;
        }

        .sidebar-header {
            padding: 0 1.5rem 2rem;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            background: rgba(99, 102, 241, 0.05);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 0.5rem;
        }

        .sidebar-subtitle {
            color: var(--color-text-muted);
            font-size: 0.875rem;
        }

        /* Enhanced Navigation Sections */
        .nav-section {
            padding: 1.5rem 0;
        }

        .nav-section.code-generation-section {
            border-left: 3px solid var(--color-primary);
            background: rgba(99, 102, 241, 0.05);
            margin: 0 1rem;
            padding: 1rem;
            border-radius: 0.5rem;
        }

        .nav-section-title {
            padding: 0 1.5rem;
            margin-bottom: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--color-text-muted);
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-section-title.code-generation-title {
            color: var(--color-primary);
            font-weight: 700;
        }

        .nav-section-title.code-generation-title::before {
            content: '💻';
            font-size: 1rem;
        }

        .nav-item {
            margin: 0.25rem 0;
        }

        /* Enhanced Navigation Links */
        .nav-link {
            display: flex;
            align-items: center;
            padding: 0.875rem 1.5rem;
            color: var(--color-text);
            text-decoration: none;
            transition: var(--transition);
            border-left: 3px solid transparent;
            position: relative;
            border-radius: 0 0.5rem 0.5rem 0;
        }

        .nav-link:hover {
            background: rgba(99, 102, 241, 0.1);
            color: var(--color-primary);
            border-left-color: var(--color-primary);
        }

        .nav-link.active {
            background: rgba(99, 102, 241, 0.15);
            color: var(--color-primary);
            border-left-color: var(--color-primary);
        }

        .nav-link.code-generation-active {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
            border-left-color: var(--color-primary);
            color: var(--color-primary);
        }

        .nav-icon {
            width: 20px;
            margin-right: 0.875rem;
            text-align: center;
            transition: var(--transition);
        }

        .nav-link:hover .nav-icon {
            transform: scale(1.1);
        }

        .nav-label {
            flex: 1;
            font-weight: 500;
        }

        /* Dynamic Code Generation Badges */
        .nav-badge {
            margin-left: auto;
            padding: 0.125rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.025em;
            transition: var(--transition);
            position: relative;
        }

        .nav-badge.badge-generating {
            background: linear-gradient(135deg, var(--color-generating), var(--color-secondary));
            color: white;
            box-shadow: 0 2px 4px rgba(99, 102, 241, 0.3);
            animation: pulse-generating 1.5s infinite;
        }

        .nav-badge.badge-generating::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        .nav-badge.badge-idle {
            background: linear-gradient(135deg, var(--color-idle), #059669);
            color: white;
            box-shadow: 0 2px 4px rgba(16, 185, 129, 0.3);
        }

        .nav-badge.badge-error {
            background: linear-gradient(135deg, #6b7280, #4b5563);
            color: white;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes pulse-generating {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }

        /* Main Content */
        .main-content {
            margin-left: 320px;
            padding: 2rem;
            min-height: 100vh;
        }

        /* Code Generation Dashboard */
        .dashboard-header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: var(--border-radius);
            padding: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .dashboard-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--color-primary), var(--color-secondary), var(--color-success));
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .dashboard-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .dashboard-header .lead {
            color: var(--color-text);
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .dashboard-header .muted {
            color: var(--color-text-muted);
            font-size: 0.875rem;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            text-align: center;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
            opacity: 0;
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--color-primary);
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.2);
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .stat-label {
            color: var(--color-text-muted);
            font-size: 0.875rem;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        /* Template Manager */
        .template-manager {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .template-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }

        .template-filters {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .category-filter, .template-search {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: var(--color-text);
        }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            max-height: 400px;
            overflow-y: auto;
        }

        .template-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            transition: var(--transition);
        }

        .template-card:hover {
            border-color: var(--color-primary);
            transform: translateY(-2px);
        }

        .template-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .template-name {
            font-weight: 600;
            color: var(--color-text);
        }

        .template-category {
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--color-primary);
            color: white;
        }

        .template-description {
            color: var(--color-text-muted);
            margin-bottom: 0.75rem;
            line-height: 1.5;
        }

        .template-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
            color: var(--color-text-muted);
            margin-bottom: 1rem;
        }

        .template-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-use-template, .btn-preview-template {
            padding: 0.5rem 1rem;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 0.5rem;
            background: rgba(30, 41, 59, 0.5);
            color: var(--color-text);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.875rem;
        }

        .btn-use-template:hover {
            background: var(--color-success);
            border-color: var(--color-success);
            color: white;
        }

        .btn-preview-template:hover {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: white;
        }

        /* Code Editor */
        .code-editor {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .editor-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }

        .language-selector {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: var(--color-text);
        }

        .editor-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-format, .btn-validate, .btn-generate {
            padding: 0.5rem 1rem;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 0.5rem;
            background: rgba(30, 41, 59, 0.5);
            color: var(--color-text);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.875rem;
        }

        .btn-format:hover {
            background: var(--color-warning);
            border-color: var(--color-warning);
            color: white;
        }

        .btn-validate:hover {
            background: var(--color-success);
            border-color: var(--color-success);
            color: white;
        }

        .btn-generate:hover {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: white;
        }

        .editor-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .code-input {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 0.5rem;
            padding: 1rem;
            color: var(--color-text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            resize: vertical;
            min-height: 200px;
        }

        .editor-output {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 0.5rem;
            padding: 1rem;
            color: var(--color-text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            min-height: 200px;
            white-space: pre-wrap;
            overflow-y: auto;
        }

        .editor-status {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: var(--color-text-muted);
            font-size: 0.875rem;
        }

        /* Generation Progress */
        .generation-progress {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: var(--border-radius);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .progress-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .progress-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .progress-item {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: var(--border-radius);
            padding: 1rem;
            margin-bottom: 1rem;
            transition: var(--transition);
        }

        .progress-item.in-progress {
            border-left: 4px solid var(--color-primary);
        }

        .progress-item.completed {
            border-left: 4px solid var(--color-success);
        }

        .progress-item.failed {
            border-left: 4px solid var(--color-danger);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .progress-id {
            font-weight: 600;
            color: var(--color-text);
        }

        .progress-status {
            font-size: 0.875rem;
            padding: 0.125rem 0.5rem;
            border-radius: 0.25rem;
            font-weight: 600;
        }

        .progress-status.in-progress {
            background: var(--color-primary);
            color: white;
        }

        .progress-status.completed {
            background: var(--color-success);
            color: white;
        }

        .progress-status.failed {
            background: var(--color-danger);
            color: white;
        }

        .progress-info {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
            color: var(--color-text-muted);
            margin-bottom: 0.5rem;
        }

        .progress-bar {
            background: rgba(148, 163, 184, 0.2);
            border-radius: 9999px;
            height: 8px;
            overflow: hidden;
            margin: 0.75rem 0;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--color-primary), var(--color-secondary));
            height: 100%;
            border-radius: 9999px;
            transition: width 0.5s ease;
        }

        /* Action Buttons */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .action-btn {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);

    public ResponseEntity<List<User>> getAllUsers() {
        List<User> users = userService.findAll();
        return ResponseEntity.ok(users);
    }
    
    @GetMapping("/{id}")
    public ResponseEntity<User> getUserById(@PathVariable Long id) {
        User user = userService.findById(id);
        if (user != null) {
            return ResponseEntity.ok(user);
        } else {
            return ResponseEntity.notFound().build();
        }
    }
    
    @PostMapping
    public ResponseEntity<User> createUser(@RequestBody User user) {
        User createdUser = userService.save(user);
        return ResponseEntity.ok(createdUser);
    }
    
    @PutMapping("/{id}")
    public ResponseEntity<User> updateUser(@PathVariable Long id, @RequestBody User user) {
        User updatedUser = userService.update(id, user);
        if (updatedUser != null) {
            return ResponseEntity.ok(updatedUser);
        } else {
            return ResponseEntity.notFound().build();
        }
    }
    
    @DeleteMapping("/{id}")
    public ResponseEntity<Void> deleteUser(@PathVariable Long id) {
        userService.delete(id);
        return ResponseEntity.noContent().build();
    }

            updateStats() {
                document.getElementById('total-generated').textContent = this.generationStatus.completed.toLocaleString();
                document.getElementById('success-rate').textContent = this.generationStatus.successRate + '%';
                document.getElementById('active-generations').textContent = this.activeGenerations.size;
                document.getElementById('avg-time').textContent = '2.3s';
            }

            updateGenerationStatus() {
                // Simulate real-time updates
                const variation = Math.floor(Math.random() * 3) - 1; // -1 to +1
                this.generationStatus.completed = Math.max(8450, this.generationStatus.completed + variation);
                
                // Update badge
                this.updateBadge();
            }

            updateBadge() {
                const badge = document.getElementById('generation-count-badge');
                if (badge) {
                    if (this.activeGenerations.size > 0) {
                        badge.textContent = this.activeGenerations.size;
                        badge.className = 'nav-badge badge-generating';
                        badge.setAttribute('title', `${this.activeGenerations.size} active generations • ${this.generationStatus.successRate}% success rate`);
                    } else {
                        badge.textContent = this.generationStatus.completed;
                        badge.className = 'nav-badge badge-idle';
                        badge.setAttribute('title', `${this.generationStatus.completed} completed • ${this.generationStatus.successRate}% success rate`);
                    }
                }
            }

            updateProgressStats() {
                const total = this.activeGenerations.size + this.completedGenerations.size;
                const completed = this.completedGenerations.size;
                const successRate = total > 0 ? (completed / total) * 100 : 0;
                
                this.progressStats = {
                    active: this.activeGenerations.size,
                    queue: this.activeGenerations.size,
                    completed: completed,
                    successRate: successRate
                };
                
                this.updateStats();
            }

            async generateCode(type, template = null, parameters = {}) {
                const generationId = this.generateId();
                const generation = {
                    id: generationId,
                    type: type,
                    template: template,
                    parameters: parameters,
                    status: 'in-progress',
                    startTime: Date.now(),
                    endTime: null,
                    result: null,
                    error: null
                };
                
                this.activeGenerations.set(generationId, generation);
                this.updateProgressStats();
                this.renderProgressItem(generation);
                
                try {
                    // Simulate generation process
                    await this.simulateGeneration(generationId, type, template);
                    
                    // Complete generation
                    this.completeGeneration(generationId, { success: true });
                    
                } catch (error) {
                    // Handle generation failure
                    this.completeGeneration(generationId, { success: false, error: error.message });
                }
            }

            async simulateGeneration(generationId, type, template) {
                // Simulate generation based on type
                const duration = this.getGenerationDuration(type);
                const steps = this.getGenerationSteps(type);
                
                // Update progress
                for (let i = 0; i < steps.length; i++) {
                    await this.updateGenerationProgress(generationId, i, steps.length, steps[i]);
                    await this.delay(duration / steps.length);
                }
                
                return {
                    success: true,
                    type: type,
                    template: template,
                    duration: duration / 1000
                };
            }

            getGenerationDuration(type) {
                const durations = {
                    'template': 3000,
                    'pattern': 4000,
                    'schema': 2500,
                    'api': 3500,
                    'component': 4500
                };
                
                return durations[type] || 3000;
            }

            getGenerationSteps(type) {
                const steps = {
                    'template': ['Analyzing template', 'Extracting structure', 'Generating code', 'Validating syntax', 'Finalizing'],
                    'pattern': ['Detecting patterns', 'Applying pattern', 'Generating code', 'Testing', 'Completing'],
                    'schema': 'Parsing schema', 'Generating models', 'Creating relationships', 'Validating', 'Done'],
                    'api': ['Analyzing requirements', 'Generating endpoints', 'Creating controllers', 'Adding validation', 'Complete'],
                    'component': ['Analyzing props', 'Generating JSX', 'Adding hooks', 'Styling', 'Finalizing']
                };
                
                return steps[type] || ['Processing', 'Generating', 'Validating', 'Complete'];
            }

            async updateGenerationProgress(generationId, currentStep, totalSteps, stepName) {
                const generation = this.activeGenerations.get(generationId);
                if (!generation) return;
                
                generation.currentStep = currentStep;
                generation.currentStepName = stepName;
                
                this.updateProgressItem(generation);
            }

            completeGeneration(generationId, result) {
                const generation = this.activeGenerations.get(generationId);
                if (!generation) return;
                
                generation.status = result.success ? 'completed' : 'failed';
                generation.endTime = Date.now();
                generation.result = result;
                
                // Move to completed
                this.completedGenerations.set(generationId, generation);
                this.activeGenerations.delete(generationId);
                
                this.updateProgressStats();
                this.updateProgressItem(generation);
                
                // Update stats
                if (result.success) {
                    this.generationStatus.completed++;
                } else {
                    this.generationStatus.failed++;
                }
                
                // Show notification
                const message = result.success ? 
                    `Code generation ${generationId} completed successfully in ${result.duration}s` :
                    `Failed to generate code ${generationId}: ${result.error}`;
                
                this.showNotification(message, result.success ? 'success' : 'error');
            }

            renderProgressItem(generation) {
                const progressList = document.getElementById('progress-list');
                const existingItem = progressList.querySelector(`[data-generation-id="${generation.id}"]`);
                
                const itemHTML = `
                    <div class="progress-item progress-${generation.status}" data-generation-id="${generation.id}">
                        <div class="progress-header">
                            <span class="progress-id">${generation.id}</span>
                            <span class="progress-status">${generation.status}</span>
                        </div>
                        <div class="progress-info">
                            <span class="progress-type">${generation.type}</span>
                            <span class="progress-template">${generation.template || 'Custom'}</span>
                        </div>
                        ${generation.currentStep !== undefined ? `
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${(generation.currentStep / generation.currentStepTotal) * 100}%"></div>
                            </div>
                            <div class="progress-steps">
                                <span class="step-info">${generation.currentStepName}</span>
                            </div>
                        ` : ''}
                        ${generation.result ? `
                            <div class="progress-result">
                                <span class="result-status ${generation.result.success ? 'success' : 'error'}">
                                    ${generation.result.success ? 'Success' : 'Failed'}
                                </span>
                                <span class="result-time">${generation.result.duration}s</span>
                            </div>
                        ` : ''}
                    </div>
                `;
                
                if (existingItem) {
                    existingItem.outerHTML = itemHTML;
                } else {
                    progressList.insertAdjacentHTML('beforeend', itemHTML);
                }
            }

            async simulateTemplateGeneration() {
                const template = this.templates[Math.floor(Math.random() * this.templates.length)];
                await this.generateCode('template', template.id);
            }

            async simulatePatternGeneration() {
                await this.generateCode('pattern', 'react-component');
            }

            async simulateBatchGeneration() {
                const types = ['template', 'pattern', 'schema', 'api'];
                const batch = types.slice(0, 3);
                
                this.showNotification(`Starting batch generation for ${batch.length} code items`, 'info');
                
                // Process in parallel
                const results = await Promise.allSettled(
                    batch.map(type => this.generateCode(type))
                );
                
                const successCount = results.filter(r => r.value.success).length;
                this.showNotification(
                    `Batch generation completed: ${successCount}/${batch.length} items generated`,
                    successCount === batch.length ? 'success' : 'warning'
                );
            }

            refreshData() {
                this.showNotification('Refreshing code generation data...', 'info');
                this.loadTemplates();
                this.updateStats();
                this.showNotification('Data refreshed successfully!', 'success');
            }

            showNotification(message, type = 'success') {
                const notification = document.getElementById('notification');
                notification.textContent = message;
                notification.className = `notification ${type}`;
                
                setTimeout(() => {
                    notification.classList.add('show');
                }, 100);
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);

        }

        async function validateCode() {
            const codeInput = document.getElementById('code-input');
            const editorStatus = document.getElementById('editor-status');
            
            try {
                editorStatus.textContent = 'Validating code...';
                await codeController.delay(1500);
                
                // Simulate validation
                const code = codeInput.value;
                const errors = [];
                
                // Basic validation checks
                if (code.includes('function') && !code.includes('return')) {
                    errors.push('Function missing return statement');
                }
                
                if (code.includes('if') && !code.includes('}')) {
                    errors.push('Unclosed if statement');
                }
                
                if (errors.length > 0) {
                    editorStatus.textContent = `Validation failed: ${errors.length} errors found`;
                    codeController.showNotification(`Validation failed: ${errors.length} errors`, 'error');
                } else {
                    editorStatus.textContent = 'Code validation passed';
                    codeController.showNotification('Code validation passed!', 'success');
                }
            } catch (error) {
                editorStatus.textContent = 'Validation failed';
                codeController.showNotification('Validation failed: ' + error.message, 'error');
            }
        }

        async function generateCode() {
            const languageSelector = document.getElementById('language-selector');
            const codeInput = document.getElementById('code-input');
            const editorStatus = document.getElementById('editor-status');
            
            try {
                editorStatus.textContent = 'Generating code...';
                
                // Generate code based on language
                const language = languageSelector.value;
                await codeController.generateCode('template', null, { language });
                
                // Update input with generated code
                const generatedCode = codeController.getGeneratedCode(language);
                codeInput.value = generatedCode;
                
                editorStatus.textContent = 'Code generated successfully';
                codeController.showNotification('Code generated successfully!', 'success');
            } catch (error) {
                editorStatus.textContent = 'Generation failed';
                codeController.showNotification('Generation failed: ' + error.message, 'error');
            }
        }

        // Demo functions
        async function simulateTemplateGeneration() {
            await codeController.simulateTemplateGeneration();
        }

        async function simulatePatternGeneration() {
            await codeController.simulatePatternGeneration();
        }

        async function simulateBatchGeneration() {
            await codeController.simulateBatchGeneration();
        }

        function refreshData() {
            codeController.refreshData();
        }

        // Welcome message
        setTimeout(() => {
            codeController.showNotification('Welcome to Code Generation System! 💻', 'success');
        }, 1000);
    </script>
</body>
</html>
