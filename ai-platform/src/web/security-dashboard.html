<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Platform - Cascade AI Platform</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Styles -->
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-gradient: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --warning-gradient: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --info-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #475569;
            --accent-color: #6366f1;
            --accent-hover: #818cf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Modern Sidebar Styles */
        .sidebar-modern {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            z-index: 1000;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }

        .sidebar-modern.collapsed {
            transform: translateX(-240px);
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container {
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .logo i {
            color: var(--accent-color);
            font-size: 2rem;
        }

        .logo-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .nav-container {
            padding: 1rem 0;
        }

        .nav-section-modern {
            margin-bottom: 2rem;
        }

        .nav-title-modern {
            padding: 0.5rem 1.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-item-modern {
            margin: 0.25rem 0;
        }

        .nav-link-modern {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .nav-link-modern:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .nav-link-modern.active {
            background: var(--bg-card);
            color: var(--accent-color);
            border-left-color: var(--accent-color);
        }

        .nav-icon-modern {
            width: 20px;
            text-align: center;
        }

        .sidebar-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-toggle {
            padding: 0.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sidebar-toggle:hover {
            background: var(--accent-color);
            color: white;
        }

        .sidebar-info {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Main Content */
        .main-content-with-sidebar {
            margin-left: 280px;
            min-height: 100vh;
            transition: margin-left 0.3s ease;
        }

        .sidebar-modern.collapsed ~ .main-content-with-sidebar {
            margin-left: 40px;
        }

        .page-header {
            padding: 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .page-content {
            padding: 2rem;
        }

        .content-wrapper {
            max-width: 1200px;
            margin: 0 auto;
        }

        .content-section {
            margin-bottom: 2rem;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar-modern {
                transform: translateX(-240px);
            }
            
            .sidebar-modern.collapsed {
                transform: translateX(0);
            }
            
            .main-content-with-sidebar {
                margin-left: 0;
            }
            
            .sidebar-modern.collapsed ~ .main-content-with-sidebar {
                margin-left: 280px;
            }
        }

        /* Preserve existing styles from original file */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .metric-title {
            font-size: 0.9rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .metric-value.excellent {
            color: #10b981;
        }

        .metric-value.good {
            color: #3b82f6;
        }

        .metric-value.warning {
            color: #f59e0b;
        }

        .metric-value.critical {
            color: #ef4444;
        }

        .metric-change {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .metric-change.positive {
            color: #10b981;
        }

        .metric-change.negative {
            color: #ef4444;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .chart-header {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .alerts-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .alerts-header {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .alert-item {
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 0 8px 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alert-item.info {
            border-left-color: #3b82f6;
        }

        .alert-item.warning {
            border-left-color: #f59e0b;
        }

        .alert-item.critical {
            border-left-color: #ef4444;
        }

        .alert-content {
            flex: 1;
        }

        .alert-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .alert-description {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .alert-time {
            color: #94a3b8;
            font-size: 0.8rem;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-indicator.online {
            background: #10b981;
            animation: pulse 2s infinite;
        }

        .status-indicator.offline {
            background: #ef4444;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    
    </style>
</head>
<body>
    <!-- Navigation Container - This will be populated by navigation-loader.js -->

    <!-- Main Content Area -->

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-header">
                    <span class="metric-title">Security Score</span>
                    <span class="status-indicator online"></span>
                </div>
                <div class="metric-value excellent" id="security-score">100/100</div>
                <div class="metric-change positive">↑ Perfect score</div>
            </div>

            <div class="metric-card">
                <div class="metric-header">
                    <span class="metric-title">Vulnerabilities</span>
                    <span class="status-indicator online"></span>
                </div>
                <div class="metric-value excellent" id="vulnerabilities">0</div>
                <div class="metric-change positive">↓ No vulnerabilities</div>
            </div>

            <div class="metric-card">
                <div class="metric-header">
                    <span class="metric-title">Threats Blocked</span>
                    <span class="status-indicator online"></span>
                </div>
                <div class="metric-value good" id="threats-blocked">0</div>
                <div class="metric-change">Last 24h</div>
            </div>

            <div class="metric-card">
                <div class="metric-header">
                    <span class="metric-title">Security Events</span>
                    <span class="status-indicator online"></span>
                </div>
                <div class="metric-value good" id="security-events">0</div>
                <div class="metric-change">Last hour</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-header">📊 Security Score Trend</div>
                <div class="chart-container">
                    <canvas id="security-chart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <div class="chart-header">🔍 Threat Detection</div>
                <div class="chart-container">
                    <canvas id="threat-chart"></canvas>
                </div>
            </div>
        </div>

        <div class="alerts-section">
            <div class="alerts-header">🚨 Recent Security Alerts</div>
            <div id="alerts-container">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading security alerts...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize socket connection
        const socket = io('http://localhost:3003');
        
        // Security metrics
        let securityData = {
            score: 100,
            vulnerabilities: 0,
            threatsBlocked: 0,
            securityEvents: 0,
            alerts: []
        };

        // Initialize charts
        const securityChart = new Chart(document.getElementById('security-chart'), {
            type: 'line',
            data: {
                labels: ['1h ago', '45m ago', '30m ago', '15m ago', 'Now'],
                datasets: [{
                    label: 'Security Score',
                    data: [100, 100, 100, 100, 100],
                    borderColor: '#10b981',
                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                    tension: 0.4,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        min: 90,
                        max: 100,
                        grid: {
                            color: 'rgba(255, 255, 255, 0.1)'
                        },
                        ticks: {
                            color: '#94a3b8'
                        }
                    },
                    x: {
                        grid: {
                            color: 'rgba(255, 255, 255, 0.1)'
                        },
                        ticks: {
                            color: '#94a3b8'
                        }
                    }
                }
            }
        });

        const threatChart = new Chart(document.getElementById('threat-chart'), {
            type: 'doughnut',
            data: {
                labels: ['Blocked', 'Detected', 'Cleared'],
                datasets: [{
                    data: [0, 0, 0],
                    backgroundColor: [
                        '#10b981',
                        '#f59e0b',
                        '#3b82f6'
                    ],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            color: '#94a3b8'
                        }
                    }
                }
            }
        });

        // Socket event listeners
        socket.on('security-update', (data) => {
            updateSecurityMetrics(data);
        });

        socket.on('security-alert', (alert) => {
            addSecurityAlert(alert);
        });

        // Update security metrics
        function updateSecurityMetrics(data) {
            securityData = { ...securityData, ...data };
            
            // Update metric cards
            document.getElementById('security-score').textContent = `${data.securityScore}/100`;
            document.getElementById('vulnerabilities').textContent = data.vulnerabilities;
            document.getElementById('threats-blocked').textContent = data.threatsBlocked;
            document.getElementById('security-events').textContent = data.securityEvents;
            
            // Update charts
            updateCharts();
        }

        // Update charts
        function updateCharts() {
            // Update security score trend
            const currentScore = securityData.score;
            securityChart.data.datasets[0].data = [
                currentScore, currentScore, currentScore, currentScore, currentScore
            ];
            securityChart.update();

            // Update threat detection
            threatChart.data.datasets[0].data = [
                securityData.threatsBlocked,
                securityData.securityEvents,
                securityData.vulnerabilities
            ];
            threatChart.update();
        }

        // Add security alert
        function addSecurityAlert(alert) {
            const alertsContainer = document.getElementById('alerts-container');
            
            // Remove loading message if present
            const loadingElement = alertsContainer.querySelector('.loading');
            if (loadingElement) {
                loadingElement.remove();
            }

            const alertElement = document.createElement('div');
            alertElement.className = `alert-item ${alert.severity}`;
            alertElement.innerHTML = `
                <div class="alert-content">
                    <div class="alert-title">${alert.type}</div>
                    <div class="alert-description">${alert.message}</div>
                </div>
                <div class="alert-time">${new Date(alert.timestamp).toLocaleTimeString()}</div>
            `;

            // Add to top of alerts list
            alertsContainer.insertBefore(alertElement, alertsContainer.firstChild);

            // Keep only last 10 alerts
            const alerts = alertsContainer.querySelectorAll('.alert-item');
            if (alerts.length > 10) {
                alerts[alerts.length - 1].remove();
            }
        }

        // Fetch initial security data
        async function fetchSecurityData() {
            try {
                const response = await fetch('/api/security/status');
                const data = await response.json();
                updateSecurityMetrics(data);
            } catch (error) {
                console.error('Error fetching security data:', error);
            }
        }

        // Initialize dashboard
        fetchSecurityData();
        setInterval(fetchSecurityData, 30000); // Update every 30 seconds

        // Add initial alerts
        setTimeout(() => {
            addSecurityAlert({
                type: 'System Status',
                severity: 'info',
                message: 'Security monitoring initialized successfully',
                timestamp: new Date().toISOString()
            });
        }, 1000);
    </script>

    </div>
