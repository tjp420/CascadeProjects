<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dashboard Test - Navigation Fix</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: #2d2d2d;
            border-radius: 8px;
            padding: 30px;
        }
        
        .test-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .test-results {
            background: #1e1e1e;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }
        
        .status-item:last-child {
            border-bottom: none;
        }
        
        .status-success {
            color: #22c55e;
        }
        
        .status-error {
            color: #ef4444;
        }
        
        .status-pending {
            color: #f59e0b;
        }
        
        .btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        
        .btn:hover {
            background: #818cf8;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="test-header">
            <h1>🧪 AI Dashboard Navigation Test</h1>
            <p>Testing the navigation fix for ai_dashboard.html</p>
        </div>

        <!-- Navigation Container -->
        <div class="navigation-container"></div>

        <!-- Main Content Area -->
        <div class="main-content-with-sidebar">
            <h2>Navigation Test Results</h2>
            
            <div class="test-results">
                <div class="status-item">
                    <span>Navigation Component Loading:</span>
                    <span id="nav-status" class="status-pending">Testing...</span>
                </div>
                <div class="status-item">
                    <span>AI Dashboard File Structure:</span>
                    <span id="file-status" class="status-pending">Testing...</span>
                </div>
                <div class="status-item">
                    <span>Navigation Container Present:</span>
                    <span id="container-status" class="status-pending">Testing...</span>
                </div>
                <div class="status-item">
                    <span>Main Content Wrapper:</span>
                    <span id="wrapper-status" class="status-pending">Testing...</span>
                </div>
            </div>

            <div>
                <h3>Manual Tests</h3>
                <button class="btn" onclick="testNavigation()">Test Navigation</button>
                <button class="btn" onclick="testAIDashboard()">Test AI Dashboard</button>
                <button class="btn" onclick="checkFileStructure()">Check File Structure</button>
            </div>

            <div id="test-output"></div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="/js/navigation-loader.js"></script>
    <script>
        // Test functions
        function updateStatus(id, status, message) {
            const element = document.getElementById(id);
            element.className = `status-${status}`;
            element.textContent = message;
        }

        function addOutput(message) {
            const output = document.getElementById('test-output');
            output.innerHTML += `<div style="margin: 10px 0; padding: 10px; background: #1e1e1e; border-radius: 4px;">${message}</div>`;
        }

        // Test navigation component loading
        setTimeout(() => {
            const navContainer = document.querySelector('.navigation-container');
            if (navContainer && navContainer.children.length > 0) {
                updateStatus('nav-status', 'success', '✅ Loaded');
                addOutput('✅ Navigation component loaded successfully');
            } else {
                updateStatus('nav-status', 'error', '❌ Failed');
                addOutput('❌ Navigation component failed to load');
            }
        }, 2000);

        // Test file structure
        fetch('/ai_dashboard.html')
            .then(response => response.text())
            .then(html => {
                if (html.includes('navigation-container')) {
                    updateStatus('file-status', 'success', '✅ Fixed');
                    addOutput('✅ AI Dashboard file has navigation container');
                } else {
                    updateStatus('file-status', 'error', '❌ Missing');
                    addOutput('❌ AI Dashboard file missing navigation container');
                }
                
                if (html.includes('main-content-with-sidebar')) {
                    updateStatus('wrapper-status', 'success', '✅ Fixed');
                    addOutput('✅ AI Dashboard file has main content wrapper');
                } else {
                    updateStatus('wrapper-status', 'error', '❌ Missing');
                    addOutput('❌ AI Dashboard file missing main content wrapper');
                }
            })
            .catch(error => {
                updateStatus('file-status', 'error', '❌ Error');
                addOutput(`❌ Error checking file: ${error.message}`);
            });

        // Manual test functions
        function testNavigation() {
            const navContainer = document.querySelector('.navigation-container');
            if (navContainer) {
                addOutput(`🔍 Navigation container found: ${navContainer.children.length} child elements`);
                const sidebar = document.getElementById('main-sidebar');
                if (sidebar) {
                    addOutput('✅ Sidebar element found in DOM');
                } else {
                    addOutput('❌ Sidebar element not found in DOM');
                }
            } else {
                addOutput('❌ Navigation container not found');
            }
        }

        function testAIDashboard() {
            addOutput('🔗 Testing AI Dashboard page...');
            window.open('/ai_dashboard.html', '_blank');
        }

        function checkFileStructure() {
            addOutput('📁 Checking AI Dashboard file structure...');
            fetch('/ai_dashboard.html')
                .then(response => response.text())
                .then(html => {
                    addOutput(`📄 File size: ${html.length} characters`);
                    addOutput(`🔍 Contains navigation-container: ${html.includes('navigation-container')}`);
                    addOutput(`🔍 Contains main-content-with-sidebar: ${html.includes('main-content-with-sidebar')}`);
                    addOutput(`🔍 Contains navigation-loader.js: ${html.includes('navigation-loader.js')}`);
                })
                .catch(error => {
                    addOutput(`❌ Error: ${error.message}`);
                });
        }

        // Auto-run tests after page load
        window.addEventListener('load', () => {
            setTimeout(() => {
                addOutput('🧪 Running automated tests...');
                testNavigation();
                checkFileStructure();
            }, 3000);
        });
    </script>
</body>
</html>
