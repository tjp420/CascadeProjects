groups:
  - name: hsm-enclave-rotation-alerts
    rules:
      # Alert on any failed hardware-root rotations within a tight epoch window
      - alert: EnclaveRootRotationFailed
        expr: increase(hsm_enclave_rotations_total{status="failure"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
          tier: hardware-security
        annotations:
          summary: "Enclave root rotation failed on host {{ $labels.instance }}"
          description: "An attempt to rotate the multi-enclave hardware root key failed. Critical threshold safety paths are at risk."

      # Alert if master key derivation latency breaches the 2-second safe threshold
      - alert: EnclaveKeyDerivationLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(hsm_enclave_derivation_latency_seconds_bucket[5m])) by (le, instance)) > 2.0
        for: 2m
        labels:
          severity: warning
          tier: hardware-security
        annotations:
          summary: "High key derivation latency on host {{ $labels.instance }}"
          description: "The 95th percentile of enclave master key derivation latency is {{ $value }}s, breaching the 2-second SLA boundary. Investigate CPU throttling or cryptographic engine contention."
