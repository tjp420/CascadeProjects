<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 Merger Tool Functionality Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .test-container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-result {
            margin: 10px 0;
            padding: 15px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .info {
            background-color: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        .warning {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
        }
        .demo-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .btn-demo {
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🔧 Merger Tool Functionality Test</h1>
        <p>Testing the merger tool download and preview functionality...</p>
        
        <div id="test-results"></div>
        
        <div class="demo-section">
            <h3>🚀 Test Merger Tool Functions</h3>
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-primary btn-demo" onclick="testRunAnalysis()">
                    <i class="fas fa-search"></i> Test Run Analysis
                </button>
                <button class="btn btn-success btn-demo" onclick="testViewReports()">
                    <i class="fas fa-file-alt"></i> Test View Reports
                </button>
                <button class="btn btn-info btn-demo" onclick="testOpenInterface()">
                    <i class="fas fa-cog"></i> Test Open Interface
                </button>
                <button class="btn btn-warning btn-demo" onclick="testDownloadAll()">
                    <i class="fas fa-download"></i> Test Download All
                </button>
            </div>
        </div>
        
        <div class="demo-section">
            <h3>📊 Test Report Downloads</h3>
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-outline-primary btn-demo" onclick="testDownloadReport('summary')">
                    <i class="fas fa-download"></i> Download Summary
                </button>
                <button class="btn btn-outline-primary btn-demo" onclick="testDownloadReport('detailed')">
                    <i class="fas fa-download"></i> Download Detailed
                </button>
                <button class="btn btn-outline-primary btn-demo" onclick="testDownloadReport('recommendations')">
                    <i class="fas fa-download"></i> Download Recommendations
                </button>
            </div>
        </div>
        
        <div class="demo-section">
            <h3>👁️ Test Report Previews</h3>
            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-outline-info btn-demo" onclick="testViewReport('summary')">
                    <i class="fas fa-eye"></i> Preview Summary
                </button>
                <button class="btn btn-outline-info btn-demo" onclick="testViewReport('detailed')">
                    <i class="fas fa-eye"></i> Preview Detailed
                </button>
                <button class="btn btn-outline-info btn-demo" onclick="testViewReport('recommendations')">
                    <i class="fas fa-eye"></i> Preview Recommendations
                </button>
            </div>
        </div>
        
        <div class="text-center">
            <button class="btn btn-lg btn-primary" onclick="runAllTests()">🧪 Run All Tests</button>
            <button class="btn btn-lg btn-secondary" onclick="clearResults()">🗑️ Clear Results</button>
        </div>
    </div>
    
    <script>
        // Mock notification system
        function showNotification(message, type) {
            const resultsDiv = document.getElementById('test-results');
            const notification = document.createElement('div');
            notification.className = `test-result ${type}`;
            notification.innerHTML = `<strong>${type.toUpperCase()}:</strong> ${message}`;
            resultsDiv.appendChild(notification);
        }
        
        function addTestResult(message, type) {
            const resultsDiv = document.getElementById('test-results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${type}`;
            resultDiv.innerHTML = message;
            resultsDiv.appendChild(resultDiv);
        }
        
        // Test functions
        function testRunAnalysis() {
            addTestResult('Testing runMergerAnalysis function...', 'info');
            
            try {
                if (typeof runMergerAnalysis === 'function') {
                    runMergerAnalysis();
                    addTestResult('✅ runMergerAnalysis function executed successfully', 'success');
                } else {
                    addTestResult('❌ runMergerAnalysis function not found', 'error');
                }
            } catch (error) {
                addTestResult(`❌ runMergerAnalysis error: ${error.message}`, 'error');
            }
        }
        
        function testViewReports() {
            addTestResult('Testing viewMergerReports function...', 'info');
            
            try {
                if (typeof viewMergerReports === 'function') {
                    viewMergerReports();
                    addTestResult('✅ viewMergerReports function executed successfully', 'success');
                } else {
                    addTestResult('❌ viewMergerReports function not found', 'error');
                }
            } catch (error) {
                addTestResult(`❌ viewMergerReports error: ${error.message}`, 'error');
            }
        }
        
        function testOpenInterface() {
            addTestResult('Testing openMergerInterface function...', 'info');
            
            try {
                if (typeof openMergerInterface === 'function') {
                    openMergerInterface();
                    addTestResult('✅ openMergerInterface function executed successfully', 'success');
                } else {
                    addTestResult('❌ openMergerInterface function not found', 'error');
                }
            } catch (error) {
                addTestResult(`❌ openMergerInterface error: ${error.message}`, 'error');
            }
        }
        
        function testDownloadAll() {
            addTestResult('Testing downloadMergerReports function...', 'info');
            
            try {
                if (typeof downloadMergerReports === 'function') {
                    downloadMergerReports();
                    addTestResult('✅ downloadMergerReports function executed successfully', 'success');
                } else {
                    addTestResult('❌ downloadMergerReports function not found', 'error');
                }
            } catch (error) {
                addTestResult(`❌ downloadMergerReports error: ${error.message}`, 'error');
            }
        }
        
        function testDownloadReport(type) {
            addTestResult(`Testing downloadReport function for ${type}...`, 'info');
            
            try {
                if (typeof downloadReport === 'function') {
                    downloadReport(type);
                    addTestResult(`✅ downloadReport('${type}') function executed successfully`, 'success');
                } else {
                    addTestResult(`❌ downloadReport function not found`, 'error');
                }
            } catch (error) {
                addTestResult(`❌ downloadReport('${type}') error: ${error.message}`, 'error');
            }
        }
        
        function testViewReport(type) {
            addTestResult(`Testing viewReportContent function for ${type}...`, 'info');
            
            try {
                if (typeof viewReportContent === 'function') {
                    viewReportContent(type);
                    addTestResult(`✅ viewReportContent('${type}') function executed successfully`, 'success');
                } else {
                    addTestResult(`❌ viewReportContent function not found`, 'error');
                }
            } catch (error) {
                addTestResult(`❌ viewReportContent('${type}') error: ${error.message}`, 'error');
            }
        }
        
        function runAllTests() {
            addTestResult('🧪 Running all merger tool functionality tests...', 'info');
            
            // Test all functions
            testRunAnalysis();
            setTimeout(() => testViewReports(), 500);
            setTimeout(() => testOpenInterface(), 1000);
            setTimeout(() => testDownloadAll(), 1500);
            setTimeout(() => testDownloadReport('summary'), 2000);
            setTimeout(() => testDownloadReport('detailed'), 2500);
            setTimeout(() => testDownloadReport('recommendations'), 3000);
            setTimeout(() => testViewReport('summary'), 3500);
            setTimeout(() => testViewReport('detailed'), 4000);
            setTimeout(() => testViewReport('recommendations'), 4500);
            
            setTimeout(() => {
                addTestResult('🎉 All tests completed!', 'success');
            }, 5000);
        }
        
        function clearResults() {
            document.getElementById('test-results').innerHTML = '';
            addTestResult('🗑️ Results cleared', 'info');
        }
        
        // Auto-run tests on page load
        window.addEventListener('load', function() {
            setTimeout(() => {
                addTestResult('🔧 Merger Tool Functionality Test Page Loaded', 'info');
                addTestResult('📊 Ready to test all merger tool functions', 'success');
            }, 1000);
        });
    </script>
    
    <!-- Load the merger tool functionality -->
    <script src="merger_tool_functionality.js"></script>
</body>
</html>
