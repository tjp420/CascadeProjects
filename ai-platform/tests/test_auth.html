<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Authentication System Test</h1>
        
        <div class="row">
            <div class="col-md-6">
                <h3>Test Login</h3>
                <form id="testLoginForm">
                    <div class="mb-3">
                        <label for="testEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="testEmail" value="admin@demo.com">
                    </div>
                    <div class="mb-3">
                        <label for="testPassword" class="form-label">Password</label>
                        <input type="password" class="form-control" id="testPassword" value="admin123">
                    </div>
                    <button type="submit" class="btn btn-primary">Test Login</button>
                </form>
                
                <div class="mt-3">
                    <h5>Available Demo Credentials:</h5>
                    <ul>
                        <li>admin@demo.com / admin123</li>
                        <li>analyst@demo.com / analyst123</li>
                        <li>developer@demo.com / dev123</li>
                        <li>viewer@demo.com / view123</li>
                        <li>test@example.com / password123</li>
                    </ul>
                </div>
            </div>
            
            <div class="col-md-6">
                <h3>Auth Status</h3>
                <div id="authStatus" class="alert alert-info">
                    Not logged in
                </div>
                <button id="logoutBtn" class="btn btn-secondary d-none">Logout</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth/auth_manager.js"></script>
    <script>
        // Test the auth system
        document.getElementById('testLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;
            
            try {
                const result = await window.authManager.login(email, password);
                const statusDiv = document.getElementById('authStatus');
                
                if (result.success) {
                    statusDiv.className = 'alert alert-success';
                    statusDiv.innerHTML = `
                        <strong>Login Successful!</strong><br>
                        User: ${result.user.name}<br>
                        Email: ${result.user.email}<br>
                        Role: ${result.user.role}
                    `;
                    document.getElementById('logoutBtn').classList.remove('d-none');
                } else {
                    statusDiv.className = 'alert alert-danger';
                    statusDiv.innerHTML = `<strong>Login Failed:</strong> ${result.error}`;
                }
            } catch (error) {
                document.getElementById('authStatus').className = 'alert alert-danger';
                document.getElementById('authStatus').innerHTML = `<strong>Error:</strong> ${error.message}`;
            }
        });
        
        document.getElementById('logoutBtn').addEventListener('click', () => {
            window.authManager.logout();
            document.getElementById('authStatus').className = 'alert alert-info';
            document.getElementById('authStatus').innerHTML = 'Not logged in';
            document.getElementById('logoutBtn').classList.add('d-none');
        });
    </script>
</body>
</html>
