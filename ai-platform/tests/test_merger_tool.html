<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 Merger Tool Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .test-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-result {
            margin: 10px 0;
            padding: 15px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .info {
            background-color: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🔧 Merger Tool Test</h1>
        <p>Testing the merger tool functionality...</p>
        
        <div id="test-results"></div>
        
        <div class="text-center">
            <button class="btn btn-primary" onclick="testMergerTool()">Test Merger Tool</button>
            <button class="btn btn-success" onclick="testNavigation()">Test Navigation</button>
            <button class="btn btn-info" onclick="testFunctions()">Test Functions</button>
        </div>
    </div>
    
    <script>
        function addTestResult(message, type) {
            const resultsDiv = document.getElementById('test-results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${type}`;
            resultDiv.innerHTML = message;
            resultsDiv.appendChild(resultDiv);
        }
        
        function testMergerTool() {
            addTestResult('Testing merger tool functionality...', 'info');
            
            // Test if merger tool section exists
            if (typeof sectionContent !== 'undefined') {
                if (sectionContent['merger-tool']) {
                    addTestResult('✅ Merger tool section found in content templates', 'success');
                } else {
                    addTestResult('❌ Merger tool section not found in content templates', 'error');
                }
            } else {
                addTestResult('❌ sectionContent not defined', 'error');
            }
            
            // Test if navigation function exists
            if (typeof navigateTo === 'function') {
                addTestResult('✅ navigateTo function exists', 'success');
            } else {
                addTestResult('❌ navigateTo function not found', 'error');
            }
            
            // Test if merger tool functions exist
            const functions = ['runMergerAnalysis', 'viewMergerReports', 'openMergerInterface', 'downloadMergerReports', 'viewReport'];
            functions.forEach(func => {
                if (typeof window[func] === 'function') {
                    addTestResult(`✅ ${func} function exists`, 'success');
                } else {
                    addTestResult(`❌ ${func} function not found`, 'error');
                }
            });
        }
        
        function testNavigation() {
            addTestResult('Testing navigation...', 'info');
            
            // Test navigation to merger tool
            try {
                if (typeof navigateTo === 'function') {
                    navigateTo('merger-tool');
                    addTestResult('✅ Navigation to merger tool executed', 'success');
                } else {
                    addTestResult('❌ navigateTo function not available', 'error');
                }
            } catch (error) {
                addTestResult(`❌ Navigation error: ${error.message}`, 'error');
            }
        }
        
        function testFunctions() {
            addTestResult('Testing merger tool functions...', 'info');
            
            // Test each function
            const functions = [
                { name: 'runMergerAnalysis', func: () => window.runMergerAnalysis() },
                { name: 'viewMergerReports', func: () => window.viewMergerReports() },
                { name: 'openMergerInterface', func: () => window.openMergerInterface() },
                { name: 'downloadMergerReports', func: () => window.downloadMergerReports() },
                { name: 'viewReport', func: () => window.viewReport('summary') }
            ];
            
            functions.forEach(({ name, func }) => {
                try {
                    func();
                    addTestResult(`✅ ${name} function executed`, 'success');
                } catch (error) {
                    addTestResult(`❌ ${name} function error: ${error.message}`, 'error');
                }
            });
        }
        
        // Auto-run tests on page load
        window.addEventListener('load', function() {
            setTimeout(() => {
                testMergerTool();
            }, 1000);
        });
    </script>
</body>
</html>
