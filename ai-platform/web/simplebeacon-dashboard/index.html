  <meta charset="UTF-8">
  <script>
    // Neutralize any Cloudflare beacon / analytics script that may be injected at the edge.
    (function() {
      function isBeacon(el) {
        if (!el || el.tagName !== 'SCRIPT') return false;
        var src = el.src || '';
        var cf = el.getAttribute('data-cf-beacon');
        return src.indexOf('static.cloudflareinsights.com/beacon.min.js') !== -1 || (cf && cf.length > 0);
      }
      function neutralize(el) {
        if (!isBeacon(el)) return;
        if (el.hasAttribute && el.hasAttribute('integrity')) {
          try { el.removeAttribute('src'); } catch (_) {}
          try { el.type = 'text/plain'; } catch (_) {}
        }
        el.removeAttribute('integrity');
        el.removeAttribute('crossorigin');
        var isBrave = typeof navigator.brave !== 'undefined';
        var ua = navigator.userAgent || '';
        if (isBrave || /Brave/.test(ua)) {
          if (el.parentNode) el.parentNode.removeChild(el);
          return;
        }
        el.onerror = function() { if (el.parentNode) el.parentNode.removeChild(el); };
      }
      var origCreate = document.createElement.bind(document);
      document.createElement = function(tag) {
        var el = origCreate(tag);
        if (typeof tag === 'string' && tag.toLowerCase() === 'script') {
          var origSetAttr = el.setAttribute.bind(el);
          el.setAttribute = function(name, value) {
            if (name === 'src' && typeof value === 'string' && value.indexOf('static.cloudflareinsights.com/beacon.min.js') !== -1) {
              try { el.removeAttribute('integrity'); } catch (_) {}
            }
            return origSetAttr(name, value);
          };
        }
        return el;
      };
      if (window.MutationObserver) {
        var mo = new MutationObserver(function(records) {
          records.forEach(function(record) {
            Array.prototype.forEach.call(record.addedNodes || [], function(node) {
              if (node.nodeType === 1) {
                if (node.tagName === 'SCRIPT') neutralize(node);
                if (node.querySelectorAll) {
                  Array.prototype.forEach.call(node.querySelectorAll('script'), neutralize);
                }
              }
            });
          });
        });
        mo.observe(document.documentElement, { childList: true, subtree: true });
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <!-- IDE embed mode detection -->
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var sbParentUrlbar = params.get('sb_parent_urlbar');
      var sbWebsiteMode = params.get('sb_website_mode');
      var isIde = window.self !== window.top || (navigator.userAgent || '').includes('Electron');
      if (sbParentUrlbar === '1') document.documentElement.setAttribute('data-parent-urlbar', '1');
      if (sbWebsiteMode === '1') document.documentElement.setAttribute('data-embed-mode', '1');
      if (isIde) document.documentElement.setAttribute('data-ide-embed', '1');
    })();
  </script>

  <!-- Apply saved theme early to prevent FOUC -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('sb_theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (_) {}
    })();
  </script>

  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #root { min-height: 100vh; }
    html[data-ide-embed="1"], html[data-ide-embed="1"] body {
      height: 100%; min-height: 0; margin: 0; padding: 0; overflow: hidden;
    }
    html[data-ide-embed="1"] #root {
      height: 100% !important; min-height: 0; overflow-y: auto; overflow-x: hidden;
    }
    html[data-parent-urlbar="1"] #root {
      height: 100% !important; min-height: 0; overflow-y: auto; overflow-x: hidden;
    }
  </style>
</head>

  <noscript><div style="padding:40px;text-align:center;"><h2>JavaScript Required</h2><p>SimpleBeacon Dashboard requires JavaScript.</p></div></noscript>

  <!-- Extension bridge fetch rewrite -->
  <script>
    (function() {
      var BRIDGE_PREFIXES = ['/api/simplebeacon/', '/api/notify', '/api/ping', '/api/stream', '/api/free-token'];
      function isBridgeApiPath(path) {
        if (!path || path.indexOf('/api/') !== 0) return false;
        for (var i = 0; i < BRIDGE_PREFIXES.length; i++) {
          var prefix = BRIDGE_PREFIXES[i];
          if (path === prefix.replace(/\/$/, '') || path.indexOf(prefix) === 0) return true;
        }
        return false;
      }
      function bridgeHost() { return window.__SB_BRIDGE_HOST__ || ''; }
      function isHostedSite() {
        return location.protocol === 'https:' || !/^127\.0\.0\.1$|^localhost$/i.test(location.hostname);
      }
      function rewriteBridgeUrl(url) {
        var host = bridgeHost();
        if (!host || typeof url !== 'string') return url;
        if (isHostedSite()) return url;
        try {
          var u = new URL(url, location.href);
          var path = u.pathname + u.search;
          if (isBridgeApiPath(u.pathname)) return host + path;
          var current = location.protocol + '//' + location.host;
          if (url.indexOf(current + '/api/') === 0) {
            var relPath = url.slice(current.length);
            if (isBridgeApiPath(relPath.split('?')[0])) return host + relPath;
          }
        } catch (e) {}
        return url;
      }
      var origFetch = window.fetch;
      if (origFetch) {
        window.fetch = function(input, init) {
          var url = typeof input === 'string' ? input : (input && input.url ? input.url : String(input));
          var rewritten = rewriteBridgeUrl(url);
          if (rewritten !== url) { init = init || {}; if (!init.credentials) init.credentials = 'omit'; }
          return origFetch.call(this, rewritten, init);
        };
      }
      var origXHR = window.XMLHttpRequest;
      if (origXHR) {
        window.XMLHttpRequest = function() {
          var xhr = new origXHR();
          var origOpen = xhr.open;
          xhr.open = function(method, url) { return origOpen.call(this, method, rewriteBridgeUrl(String(url))); };
          return xhr;
        };
        Object.setPrototypeOf(window.XMLHttpRequest, origXHR);
        Object.keys(origXHR).forEach(function(k) { window.XMLHttpRequest[k] = origXHR[k]; });
      }
    })();
  </script>

  <!-- DOMPurify for sanitization -->
