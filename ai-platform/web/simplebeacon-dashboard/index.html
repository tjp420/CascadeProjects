    (function() {
      function detectIdePreview() {
        var ua = (navigator.userAgent || '').toLowerCase();
        var href = (window.location.href || '').toLowerCase();
        var search = (window.location.search || '').toLowerCase();
        var name = (window.name || '').toLowerCase();
        var inIframe = window.self !== window.top;
        var hasVsCodeSignal = /cascade|windsurf|codeium|vscode[-_]?webview|vscode-resource|electron|vscode|__cascade__|__windsurf__|__codeium__/.test(ua);
        var hasVsCodeName = /cascade|windsurf|codeium|vscode[-_]?webview|vscode-resource/.test(name);
        var hasVsCodeSearch = /[?&](__ide=|ide=|extensionid=|extension-id=|vscode-webview|origin=vscode-file)/.test(search);
        var hasVsCodeHref = /vscode-webview|vscode-resource|__ide=|ide=|extensionid=|extension-id=/.test(href);
        var hasVsCodeGlobal = window.__wind_surf__ || window.__windsurf__ || window.__cascade__ || window.__vscode__ || window.__codeium__ || window.__browser_preview__ || window.__browserPreview__ || window.__ide__;
        var hasOpener = window.opener && window.opener !== window;
        try {
          if (window.top && window.top !== window && window.top.location && window.top.location.href) { /* in iframe but top accessible */ }
        } catch (e) { /* cross-origin iframe */ }
        // Strong IDE signals (iframe + vscode indicators, or direct vscode URL/globals)
        if (inIframe && (hasVsCodeSignal || hasVsCodeName || hasVsCodeSearch || hasVsCodeHref || hasVsCodeGlobal)) { return true; }
        if (!inIframe && (hasVsCodeSignal || hasVsCodeName || hasVsCodeSearch || hasVsCodeHref || hasVsCodeGlobal)) { return true; }
        if (typeof acquireVsCodeApi === 'function') { return true; }
        // The dashboard is embedded in an iframe inside the custom IDE panel
        if (inIframe) { return true; }
        return false;
      }
      function setIdePreview() {
        document.documentElement.setAttribute('data-ide-preview', 'true');
        console.info('[Simplebeacon] IDE preview detected: sidebar hidden');
      }
      if (detectIdePreview()) {
        setIdePreview();
      } else {
        try {
          if (localStorage && localStorage.getItem('sb_ide_preview') === '1') {
            setIdePreview();
          }
        } catch (e) {}
        window.addEventListener('message', function(e) {
          if (e && e.data && (e.data.type === 'ide-preview' || e.data.idePreview === true || e.data.command === 'setIdePreview')) {
            setIdePreview();
            try { localStorage.setItem('sb_ide_preview', '1'); } catch (e) {}
          }
        });
        var lateCheck = setInterval(function() {
          if (detectIdePreview()) {
            clearInterval(lateCheck);
            setIdePreview();
          }
        }, 500);
        setTimeout(function() { clearInterval(lateCheck); }, 5000);
        try {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', 'api/simplebeacon/config', true);
          xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
              try {
                var cfg = JSON.parse(xhr.responseText);
                var serverPort = parseInt(cfg && (cfg.dataServerPort || cfg.relayPort || cfg.dataPort), 10);
                var currentPort = parseInt(window.location.port, 10);
              } catch (e) {}
            }
          };
          xhr.send();
        } catch (e) {}
      }
    })();
  </script>

  <script>
    // API proxy: when served from a non-API port (e.g. 57622 static server), redirect /api/* to port 3000
    (function() {
      const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || !location.hostname;
      const apiPorts = ['3000', '8080', '5000'];
      // When the API server itself serves the dashboard it injects window.__SIMPLEBEACON_ENV__
      const needsProxy = isLocal && !apiPorts.includes(location.port) && !window.__SIMPLEBEACON_ENV__;
      const API_HOST = window.__SB_API_HOST__ || (window.__SIMPLEBEACON_ENV__ && window.__SIMPLEBEACON_ENV__.DASHBOARD_BASE_URL) || '';
      function proxyUrl(url) {
        if (!needsProxy) return url;
        try {
          const u = new URL(url, location.href);
          if (u.pathname.startsWith('/api/')) {
            return API_HOST + u.pathname + u.search;
          }
        } catch (e) {}
        return url;
      }

      // Unified fetch wrapper: API proxy + extension noise suppression
      const extPatterns = /free-token|provision sandbox|config\/pricing/i;
      const origFetch = window.fetch;
      const origXHR = window.XMLHttpRequest;

      if (origFetch) {
        window.fetch = function(...args) {
          const url = String(args[0] || '');
          if (extPatterns.test(url)) {
            console.warn('[Simplebeacon] Ignoring browser extension fetch:', url);
            return Promise.resolve(new Response('{}', { status: 200, headers: { 'content-type': 'application/json' } }));
          }
          args[0] = proxyUrl(url);
          return origFetch.apply(this, args);
        };
      }

      if (origXHR) {
        window.XMLHttpRequest = function() {
          const xhr = new origXHR();
          const origOpen = xhr.open;
          xhr.open = function(method, url) {
            const strUrl = String(url);
            if (extPatterns.test(strUrl)) {
              xhr.send = function() {};
              Object.defineProperty(xhr, 'readyState', { get: () => 4 });
              Object.defineProperty(xhr, 'status', { get: () => 200 });
              Object.defineProperty(xhr, 'responseText', { get: () => '{}' });
              setTimeout(() => { if (xhr.onreadystatechange) xhr.onreadystatechange(); }, 0);
              return;
            }
            return origOpen.call(xhr, method, proxyUrl(strUrl));
          };
          return xhr;
        };
        Object.setPrototypeOf(window.XMLHttpRequest, origXHR);
        Object.keys(origXHR).forEach(k => { window.XMLHttpRequest[k] = origXHR[k]; });
      }
    })();
  </script>

    (function() {

      function updateOfflineUi() {
        var isOnline = navigator.onLine;
        while (icon.firstChild) icon.removeChild(icon.firstChild);
        var i = document.createElement('i');
        i.setAttribute('data-lucide', isOnline ? 'wifi' : 'wifi-off');
        i.className = 'icon-16';

        icon.appendChild(i);
        icon.title = isOnline ? 'Online' : 'Offline';
        if (typeof lucide !== 'undefined') lucide.createIcons();
      }
      window.addEventListener('online', updateOfflineUi);

  <script>
    // Dev-only API proxy: activates via injected config or localStorage (no hardcoded URLs)
    (function() {
      var API_HOST = window.__SB_API_HOST__ || '';
      if (!API_HOST && typeof Storage !== 'undefined') {
        try { API_HOST = localStorage.getItem('__sb_api_host') || ''; } catch (e) {}
      }
      if (!API_HOST) return;
      var currentHost = location.protocol + '//' + location.host;
      function rewriteUrl(url) {
        if (typeof url !== 'string') return url;
        if (url.startsWith('/api/')) return API_HOST + url;
        if (url.startsWith('/ws')) return API_HOST.replace('http:', 'ws:') + url;
        if (url.indexOf(currentHost + '/api/') === 0) return API_HOST + url.replace(currentHost, '');
        if (url.indexOf(currentHost + '/ws') === 0) return API_HOST.replace('http:', 'ws:') + url.replace(currentHost, '');
        return url;
      }
      var origFetch = window.fetch;
      if (origFetch) {
        window.fetch = function(input, init) {
          var url = typeof input === 'string' ? input : (input && input.url ? input.url : String(input));
          var rewritten = rewriteUrl(url);
          if (rewritten !== url) {
            init = init || {};
            init.credentials = init.credentials || 'include';
          }
          return origFetch.call(this, rewritten, init);
        };
      }
      var origXHR = window.XMLHttpRequest;
      if (origXHR) {
        window.XMLHttpRequest = function() {
          var xhr = new origXHR();
          var origOpen = xhr.open;
          xhr.open = function(method, url) {
            return origOpen.call(this, method, rewriteUrl(url));
          };
          return xhr;
        };
        Object.setPrototypeOf(window.XMLHttpRequest, origXHR);
        Object.keys(origXHR).forEach(function(k) { window.XMLHttpRequest[k] = origXHR[k]; });
      }
    })();
  </script>

    (function() {

      if (window.__SB_DASHBOARD_APP__) return;

        { id: 'upload', label: 'Upload', icon: '⭳' },

        { id: 'repo-health', label: 'Repo Health', icon: '📈' },
        { id: 'analytics', label: 'Analytics', icon: '📊' },
        { id: 'scan', label: 'Scan', icon: '🔍' },
        { id: 'settings', label: 'Settings', icon: '⚙' }
      ];
      function grid() {
        return '<div class="dashboard-welcome"><div class="icon" style="font-size:120px">&#x1F5FA;</div><h1>SimpleBeacon Dashboard</h1><div class="subtitle">Overview of your codebase health, scan results, and quick actions.</div><div class="dashboard-grid">' +
          items.map(it => '<a href="/dashboard/' + it.id + '" data-view="' + it.id + '"><span class="icon">' + it.icon + '</span><span>' + it.label + '</span></a>').join('') +
          '</div></div>';
      }
      function placeholder(view) {
        const it = items.find(x => x.id === view);
        return '<div class="view-placeholder"><h2>' + (it ? it.icon + ' ' + it.label : view) + '</h2><p>This view is rendered by the fallback SPA. Build the full dashboard assets for the complete experience.</p></div>';
      }
      function htmlToNodes(html) {
        return document.createRange().createContextualFragment(html.trim());
      }
      function render() {
        // Bail out if the real SPA has loaded since we started
        if (window.__SB_DASHBOARD_APP__) return;
        const hash = location.hash.replace(/^#\//, '').split('#')[0] || 'dashboard';
        main.textContent = '';
        if (hash === 'dashboard') {
          main.appendChild(htmlToNodes(grid()));
        } else {
          main.appendChild(htmlToNodes(placeholder(hash)));
        }
        document.querySelectorAll('.nav-link').forEach(function(link) {
          const active = link.getAttribute('data-view') === hash;
          link.classList.toggle('active', active);
        });
      }
      window.addEventListener('hashchange', render);
      render();
    })();
  </script>
