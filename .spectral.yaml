extends:
  - "spectral:oas"

# Minimal overrides for CI-friendly linting: keep default rules but allow some leniency
# Note: spectral:recommended is not a valid built-in ruleset in Spectral CLI v6.
# Valid built-in rulesets: spectral:oas, spectral:asyncapi, spectral:arazzo
rules:
  operation-2xx-response: off
  info-contact: off
  operation-operationId: off
  operation-default-response: off
