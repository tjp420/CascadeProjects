name: 'SimpleBeacon AI Guardrails'
description: 'The AI Circuit Breaker for PRs. Catch security leaks, compliance drift, and rogue logic in AI-generated code.'
author: 'SimpleBeacon.ai'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  token:
    description: 'GitHub token for posting PR comments'
    required: true
    default: ${{ github.token }}
  license-token:
    description: 'Your SimpleBeacon.ai Team License Token (leave blank for free community sandbox mode)'
    required: false
  fail-on:
    description: 'Minimum severity level to trigger a non-zero exit code and block the merge (low, medium, high, critical)'
    required: false
    default: 'high'
  scan-args:
    description: 'Extra arguments passed to simplebeacon scan (default includes --gate --diff)'
    required: false
    default: '--gate --diff'
  base-ref:
    description: 'Git base ref for diff-only scans (defaults to PR base branch)'
    required: false
    default: ''
  full-scan:
    description: 'Set to true to scan the entire repository instead of just the git diff'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install SimpleBeacon
      shell: bash
      run: npm install -g simplebeacon

    - name: Resolve diff base ref
      shell: bash
      run: |
        if [ -n "${{ inputs.base-ref }}" ]; then
          echo "SIMPLEBEACON_BASE_REF=${{ inputs.base-ref }}" >> "$GITHUB_ENV"
        elif [ -n "${{ github.event.pull_request.base.sha }}" ]; then
          echo "SIMPLEBEACON_BASE_REF=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
        elif [ -n "${{ github.event.pull_request.base.ref }}" ]; then
          echo "SIMPLEBEACON_BASE_REF=origin/${{ github.event.pull_request.base.ref }}" >> "$GITHUB_ENV"
        else
          echo "SIMPLEBEACON_BASE_REF=origin/main" >> "$GITHUB_ENV"
        fi
        echo "SIMPLEBEACON_HEAD_REF=${{ github.sha }}" >> "$GITHUB_ENV"

    - name: Run SimpleBeacon Scan
      shell: bash
      env:
        SIMPLEBEACON_LICENSE_TOKEN: ${{ inputs.license-token }}
      run: |
        set -euo pipefail
        SCAN_ARGS="${{ inputs.scan-args }}"
        if [ "${{ inputs.full-scan }}" = "true" ]; then
          SCAN_ARGS="${SCAN_ARGS//--diff/}"
        fi
        npx simplebeacon scan ${SCAN_ARGS} \
          --fail-on "${{ inputs.fail-on }}" \
          --format json \
          --output .simplebeacon/report.json

    - name: Post PR comment
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_HEAD_REF: ${{ github.head_ref }}
      run: |
        REPORT=.simplebeacon/report.json
        if [ ! -f "$REPORT" ]; then
          echo "No report found. Skipping PR comment."
          exit 0
        fi
        npx simplebeacon comment --report "$REPORT" --issue-number "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"

    - name: Annotate changed files
      if: github.event_name == 'pull_request'
      shell: bash
      run: |
        REPORT=.simplebeacon/report.json
        if [ ! -f "$REPORT" ]; then exit 0; fi
        node -e "
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('./$REPORT', 'utf8'));
          const issues = report.rawIssues || report.detectedIssues || report.issues || [];
          const blocking = new Set(['critical','high']);
          for (const issue of issues) {
            const sev = String(issue.severity || 'medium').toLowerCase();
            if (!blocking.has(sev)) continue;
            const file = issue.filePath || issue.file;
            if (!file) continue;
            const line = issue.line || 1;
            const msg = issue.description || issue.message || 'Issue detected';
            const type = sev === 'critical' ? 'error' : 'warning';
            console.log('::' + type + ' file=' + file + ',line=' + line + '::[' + (issue.pattern || issue.type) + '] ' + msg);
          }
        "

    - name: Write job summary
      shell: bash
      run: |
        REPORT=.simplebeacon/report.json
        if [ ! -f "$REPORT" ]; then
          echo "# SimpleBeacon Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "Report not found." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        node -e "
          const fs = require('fs');
          const { formatGithubStepSummary } = require('simplebeacon/src/reporters/github-comment');
          const report = JSON.parse(fs.readFileSync('./$REPORT', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, formatGithubStepSummary(report, report.gate || null));
        "

    - name: Evaluate gate
      shell: bash
      run: |
        REPORT=.simplebeacon/report.json
        if [ ! -f "$REPORT" ]; then
          echo "::error::Report not found. Scan may have failed."
          exit 1
        fi
        node -e "
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('./$REPORT', 'utf8'));
          const gate = report.gate || {};
          const failOn = new Set((gate.failOn || ['high']).map(s => String(s).toLowerCase()));
          const issues = report.rawIssues || report.detectedIssues || report.issues || [];
          let blocking = 0;
          for (const issue of issues) {
            const sev = String(issue.severity || 'medium').toLowerCase();
            if (sev === 'critical' || failOn.has(sev)) blocking++;
          }
          if (gate.pass === false || blocking > 0 || (gate.blockingCount || 0) > 0) {
            const count = gate.blockingCount || blocking;
            console.error('::error::SimpleBeacon gate failed. ' + count + ' blocking issue(s). See PR comment for details.');
            process.exit(1);
          }
          console.log('SimpleBeacon gate passed.');
        "
