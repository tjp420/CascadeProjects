name: 'SimpleBeacon Guardrails'
description: 'AI-generated code hygiene scanner — catch slop, leaks, and hallucinations in every PR'
author: 'SimpleBeacon'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  token:
    description: 'GitHub token for posting PR comments'
    required: true
    default: ${{ github.token }}
  license-token:
    description: 'SimpleBeacon license token (optional, removes free-tier limits)'
    required: false
  fail-on:
    description: 'Fail the check if severity is critical or high'
    required: false
    default: 'high'
  scan-args:
    description: 'Extra arguments to pass to simplebeacon scan'
    required: false
    default: '--gate'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install SimpleBeacon
      shell: bash
      run: npm install -g simplebeacon-cli

    - name: Run SimpleBeacon Scan
      shell: bash
      env:
        SIMPLEBEACON_LICENSE_TOKEN: ${{ inputs.license-token }}
      run: |
        npx simplebeacon scan ${{ inputs.scan-args }} --format json --output .simplebeacon/report.json

    - name: Post PR Comment
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        REPORT=.simplebeacon/report.json
        if [ ! -f "$REPORT" ]; then
          echo "No report found. Skipping PR comment."
          exit 0
        fi
        BLOCKING=$(node -e "const r=require('./$REPORT'); console.log(r.gate?.blockingCount || 0)")
        WARNINGS=$(node -e "const r=require('./$REPORT'); console.log(r.gate?.warningCount || 0)")
        SCORE=$(node -e "const r=require('./$REPORT'); console.log(r.qualityScore || 'N/A')")
        TIER=$(node -e "const r=require('./$REPORT'); console.log(r.tier || 'free')")

        if [ "$BLOCKING" = "0" ] && [ "$WARNINGS" = "0" ]; then
          BODY="## SimpleBeacon Gate Passed

- Quality Score: **$SCORE**
- Blocking issues: 0
- No AI slop detected in this PR.
"
        else
          BODY="## SimpleBeacon Gate Failed

- Quality Score: **$SCORE**
- Blocking issues: **$BLOCKING**
- Warnings: **$WARNINGS**

> Upgrade to [Continuous Shield Team](https://simplebeacon.ai/pricing) for full JSON exports, team dashboard, and CI gate.
"
        fi

        curl -s -X POST \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
          -d "{\"body\":$(echo "$BODY" | jq -R -s .)}"

    - name: Annotate Changed Files
      if: github.event_name == 'pull_request'
      shell: bash
      run: |
        REPORT=.simplebeacon/report.json
        if [ ! -f "$REPORT" ]; then exit 0; fi
        node -e "
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('./$REPORT', 'utf8'));
          const issues = report.issues || report.detectedIssues || [];
          for (const issue of issues) {
            const file = issue.filePath || issue.file;
            const line = issue.line || 1;
            const sev = (issue.severity || 'medium').toLowerCase();
            const msg = issue.description || issue.message || 'Issue detected';
            const type = sev === 'critical' ? 'error' : sev === 'high' ? 'warning' : 'notice';
            console.log('::' + type + ' file=' + file + ',line=' + line + '::[' + issue.pattern + '] ' + msg);
          }
        "

    - name: Write Job Summary
      shell: bash
      run: |
        REPORT=.simplebeacon/report.json
        if [ ! -f "$REPORT" ]; then
          echo "# SimpleBeacon Scan" >> $GITHUB_STEP_SUMMARY
          echo "Report not found." >> $GITHUB_STEP_SUMMARY
          exit 0
        fi
        node -e "
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('./$REPORT', 'utf8'));
          const gate = r.gate || {};
          const score = r.qualityScore || 'N/A';
          const blocking = gate.blockingCount || 0;
          const warnings = gate.warningCount || 0;
          const pass = gate.pass || false;
          const tier = r.tier || 'free';
          const summary = [
            '# 🔦 SimpleBeacon Scan Results',
            '',
            '| Metric | Value |',
            '|--------|-------|',
            '| Gate Status | ' + (pass ? '✅ Pass' : '❌ Fail') + ' |',
            '| Quality Score | ' + score + ' |',
            '| Blocking Issues | ' + blocking + ' |',
            '| Warnings | ' + warnings + ' |',
            '| Tier | ' + tier + ' |',
            ''
          ];
          if (!pass && blocking > 0) {
            summary.push('## Blocking Issues');
            summary.push('');
            const issues = (r.issues || r.detectedIssues || []).filter(i => (i.severity || '').toLowerCase() === 'critical' || (i.severity || '').toLowerCase() === 'high');
            issues.slice(0, 20).forEach(i => {
              const file = i.filePath || i.file || 'unknown';
              const line = i.line || '';
              summary.push('- **' + (i.pattern || i.type) + '** — `' + file + (line ? ':' + line : '') + '`  ');
              summary.push('  ' + (i.description || i.message || ''));
            });
            summary.push('');
          }
          summary.push('---');
          summary.push('> [View full report](https://simplebeacon.ai/audit) · [Team Dashboard](https://simplebeacon.ai/pricing)');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
        "

    - name: Evaluate Gate
      shell: bash
      run: |
        REPORT=.simplebeacon/report.json
        if [ ! -f "$REPORT" ]; then
          echo "::error::Report not found. Scan may have failed."
          exit 1
        fi
        BLOCKING=$(node -e "const r=require('./$REPORT'); console.log(r.gate?.blockingCount || 0)")
        if [ "$BLOCKING" != "0" ]; then
          echo "::error::SimpleBeacon gate failed. $BLOCKING blocking issue(s). See PR comment for details."
          exit 1
        fi
        echo "SimpleBeacon gate passed."
