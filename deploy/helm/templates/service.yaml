apiVersion: v1
kind: Service
metadata:
  name: {{ include "simplebeacon.fullname" . }}-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "simplebeacon.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "simplebeacon.serverSelectorLabels" . | nindent 4 }}
