apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "simplebeacon.fullname" . }}-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "simplebeacon.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "simplebeacon.serverSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "simplebeacon.serverSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- include "simplebeacon.podSecurityContext" . | nindent 8 }}
      containers:
        - name: server
          image: "{{ .Values.image.server.repository }}:{{ .Values.image.server.tag }}"
          imagePullPolicy: {{ .Values.image.server.pullPolicy }}
          securityContext:
            {{- include "simplebeacon.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "simplebeacon.fullname" . }}-config
          resources:
            {{- toYaml .Values.resources.server | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- if .Values.envoy.enabled }}
        - name: envoy
          image: "{{ .Values.image.envoy.repository }}:{{ .Values.image.envoy.tag }}"
          imagePullPolicy: {{ .Values.image.envoy.pullPolicy }}
          securityContext:
            {{- include "simplebeacon.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: envoy-ingress
              containerPort: {{ .Values.envoy.listenerPort }}
              protocol: TCP
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
          resources:
            {{- toYaml .Values.resources.envoy | nindent 12 }}
          command:
            - envoy
            - -c
            - /etc/envoy/envoy.yaml
            - --log-level
            - {{ .Values.envoy.logLevel }}
      {{- end }}
      {{- if .Values.envoy.enabled }}
      volumes:
        - name: envoy-config
          configMap:
            name: {{ include "simplebeacon.fullname" . }}-envoy
      {{- end }}
