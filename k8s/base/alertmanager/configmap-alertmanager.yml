apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    templates:
      - '/etc/alertmanager/alertmanager_templates.tmpl'
      - '/etc/alertmanager/simplebeacon.tmpl'

    route:
      group_by: ['alertname', 'cluster', 'namespace', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'slack-notifications'
      routes:
        - match:
            service: 'simplebeacon-scan'
          receiver: 'simplebeacon-receiver'
    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['cluster', 'instance', 'service']

    receivers:
    - name: 'slack-notifications'
      slack_configs:
      - api_url: 'https://slack.com'
        channel: '#ops-agent-framework'
        send_resolved: true
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'

    - name: 'simplebeacon-receiver'
      slack_configs:
      - api_url: 'https://hooks.slack.com/services/REPLACE/ME'
        channel: '#scan-failures'
        send_resolved: true
        title: '{{ template "simplebeacon.default" . }}'
        text: '{{ template "simplebeacon.default" . }}'

  simplebeacon.tmpl: |
    {{""}}
    {{define "simplebeacon.default"}}
    *Alert:* {{ .CommonLabels.alertname }}
    *Severity:* {{ .CommonLabels.severity }}
    *Summary:* {{ .CommonAnnotations.summary }}
    {{end}}

  alertmanager_templates.tmpl: |
    {{""}}
    {{define "slack.default.title"}}
    [{{ .CommonLabels.severity | upper }}] {{ .CommonLabels.alertname }}
    {{end}}
    {{define "slack.default.text"}}
    {{ range .Alerts }}
    *{{ .Annotations.summary }}* - {{ .Annotations.description }}\n
    {{ end }}
    {{end}}
