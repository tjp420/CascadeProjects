<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simplebeacon AI Platform — Coming Soon</title>
    <style>
        :root {
            --bg-main: #0B0F19;
            --bg-card: #151D30;
            --accent: #2563EB;
            --accent-hover: #1D4ED8;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --border: #1E293B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            background: linear-gradient(145deg, var(--bg-card), #0F1626);
            padding: 48px 32px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .badge {
            display: inline-block;
            background: rgba(37, 99, 235, 0.1);
            color: #60A5FA;
            border: 1px solid rgba(37, 99, 235, 0.2);
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 16px;
            background: linear-gradient(to right, #FFFFFF, #9CA3AF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 440px;
            margin: 0 auto;
        }

        @media (min-width: 480px) {
            form {
                flex-direction: row;
                gap: 8px;
            }
        }

        input[type="email"] {
            flex: 1;
            background: #0B0F19;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="email"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .status-message {
            margin-top: 16px;
            font-size: 14px;
            display: none;
        }

        .status-success {
            color: #34D399;
            display: block;
        }

        .status-error {
            color: #F87171;
            display: block;
        }

        .footer {
            margin-top: 48px;
            font-size: 13px;
            color: rgba(156, 163, 175, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">Platform Security Evolution</span>
        <h1>Simplebeacon AI</h1>
        <p>Next-generation automated continuous security runtime scanning infrastructure. We are currently calibrating our scanning engine rulesets. Join the queue for early sandbox access.</p>
        
        <form id="subscribe-form">
            <input type="email" id="email-input" placeholder="Enter your work email address" required aria-label="Email address">
            <button type="submit">Notify Me</button>
        </form>
        
        <div id="status" class="status-message"></div>
        
        <div class="footer">
            &copy; 2026 Simplebeacon. All rights reserved.
        </div>
    </div>

    <script>
        document.getElementById('subscribe-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const emailInput = document.getElementById('email-input');
            const statusDiv = document.getElementById('status');
            
            statusDiv.className = 'status-message';
            statusDiv.textContent = 'Submitting...';
            statusDiv.style.display = 'block';

            try {
                const response = await fetch('/api/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput.value })
                });

                if (response.ok) {
                    statusDiv.className = 'status-message status-success';
                    statusDiv.textContent = 'Success! You have been added to the early access queue.';
                    emailInput.value = '';
                } else {
                    throw new Error('Subscription failed server validation.');
                }
            } catch (error) {
                statusDiv.className = 'status-message status-error';
                statusDiv.textContent = 'Error subscribing. Please try again later.';
            }
        });
    </script>

</body>
</html>
