# Cloudflare Pages + Workers config for SimpleBeacon marketing site
name = "simplebeacon"
compatibility_date = "2026-07-01"

# Pages build settings
pages_build_output_dir = "./public"

# SPA fallback for /dashboard/* routes is handled by public/_redirects

# Environment variables (set these in Cloudflare Pages dashboard or via wrangler secret)
# NODE_ENV = "production"
# PUBLIC_URL = "https://simplebeacon.ai"
# SIMPLEBEACON_LICENSE_SECRET = "<generate-strong-secret>"
# RESEND_API_KEY = "<resend-api-key>"
# RESEND_FROM = "admin@simplebeacon.ai"
# STRIPE_LINK_* = "<stripe-links>"
