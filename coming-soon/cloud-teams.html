<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Teams — SimpleBeacon Waitlist</title>
  <meta name="description" content="Join the waitlist for SimpleBeacon Cloud Teams.">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .waitlist-wrap { max-width: 520px; margin: 0 auto; padding: 80px 24px; text-align: center; }
    .waitlist-wrap h1 { font-size: 2rem; font-weight: 700; margin-bottom: 12px; }
    .waitlist-wrap p { color: #9CA3AF; margin-bottom: 32px; }
    .waitlist-form { display: flex; flex-direction: column; gap: 12px; max-width: 360px; margin: 0 auto; }
    .waitlist-form input { background: #0B0F19; border: 1px solid #1E293B; color: #F3F4F6; padding: 12px 16px; border-radius: 8px; font-size: 1rem; }
    .waitlist-form button { background: #2563EB; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .back-link { display: inline-block; margin-top: 24px; color: #60A5FA; text-decoration: none; }
  </style>
</head>
<body>
  <div class="waitlist-wrap">
    <h1>Cloud Teams</h1>
    <p>Team scan history, shared dashboards, and organization-wide gates. Coming soon.</p>
    <form class="waitlist-form" onsubmit="event.preventDefault(); alert('Thanks for your interest! We will notify you when Cloud Teams is available.');">
      <input type="email" placeholder="your@email.com" required>
      <button type="submit">Join the Waitlist</button>
    </form>
    <a href="index.html" class="back-link">&larr; Back to home</a>
  </div>
</body>
</html>
