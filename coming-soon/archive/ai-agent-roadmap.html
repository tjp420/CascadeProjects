<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Loading ai-agent roadmap...</title>
  <style>
    body { background: #0f172a; color: #e2e8f0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .loader { width: 48px; height: 48px; border: 3px solid rgba(56,189,248,0.2); border-top-color: #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 24px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #94a3b8; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="loader"></div>
  <p>Loading ai-agent report into roadmap...</p>
  <script>
    fetch('.simplebeacon/ai-agent-report.json')
      .then(r => {
        if (!r.ok) throw new Error('Report not found: ' + r.status);
        return r.json();
      })
      .then(report => {
        const json = JSON.stringify(report);
        const encoded = encodeURIComponent(json).replace(/%([0-9A-F]{2})/g, (_, p) => String.fromCharCode('0x' + p));
        const b64 = btoa(encoded);
        location.replace('/roadmap.html?h=' + Date.now() + '#' + b64);
      })
      .catch(err => {
        document.body.innerHTML = '<p style="color:#ef4444;">Error: ' + err.message + '</p><p>Make sure the server is running on port 3001.</p>';
      });
  </script>
</body>
</html>
