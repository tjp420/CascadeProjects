<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimpleBeacon Report Editor</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    body { background: var(--background); color: var(--text-primary); font-family: var(--font-body); }
    .editor-container { max-width: 960px; margin: 0 auto; padding: 24px; }
    .editor-header { margin-bottom: 24px; }
    .editor-header h1 { margin: 0 0 8px; font-size: 1.5rem; }
    .editor-header p { margin: 0; color: var(--text-muted); font-size: 0.9rem; }
    .file-tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .file-tab { padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; background: var(--surface-elevated); border: 1px solid var(--border); }
    .file-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .editor-panel { display: none; }
    .editor-panel.active { display: block; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--background); color: var(--text-primary); font-family: var(--font-mono); font-size: 0.85rem;
    }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .preview-frame { width: 100%; height: 500px; border: 1px solid var(--border); border-radius: 8px; background: #fff; margin-top: 16px; }
    .action-bar { display: flex; gap: 12px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
    .btn { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-elevated); color: var(--text-primary); cursor: pointer; font-size: 0.85rem; }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-secondary { background: transparent; }
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; margin-left: 8px; }
    .status-ok { background: rgba(46, 164, 79, 0.2); color: #3fb950; }
    .status-warn { background: rgba(210, 153, 34, 0.2); color: #d29922; }
    @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="editor-container">
    <div class="editor-header">
      <h1>Report Credential Editor</h1>
      <p>Edit project credentials before packaging audit reports into ZIP.</p>
    </div>

    <div class="file-tabs">
      <div class="file-tab active" data-target="agency-panel">Agency Certificate</div>
      <div class="file-tab" data-target="executive-panel">Executive Audit</div>
    </div>

    <!-- Agency Certificate Editor -->
    <div id="agency-panel" class="editor-panel active">
      <div class="form-row">
        <div class="form-group">
          <label>Project Name</label>
          <input type="text" id="agency-project-name" value="CascadeProjects">
        </div>
        <div class="form-group">
          <label>Development Agency</label>
          <input type="text" id="agency-dev-agency" value="Agency">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Target Client</label>
          <input type="text" id="agency-client" value="…/CascadeProjects">
        </div>
        <div class="form-group">
          <label>Scan Milestone</label>
          <select id="agency-milestone">
            <option value="Alpha">Alpha</option>
            <option value="Beta">Beta</option>
            <option value="Release" selected>Release</option>
            <option value="Patch">Patch</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Date Generated</label>
          <input type="date" id="agency-date">
        </div>
        <div class="form-group">
          <label>Scan Integrity ID</label>
          <input type="text" id="agency-scan-id" value="sb_auth_a6c54be32af1171d" readonly style="opacity:0.6;">
        </div>
      </div>
      <div class="form-group">
        <label>Quality Score</label>
        <input type="number" id="agency-score" value="100" min="0" max="100">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="agency-status">
          <option value="PASS" selected>PASSED SECURE HYGIENE GATE</option>
          <option value="REVIEW">REVIEW RECOMMENDED</option>
          <option value="FAIL">FAILED HYGIENE GATE</option>
        </select>
      </div>
    </div>

    <!-- Executive Audit Editor -->
    <div id="executive-panel" class="editor-panel">
      <div class="form-row">
        <div class="form-group">
          <label>Project Name</label>
          <input type="text" id="exec-project-name" value="CascadeProjects">
        </div>
        <div class="form-group">
          <label>Assessor Name</label>
          <input type="text" id="exec-assessor" value="SimpleBeacon Operator">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Report Date</label>
          <input type="date" id="exec-date">
        </div>
        <div class="form-group">
          <label>Report ID</label>
          <input type="text" id="exec-report-id" value="SB-AUD-20260614-TEPXFT" readonly style="opacity:0.6;">
        </div>
      </div>
      <div class="form-group">
        <label>Executive Summary</label>
        <textarea id="exec-summary" rows="4" placeholder="Enter executive summary..."></textarea>
      </div>
      <div class="form-group">
        <label>Overall Verdict</label>
        <select id="exec-verdict">
          <option value="READY">READY FOR RELEASE</option>
          <option value="CONDITIONAL">CONDITIONAL — MINOR REVIEW</option>
          <option value="BLOCKED">BLOCKED — CRITICAL ISSUES</option>
        </select>
      </div>
    </div>

    <div class="action-bar">
      <button class="btn btn-primary" id="preview-btn">Preview Changes</button>
      <button class="btn btn-secondary" id="download-individual-btn">Download Individual</button>
      <button class="btn btn-primary" id="package-zip-btn">Package as ZIP</button>
    </div>

    <div id="preview-area" style="margin-top:16px;"></div>
  </div>

  <script src="js/vendor/jszip.min.js"></script>
  <script>
    (function() {
      // Set today's date
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('agency-date').value = today;
      document.getElementById('exec-date').value = today;

      // Tab switching
      document.querySelectorAll('.file-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.file-tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.editor-panel').forEach(p => p.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById(tab.dataset.target).classList.add('active');
        });
      });

      // Load original file content
      let agencyHtml = '';
      let executiveHtml = '';

      async function loadFiles() {
        try {
          // Note: These paths are for the temp files. In practice, user would select them.
          // For now, we'll create the modified versions from templates.
          agencyHtml = localStorage.getItem('sb-agency-certificate-template') || '';
          executiveHtml = localStorage.getItem('sb-executive-audit-template') || '';
        } catch(e) {}
      }
      loadFiles();

      function buildAgencyCertificate() {
        const statusMap = {
          'PASS': { text: 'PASSED SECURE HYGIENE GATE', class: 'status-pass', color: '#15803D', bg: '#DCFCE7', border: '#BBF7D0' },
          'REVIEW': { text: 'REVIEW RECOMMENDED', class: 'status-review', color: '#B45309', bg: '#FEF3C7', border: '#FDE68A' },
          'FAIL': { text: 'FAILED HYGIENE GATE', class: 'status-fail', color: '#DC2626', bg: '#FEE2E2', border: '#FECACA' }
        };
        const s = statusMap[document.getElementById('agency-status').value];
        const date = document.getElementById('agency-date').value;
        const formattedDate = date ? new Date(date).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : 'June 14, 2026';

        return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Hygiene Certificate — ${escapeHtml(document.getElementById('agency-project-name').value)}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    @page { size: A4; margin: 16mm; }
    body { font-family: 'Inter', sans-serif; color: #1F2937; margin: 0; padding: 0; background: #fff; }
    .page { page-break-after: always; padding: 8mm 0; }
    .page:last-child { page-break-after: auto; }
    .header-table { width: 100%; border-collapse: collapse; margin-bottom: 28px; }
    .agency-logo { text-align: left; vertical-align: middle; }
    .agency-logo img { max-height: 50px; max-width: 220px; }
    .logo-fallback { font-weight: 700; font-size: 18px; color: #2563EB; }
    .badge-logo { text-align: right; vertical-align: middle; }
    .badge-logo img { max-height: 42px; }
    .divider { height: 4px; background: #2563EB; margin-bottom: 24px; border-radius: 2px; }
    .title { font-size: 28px; font-weight: 800; text-transform: uppercase; letter-spacing: -0.5px; margin: 0 0 8px; }
    .subtitle { color: #6B7280; font-size: 14px; margin: 0 0 28px; }
    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; background: #F9FAFB; padding: 18px; border-radius: 8px; border: 1px solid #E5E7EB; }
    .meta-grid strong { display: inline-block; min-width: 130px; color: #374151; }
    .status-box { text-align: center; padding: 24px; border-radius: 12px; font-weight: 700; font-size: 22px; margin: 20px 0; background: ${s.bg}; color: ${s.color}; border: 1px solid ${s.border}; }
    .muted { color: #6B7280; font-size: 14px; line-height: 1.6; }
    .section-title { font-size: 18px; font-weight: 700; margin: 0 0 12px; color: #111827; }
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
    .summary-card { background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 8px; padding: 14px; }
    .summary-card strong { display: block; font-size: 22px; color: #111827; }
    .findings { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 12px; }
    .findings th, .findings td { border: 1px solid #E5E7EB; padding: 8px; text-align: left; vertical-align: top; }
    .findings th { background: #F3F4F6; }
    .findings code { font-size: 11px; word-break: break-all; }
    .rec-list { padding-left: 18px; line-height: 1.7; }
    .value-block { margin-top: 28px; padding: 20px; border-left: 4px solid #2563EB; background: #FAFAFA; }
    .print-hint { margin-top: 24px; font-size: 12px; color: #9CA3AF; }
    @media print { .print-hint { display: none; } }
  </style>
</head>
<body>
  <section class="page">
    <table class="header-table"><tr>
      <td class="agency-logo"><div class="logo-fallback">${escapeHtml(document.getElementById('agency-dev-agency').value)}</div></td>
      <td class="badge-logo"><img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxODAiIGhlaWdodD0iNDAiIHZpZXdCb3g9IjAgMCAxODAgNDAiPjxyZWN0IHdpZHRoPSIxODAiIGhlaWdodD0iNDAiIHJ4PSI4IiBmaWxsPSIjMTExODI3Ii8+PHRleHQgeD0iMTAiIHk9IjI2IiBmaWxsPSIjNTg2NkZmIiBmb250LWZhbWlseT0iSW50ZXIsIHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiIGZvbnQtd2VpZ2h0PSI3MDAiPlNpbXBsZUJlYWNvbjwvdGV4dD48dGV4dCB4PSIxMTAiIHk9IjI2IiBmaWxsPSIjOUI5QTA0IiBmb250LWZhbWlseT0iSW50ZXIsIHNhbnMtc2VyaXYiIGZvbnQtc2l6ZT0iOSI+VkVSSUZJRUQ8L3RleHQ+PC9zdmc+" alt="SimpleBeacon Verified" /></td>
    </tr></table>
    <div class="divider"></div>
    <h1 class="title">Code Hygiene Certificate</h1>
    <p class="subtitle">Independent Code Quality &amp; Asset Integrity Assessment</p>
    <div class="meta-grid">
      <div>
        <div><strong>Project Name:</strong> ${escapeHtml(document.getElementById('agency-project-name').value)}</div>
        <div><strong>Development Agency:</strong> ${escapeHtml(document.getElementById('agency-dev-agency').value)}</div>
        <div><strong>Target Client:</strong> ${escapeHtml(document.getElementById('agency-client').value)}</div>
      </div>
      <div>
        <div><strong>Scan Milestone:</strong> ${escapeHtml(document.getElementById('agency-milestone').value)}</div>
        <div><strong>Date Generated:</strong> ${formattedDate}</div>
        <div><strong>Scan Integrity ID:</strong> ${escapeHtml(document.getElementById('agency-scan-id').value)}</div>
      </div>
    </div>
    <div class="status-box">Status: ${s.text}</div>
    <p class="muted">This codebase was evaluated via the SimpleBeacon read-only static analysis framework. Protocols check credential patterns, production-path configuration leaks, and structural AI-fiction anomalies. Quality score: <strong>${document.getElementById('agency-score').value}</strong> · Issues at gate: <strong>0</strong>.</p>
    <p class="print-hint">Print this page (Ctrl+P / Cmd+P) → Save as PDF · Recommended filename: <code>sb_cert_${document.getElementById('agency-scan-id').value.replace('sb_auth_', '')}.pdf</code></p>
  </section>

  <section class="page">
    <div class="divider"></div>
    <h2 class="section-title">Security &amp; Hygiene Scan Results</h2>
    <p class="muted">${escapeHtml(document.getElementById('agency-client').value)} — ${escapeHtml(document.getElementById('agency-project-name').value)}</p>
    <div class="summary-grid">
      <div class="summary-card"><span>Credential patterns</span><strong>0</strong><span class="muted">Max: none</span></div>
      <div class="summary-card"><span>Production data leaks</span><strong>0</strong><span class="muted">Max: none</span></div>
      <div class="summary-card"><span>AI fiction / mock KPI</span><strong>0</strong><span class="muted">Max: none</span></div>
    </div>
    <p class="muted">No blocking findings at configured gate severities.</p>
    <h3 class="section-title" style="margin-top:28px">Recommendations</h3>
    <ol class="rec-list"><li>Maintain current gate configuration through Beta and Release milestones.</li></ol>
  </section>

  <section class="page">
    <div class="divider"></div>
    <div class="value-block">
      <h2 class="section-title">Why this matters for ${escapeHtml(document.getElementById('agency-client').value)}</h2>
      <ul class="rec-list">
        <li>Verified read-only scan — application source was not modified.</li>
        <li>Credential and sample-path checks completed before client-facing launch.</li>
        <li>AI-assisted development hygiene documented for vendor and procurement reviews.</li>
      </ul>
      <p class="muted" style="margin-top:16px">Agency: ${escapeHtml(document.getElementById('agency-dev-agency').value)}</p>
      <p class="muted">SimpleBeacon verification · Certificate ${escapeHtml(document.getElementById('agency-scan-id').value)} · https://simplebeacon.ai/verify/${escapeHtml(document.getElementById('agency-scan-id').value)}</p>
    </div>
  </section>
</body>
</html>`;
      }

      function buildExecutiveAudit() {
        const date = document.getElementById('exec-date').value;
        const formattedDate = date ? new Date(date).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : 'June 14, 2026';
        const verdict = document.getElementById('exec-verdict').value;
        const verdictLabels = { 'READY': 'READY FOR RELEASE', 'CONDITIONAL': 'CONDITIONAL — MINOR REVIEW', 'BLOCKED': 'BLOCKED — CRITICAL ISSUES' };

        return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d1117">
  <title>Pre-Launch Code Audit — ${escapeHtml(document.getElementById('exec-project-name').value)}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    @page { margin: 14mm 16mm; background: #0d1117; }
    :root { color-scheme: dark; --bg: #0d1117; --bg-elevated: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --pass: #3fb950; --warn: #d29922; --blocked: #f85149; }
    body { font-family: "Inter", sans-serif; color: var(--text); margin: 0; background: var(--bg); font-size: 11pt; line-height: 1.55; }
    .cover-page { min-height: 100vh; padding: 48px 52px 40px; page-break-after: always; }
    .cover-kicker { letter-spacing: 0.14em; text-transform: uppercase; font-size: 10pt; color: var(--muted); margin: 0 0 12px; }
    .cover-title { font-size: 34pt; line-height: 1.12; margin: 0 0 16px; font-weight: 700; }
    .cover-sub { font-size: 13pt; color: #c9d1d9; max-width: 640px; margin: 0 0 28px; }
    .cover-meta { font-size: 10pt; color: var(--muted); line-height: 1.7; }
    .badge { display: inline-block; padding: 6px 14px; border-radius: 999px; font-size: 10pt; font-weight: 700; border: 1px solid var(--border); }
    .badge-pass { background: rgba(63, 185, 80, 0.14); color: var(--pass); }
    .badge-warn { background: rgba(210, 153, 34, 0.14); color: var(--warn); }
    .badge-blocked { background: rgba(248, 81, 73, 0.14); color: var(--blocked); }
    .confidential { margin-top: 48px; font-size: 9pt; color: #6e7681; border-top: 1px solid #21262d; padding-top: 16px; }
    main { padding: 36px 52px 48px; max-width: 920px; margin: 0 auto; }
    .verdict-card { border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; background: var(--bg-elevated); }
    .verdict-card.ready { border-left: 5px solid var(--pass); }
    .verdict-card.conditional { border-left: 5px solid var(--warn); }
    .verdict-card.blocked { border-left: 5px solid var(--blocked); }
  </style>
</head>
<body>
  <div class="cover-page">
    <p class="cover-kicker">Pre-Launch Security Audit</p>
    <h1 class="cover-title">${escapeHtml(document.getElementById('exec-project-name').value)}</h1>
    <p class="cover-sub">Executive audit report generated by SimpleBeacon static analysis.</p>
    <div class="cover-meta">
      <strong>Assessor:</strong> ${escapeHtml(document.getElementById('exec-assessor').value)}<br>
      <strong>Date:</strong> ${formattedDate}<br>
      <strong>Report ID:</strong> ${escapeHtml(document.getElementById('exec-report-id').value)}
    </div>
    <div style="margin-top:32px;">
      <span class="badge ${verdict === 'READY' ? 'badge-pass' : verdict === 'CONDITIONAL' ? 'badge-warn' : 'badge-blocked'}">${verdictLabels[verdict]}</span>
    </div>
    <p class="confidential">CONFIDENTIAL — Internal review only. Distribution restricted to authorized stakeholders.</p>
  </div>
  <main>
    <h2>Executive Summary</h2>
    <p>${escapeHtml(document.getElementById('exec-summary').value) || 'No summary provided.'}</p>
  </main>
</body>
</html>`;
      }

      function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      // Preview
      document.getElementById('preview-btn').addEventListener('click', () => {
        const activePanel = document.querySelector('.editor-panel.active');
        const isAgency = activePanel.id === 'agency-panel';
        const html = isAgency ? buildAgencyCertificate() : buildExecutiveAudit();
        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const preview = document.createElement('iframe');
        preview.className = 'preview-frame';
        preview.src = url;
        const area = document.getElementById('preview-area');
        area.innerHTML = '';
        area.appendChild(preview);
      });

      // Download individual
      document.getElementById('download-individual-btn').addEventListener('click', () => {
        const activePanel = document.querySelector('.editor-panel.active');
        const isAgency = activePanel.id === 'agency-panel';
        const html = isAgency ? buildAgencyCertificate() : buildExecutiveAudit();
        const filename = isAgency ? 'agency-certificate.html' : 'executive-audit.html';
        const blob = new Blob([html], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
      });

      // Package ZIP
      document.getElementById('package-zip-btn').addEventListener('click', async () => {
        if (typeof JSZip === 'undefined') {
          alert('JSZip not loaded. Please refresh and try again.');
          return;
        }
        const zip = new JSZip();
        zip.file('agency-certificate.html', buildAgencyCertificate());
        zip.file('executive-audit.html', buildExecutiveAudit());
        const blob = await zip.generateAsync({ type: 'blob' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'simplebeacon-audit-package.zip';
        a.click();
      });
    })();
  </script>
</body>
</html>
