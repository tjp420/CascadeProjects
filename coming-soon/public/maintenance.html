<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="favicon.svg" type="image/svg+xml" />
        <title>SimpleBeacon — Maintenance</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                background: #0f172a;
                color: #e2e8f0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                text-align: center;
                padding: 2rem;
            }
            .icon {
                font-size: 4rem;
                margin-bottom: 1.5rem;
            }
            h1 {
                font-size: 2rem;
                font-weight: 600;
                margin-bottom: 0.75rem;
                color: #f8fafc;
            }
            p {
                font-size: 1.1rem;
                color: #94a3b8;
                max-width: 480px;
                line-height: 1.6;
                margin-bottom: 2rem;
            }
            .contact {
                font-size: 0.9rem;
                color: #64748b;
            }
            .contact a {
                color: #38bdf8;
                text-decoration: none;
            }
            .contact a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="icon">🔧</div>
        <h1>Under Maintenance</h1>
        <p>We're upgrading our infrastructure. The scanner will be back shortly.</p>
        <div class="contact">
            Need help? Contact <a href="mailto:support@simplebeacon.ai">support@simplebeacon.ai</a>
        </div>
    </body>
</html>
