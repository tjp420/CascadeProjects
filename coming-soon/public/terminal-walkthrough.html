<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>SimpleBeacon — Interactive Terminal Walkthrough</title>
<style>
  :root {
    --bg: #0d1117;
    --fg: #c9d1d9;
    --panel: #161b22;
    --border: #30363d;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --blue: #58a6ff;
    --purple: #a371f7;
    --gray: #8b949e;
    --font: 'SF Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 12px 20px;
  }
  h1 {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 8px;
    text-align: center;
  }
  .subtitle {
    color: var(--gray);
    margin-bottom: 32px;
    text-align: center;
    max-width: 520px;
  }
  .terminal {
    width: 100%;
    max-width: 760px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .term-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: var(--red); }
  .dot.y { background: var(--yellow); }
  .dot.g { background: var(--green); }
  .term-title { flex: 1; text-align: center; color: var(--gray); font-size: 12px; }
  .term-body {
    padding: 16px;
    min-height: 420px;
    position: relative;
  }
  .line { white-space: pre-wrap; word-break: break-word; }
  .cursor {
    display: inline-block;
    width: 8px;
    height: 18px;
    background: var(--fg);
    animation: blink 1s step-end infinite;
    vertical-align: middle;
    margin-left: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .prompt { color: var(--green); }
  .cmd { color: var(--fg); }
  .info { color: var(--blue); }
  .warn { color: var(--yellow); }
  .err { color: var(--red); }
  .ok { color: var(--green); }
  .dim { color: var(--gray); }
  .finding {
    border-left: 3px solid var(--yellow);
    padding-left: 10px;
    margin: 4px 0;
  }
  .finding.critical { border-left-color: var(--red); }
  .finding.high { border-left-color: var(--red); }
  .finding.medium { border-left-color: var(--yellow); }
  .finding.low { border-left-color: var(--blue); }
  .progress {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0;
  }
  .bar {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--green);
    width: 0%;
    transition: width 0.3s ease;
  }
  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .badge.red { background: rgba(248,81,73,0.15); color: var(--red); }
  .badge.yel { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .badge.grn { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge.blu { background: rgba(88,166,255,0.15); color: var(--blue); }

  .controls {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    padding: 10px 20px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    color: var(--fg);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover { border-color: var(--green); color: var(--green); }
  .btn.primary { background: var(--green); color: var(--bg); border-color: var(--green); font-weight: 600; }
  .btn.primary:hover { opacity: 0.9; color: var(--bg); }

  .skip-hint {
    color: var(--gray);
    font-size: 11px;
    margin-top: 12px;
    text-align: center;
  }

  /* Speed toggle */
  .speed-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    justify-content: center;
  }
  .speed-label { font-size: 11px; color: var(--gray); }
  .speed-opt {
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .speed-opt.active { border-color: var(--green); color: var(--green); }

  @media (max-width: 600px) {
    .terminal { border-radius: 0; border-left: none; border-right: none; }
    body { padding: 20px 0; }
  }
</style>
</head>
<body>

<div class="terminal">
  <div class="term-header">
    <div class="dot r"></div>
    <div class="dot y"></div>
    <div class="dot g"></div>
    <div class="term-title">simplebeacon — scan simulation</div>
  </div>
  <div class="term-body" id="termBody"></div>
</div>

<div class="controls">
  <button class="btn primary" id="startBtn">Run Simulation</button>
  <button class="btn" id="resetBtn" style="display:none;">Restart</button>
</div>

<div class="speed-bar">
  <span class="speed-label">Speed:</span>
  <span class="speed-opt active" data-ms="40">Normal</span>
  <span class="speed-opt" data-ms="10">Fast</span>
  <span class="speed-opt" data-ms="1">Instant</span>
</div>

<p class="skip-hint">Or <a href="#" id="skipLink" style="color:var(--blue)">skip to results</a></p>

<script>
const term = document.getElementById('termBody');
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');
const skipLink = document.getElementById('skipLink');

let typeSpeed = 40;
let running = false;
let cancelled = false;

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function appendLine(html, className='') {
  const div = document.createElement('div');
  div.className = 'line ' + className;
  div.innerHTML = html;
  term.appendChild(div);
  term.scrollTop = term.scrollHeight;
}

function appendRaw(html) {
  const div = document.createElement('div');
  div.className = 'line';
  div.innerHTML = html;
  term.appendChild(div);
  term.scrollTop = term.scrollHeight;
}

async function typeLine(text, className='') {
  const div = document.createElement('div');
  div.className = 'line ' + className;
  term.appendChild(div);
  for (let i = 0; i < text.length; i++) {
    if (cancelled) return;
    div.textContent += text[i];
    term.scrollTop = term.scrollHeight;
    await sleep(typeSpeed);
  }
}

async function typeHTML(html, delay=0) {
  const div = document.createElement('div');
  div.className = 'line';
  div.innerHTML = html;
  term.appendChild(div);
  term.scrollTop = term.scrollHeight;
  if (delay > 0) await sleep(delay);
}

const SCENARIOS = [
  {
    cmd: 'npx simplebeacon scan --gate',
    files: 347,
    findings: [
      { sev: 'high',  type: 'Credential Pattern', file: 'src/config/prod.js', line: 14, msg: 'Stripe live key sk_live_... detected in source' },
      { sev: 'high',  type: 'Hallucinated Import', file: 'src/utils/ai-helpers.js', line: 3, msg: "import { magicParser } from 'npm-magic-parser-99' — not in package.json" },
      { sev: 'medium', type: 'AI Slop / Boilerplate', file: 'src/services/api.ts', line: 22, msg: 'Identical JSDoc block found in 8 other files' },
      { sev: 'medium', type: 'Placeholder Secret', file: 'src/auth/token.ts', line: 7, msg: "const API_KEY = 'your-api-key-here'" },
      { sev: 'low',   type: 'Generic Error Swallowing', file: 'src/handlers/error.js', line: 45, msg: 'catch(e){ /* TODO */ } — error silently dropped' },
      { sev: 'low',   type: 'Unused Variable', file: 'src/components/Dashboard.tsx', line: 12, msg: 'xyz_var declared but never used (AI hallucination pattern)' },
    ]
  },
  {
    cmd: 'npx simplebeacon scan --profile minimal',
    files: 347,
    findings: [
      { sev: 'high', type: 'Credential Pattern', file: 'server/config.env', line: 3, msg: 'AWS access key AKIA... detected' },
      { sev: 'high', type: 'Credential Pattern', file: 'docker-compose.yml', line: 18, msg: 'Database password in plaintext' },
    ]
  },
  {
    cmd: 'npx simplebeacon scan --complete --gate',
    files: 1247,
    findings: [
      { sev: 'critical', type: 'Production Leak', file: 'public/js/analytics.js', line: 1, msg: 'Mixpanel token sent to unknown domain' },
      { sev: 'high', type: 'EU AI Act Indicator', file: 'src/ai/generate.js', line: 8, msg: 'Generative AI system without transparency notice' },
      { sev: 'high', type: 'Architecture Drift', file: 'src/legacy/v1-api.js', line: 200, msg: '500-line function violates service boundary' },
      { sev: 'medium', type: 'Token Bleed', file: 'src/auth/oauth.ts', line: 34, msg: 'OAuth refresh token logged to console' },
      { sev: 'medium', type: 'Copyleft Contamination', file: 'src/lib/helpers.js', line: 12, msg: 'GPL-licensed code found in proprietary repo' },
    ]
  }
];

let scenarioIndex = 0;

async function runScenario(idx) {
  const s = SCENARIOS[idx];
  cancelled = false;
  term.innerHTML = '';
  running = true;
  startBtn.style.display = 'none';
  resetBtn.style.display = 'none';

  // Command
  appendRaw('<span class="prompt">$ </span>');
  await typeLine(s.cmd, 'cmd');
  await sleep(400);

  // Banner
  await typeHTML('<span class="ok">SimpleBeacon</span> <span class="dim">v3.0.22</span>');
  await sleep(200);
  await typeLine('Scanning...', 'dim');
  await sleep(300);

  // Progress bar
  const barId = 'pb-' + Date.now();
  appendRaw(`<div class="progress"><span class="dim">Analyzing files...</span><div class="bar"><div class="bar-fill" id="${barId}" style="width:0%"></div></div></div>`);
  for (let p = 0; p <= 100; p += 10) {
    if (cancelled) return;
    document.getElementById(barId).style.width = p + '%';
    await sleep(typeSpeed < 20 ? 30 : 120);
  }
  await sleep(200);

  // Stats
  appendLine(`<span class="ok">Gate rules checked:</span> <span class="dim">${s.files} files</span>`);
  appendLine(`<span class="ok">Mock/sample files:</span> <span class="dim">${Math.floor(s.files * 0.08)}</span>`);
  await sleep(300);

  // Findings header
  appendLine(`<span class="warn">Issues found: ${s.findings.length}</span>`);
  await sleep(200);

  // Findings
  for (const f of s.findings) {
    if (cancelled) return;
    const badge = f.sev === 'critical' ? '<span class="badge red">CRITICAL</span>' :
                  f.sev === 'high' ? '<span class="badge red">HIGH</span>' :
                  f.sev === 'medium' ? '<span class="badge yel">MEDIUM</span>' :
                  '<span class="badge blu">LOW</span>';
    appendRaw(`<div class="finding ${f.sev}">${badge} <span class="warn">${f.type}</span> <span class="dim">— ${f.file}:${f.line}</span><br><span class="dim">${f.msg}</span></div>`);
    await sleep(typeSpeed < 20 ? 200 : 600);
  }

  // Gate result
  const hasBlocking = s.findings.some(f => f.sev === 'high' || f.sev === 'critical');
  await sleep(300);
  if (hasBlocking) {
    appendLine('<span class="err">Gate: FAIL</span> — blocking issues found');
    appendLine('<span class="dim">Run `npx simplebeacon ai-plan` to generate remediation steps</span>');
  } else {
    appendLine('<span class="ok">Gate: PASS</span>');
  }

  // Quality score
  const score = Math.max(0, 100 - (s.findings.filter(f => f.sev === 'high' || f.sev === 'critical').length * 12) - (s.findings.filter(f => f.sev === 'medium').length * 4));
  appendLine(`<span class="dim">Quality Score: ${score}/100</span>`);

  // Cursor
  appendRaw('<span class="prompt">$ </span><span class="cursor"></span>');

  running = false;
  resetBtn.style.display = 'inline-block';
}

async function showResultsInstant(idx) {
  cancelled = true;
  await sleep(50);
  const s = SCENARIOS[idx];
  term.innerHTML = '';

  appendLine('<span class="prompt">$ </span><span class="cmd">' + s.cmd + '</span>');
  appendLine('<span class="ok">SimpleBeacon</span> <span class="dim">v3.0.22</span>');
  appendLine('<span class="dim">Scanning... Analyzing files... Done.</span>');
  appendLine(`<span class="ok">Gate rules checked:</span> <span class="dim">${s.files} files</span>`);
  appendLine(`<span class="warn">Issues found: ${s.findings.length}</span>`);

  for (const f of s.findings) {
    const badge = f.sev === 'critical' ? '<span class="badge red">CRITICAL</span>' :
                  f.sev === 'high' ? '<span class="badge red">HIGH</span>' :
                  f.sev === 'medium' ? '<span class="badge yel">MEDIUM</span>' :
                  '<span class="badge blu">LOW</span>';
    appendRaw(`<div class="finding ${f.sev}">${badge} <span class="warn">${f.type}</span> <span class="dim">— ${f.file}:${f.line}</span><br><span class="dim">${f.msg}</span></div>`);
  }

  const hasBlocking = s.findings.some(f => f.sev === 'high' || f.sev === 'critical');
  if (hasBlocking) {
    appendLine('<span class="err">Gate: FAIL</span> — blocking issues found');
  } else {
    appendLine('<span class="ok">Gate: PASS</span>');
  }
  const score = Math.max(0, 100 - (s.findings.filter(f => f.sev === 'high' || f.sev === 'critical').length * 12) - (s.findings.filter(f => f.sev === 'medium').length * 4));
  appendLine(`<span class="dim">Quality Score: ${score}/100</span>`);
  appendRaw('<span class="prompt">$ </span><span class="cursor"></span>');

  resetBtn.style.display = 'inline-block';
  startBtn.style.display = 'none';
}

startBtn.addEventListener('click', () => {
  scenarioIndex = (scenarioIndex + 1) % SCENARIOS.length;
  runScenario(scenarioIndex);
});

resetBtn.addEventListener('click', () => {
  scenarioIndex = (scenarioIndex + 1) % SCENARIOS.length;
  runScenario(scenarioIndex);
});

skipLink.addEventListener('click', (e) => {
  e.preventDefault();
  showResultsInstant(scenarioIndex);
});

document.querySelectorAll('.speed-opt').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.speed-opt').forEach(o => o.classList.remove('active'));
    el.classList.add('active');
    typeSpeed = parseInt(el.dataset.ms);
  });
});

// Auto-start first scenario on load
window.addEventListener('DOMContentLoaded', () => {
  runScenario(0);
});
</script>

</body>
</html>
