version: '3.8'
services:
  integration:
    image: node:22
    working_dir: /workspace
    volumes:
      - ./:/workspace:cached
      - ./.container_node_modules:/workspace/node_modules
    environment:
      - NODE_ENV=development
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=integration
      - PGPASSWORD=integration_pass
      - PGDATABASE=nexus_dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: bash -lc "if [ -f .ci/run-integration.sh ]; then bash .ci/run-integration.sh; else echo 'No integration script found'; fi"
    # Expose common ports used by tests (adjust as needed)
    ports:
      - "3000:3000"
      - "9229:9229"

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: integration_pass
      POSTGRES_DB: nexus_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
    driver: local
