[package]
name = "simplebeacon-scan-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Cascade AI Platform Team"]
description = "Streaming local file analyzer for the SimpleBeacon browser scan worker"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
