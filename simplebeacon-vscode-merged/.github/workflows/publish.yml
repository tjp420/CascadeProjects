name: Build, Package and Publish VSIX

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  build-package:
    name: Build and Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
        working-directory: ./

      - name: Compile extension
        run: npm run compile
        working-directory: ./simplebeacon-vscode-merged

      - name: Run tests
        run: npm test --silent || true
        working-directory: ./simplebeacon-vscode-merged

      - name: Package VSIX
        run: npx -y @vscode/vsce package -o simplebeacon.vsix
        working-directory: ./simplebeacon-vscode-merged

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: simplebeacon-vsix
          path: simplebeacon-vscode-merged/simplebeacon.vsix

  publish:
    name: Publish to Marketplace
    needs: build-package
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: simplebeacon-vsix
          path: ./

      - name: Publish extension (requires VSCE_PAT secret)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT secret missing — skipping publish.";
            exit 0;
          fi
          npx -y @vscode/vsce publish --packagePath ./simplebeacon.vsix --pat "$VSCE_PAT"
