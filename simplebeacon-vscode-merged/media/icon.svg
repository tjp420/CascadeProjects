<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Central glow behind cluster -->
  <circle cx="64" cy="60" r="42" fill="url(#glow)"/>

  <!-- Connection lines (thin, wireframe feel) -->
  <g stroke="#334155" stroke-width="1.2" opacity="0.7">
    <line x1="64" y1="60" x2="46" y2="40"/>
    <line x1="64" y1="60" x2="82" y2="40"/>
    <line x1="64" y1="60" x2="88" y2="58"/>
    <line x1="64" y1="60" x2="78" y2="78"/>
    <line x1="64" y1="60" x2="50" y2="78"/>
    <line x1="64" y1="60" x2="36" y2="54"/>
    <line x1="46" y1="40" x2="82" y2="40"/>
    <line x1="82" y1="40" x2="88" y2="58"/>
    <line x1="88" y1="58" x2="78" y2="78"/>
    <line x1="78" y1="78" x2="50" y2="78"/>
    <line x1="50" y1="78" x2="36" y2="54"/>
    <line x1="36" y1="54" x2="46" y2="40"/>
    <line x1="82" y1="40" x2="78" y2="78"/>
    <line x1="46" y1="40" x2="50" y2="78"/>
  </g>

  <!-- Outer peripheral nodes (smaller) -->
  <circle cx="46" cy="40" r="5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="82" cy="40" r="5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="88" cy="58" r="5" fill="#3b82f6" opacity="0.85"/>
  <circle cx="78" cy="78" r="5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="50" cy="78" r="5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="36" cy="54" r="5" fill="#3b82f6" opacity="0.85"/>

  <!-- Central hub (larger, brighter) -->
  <circle cx="64" cy="60" r="10" fill="#fbbf24"/>
  <circle cx="64" cy="60" r="6" fill="#fde047"/>

  <!-- Top-right blue accent node with glow -->
  <circle cx="90" cy="36" r="5" fill="#3b82f6"/>
  <circle cx="90" cy="36" r="10" fill="url(#blueGlow)"/>
  <line x1="82" y1="40" x2="90" y2="36" stroke="#334155" stroke-width="1.2" opacity="0.7"/>

  <!-- Bottom-left yellow accent node with glow -->
  <circle cx="30" cy="82" r="5" fill="#f59e0b"/>
  <circle cx="30" cy="82" r="10" fill="url(#glow)"/>
  <line x1="36" y1="54" x2="30" y2="82" stroke="#334155" stroke-width="1.2" opacity="0.7"/>
  <line x1="50" y1="78" x2="30" y2="82" stroke="#334155" stroke-width="1.2" opacity="0.7"/>

  <!-- Small detail nodes -->
  <circle cx="72" cy="30" r="3" fill="#fde047" opacity="0.7"/>
  <line x1="72" y1="30" x2="82" y2="40" stroke="#334155" stroke-width="1" opacity="0.5"/>
  <circle cx="96" cy="68" r="3" fill="#60a5fa" opacity="0.7"/>
  <line x1="96" y1="68" x2="88" y2="58" stroke="#334155" stroke-width="1" opacity="0.5"/>
</svg>
