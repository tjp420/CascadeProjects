databases:
  - name: simplebeacon-db
    plan: free
    databaseName: simplebeacon
    user: simplebeacon_user

services:
  - type: web
    name: simplebeacon
    runtime: node
    plan: free
    buildCommand: npm install --include=dev; npm run build --workspace=ai-platform
    startCommand: node ai-platform/simplebeacon-server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: simplebeacon-db
          property: connectionString
      - key: ENABLE_DATABASE
        value: "true"
      - key: ENABLE_DB_AUTO_MIGRATE
        value: "true"
      - key: SIMPLEBEACON_LICENSE_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGIN
        value: "https://simplebeacon.ai,https://simplebeacon.onrender.com"
      - key: PUBLIC_URL
        value: "https://simplebeacon.ai"
      - key: PUBLIC_APP_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_TEAMS_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ID_TEAMS_ANNUAL
        sync: false
      - key: STRIPE_PRICE_ID_EXECUTIVE_CLEARANCE
        sync: false
      - key: STRIPE_PRICE_ID_INSTANT_REPORT
        sync: false
      - key: STRIPE_PRICE_ID_EU_AI_ACT_SPRINT
        sync: false
      - key: STRIPE_PRICE_ID_CONTINUOUS_SHIELD
        sync: false
      - key: STRIPE_PRICE_ID_RUNTIME_SHIELD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: admin@simplebeacon.ai
      - key: SMTP_HOST
        value: "smtp.zohocloud.ca"
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: admin@simplebeacon.ai
      - key: CONTACT_NOTIFY_EMAIL
        value: admin@simplebeacon.ai
      - key: SUPPORT_EMAIL
        value: support@simplebeacon.ai
      - key: DISPUTE_ALERT_EMAIL
        value: billing@simplebeacon.ai
      - key: SUPER_ADMIN_EMAIL
        value: admin@simplebeacon.ai
      - key: SECURITY_EMAIL
        value: security@simplebeacon.ai
      - key: BILLING_EMAIL
        value: billing@simplebeacon.ai
      - key: HELLO_EMAIL
        value: hello@simplebeacon.ai
      - key: NO_REPLY_EMAIL
        value: no-reply@simplebeacon.ai
      - key: ADMIN_NOTIFY_EMAIL
        value: admin@simplebeacon.ai
      - key: SIMPLEBEACON_IMPROVEMENT_REPORT_ENABLED
        value: "true"
      - key: SIMPLEBEACON_APP_URL
        sync: false
      - key: SIMPLEBEACON_LANDING
        value: "true"
      - key: REQUIRE_AUTH
        value: "true"
      - key: SEED_DEMO_USERS
        value: "false"
      - key: ALLOW_LEGACY_LOGIN
        value: "false"
      - key: SIMPLEBEACON_ALLOW_PUBLIC_REGISTRATION
        value: "true"
      - key: SIMPLEBEACON_REGISTRATION_AUTO_ACTIVATE
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CF_BEACON_TOKEN
        sync: false
    healthCheckPath: /health
