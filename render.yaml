services:
  - type: web
    name: simplebeacon
    runtime: node
    plan: free
    buildCommand: npm install --include=dev; npm run build
    startCommand: node ai-platform/simplebeacon-server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: SIMPLEBEACON_LICENSE_SECRET
        generateValue: true
      - key: ALLOWED_ORIGIN
        value: "https://simplebeacon.ai,https://simplebeacon.onrender.com"
      - key: PUBLIC_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_TEAMS_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ID_TEAMS_ANNUAL
        sync: false
      - key: STRIPE_PRICE_ID_EXECUTIVE_CLEARANCE
        sync: false
      - key: STRIPE_PRICE_ID_INSTANT_REPORT
        sync: false
      - key: STRIPE_PRICE_ID_EU_AI_ACT_SPRINT
        sync: false
      - key: STRIPE_PRICE_ID_CONTINUOUS_SHIELD
        sync: false
      - key: STRIPE_PRICE_ID_RUNTIME_SHIELD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: certificates@simplebeacon.ai
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: certificates@simplebeacon.ai
      - key: SIMPLEBEACON_APP_URL
        sync: false
      - key: SIMPLEBEACON_LANDING
        value: "false"
      - key: REQUIRE_AUTH
        value: "true"
      - key: SEED_DEMO_USERS
        value: "false"
      - key: ALLOW_LEGACY_LOGIN
        value: "false"
    healthCheckPath: /health
