# SimpleBeacon Enterprise Docker Compose Stack
# Air-gapped, zero-trust deployment for corporate and defense clients.
#
# Architecture:
#   - simplebeacon-engine: Node.js API + React dashboard (port 3000)
#   - simplebeacon-ollama: Local LLM inference with pre-baked models (port 11434)
#   - simplebeacon-db: PostgreSQL for persistent registrations, tokens, telemetry
#
# CPU mode (default):
#   docker compose -f docker-compose.enterprise.yml up -d
#
# GPU mode (NVIDIA):
#   docker compose -f docker-compose.enterprise.yml -f docker-compose.enterprise.gpu.yml up -d
#
# Air-gapped deployment:
#   See hydrate-airgap.sh for packaging and deployment instructions.

services:
  # ── Application Service ──────────────────────────────────────────────────
  simplebeacon-engine:
    build:
      context: .
      dockerfile: Dockerfile.enterprise
    image: simplebeacon-engine:latest
    container_name: simplebeacon-engine
    restart: unless-stopped
    ports:
      - "${ENGINE_PORT:-3000}:3000"
    environment:
      # ── Runtime ──────────────────────────────────────────────────────────
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: info
      # ── Database (host is internal Docker DNS, not a real production host) ─
      ENABLE_DATABASE: "true"
      ENABLE_DB_AUTO_MIGRATE: "true"
      # ── Security & Auth ──────────────────────────────────────────────────
      REQUIRE_AUTH: "true"
      SEED_DEMO_USERS: "false"
      ALLOW_LEGACY_LOGIN: "false"
      # ── LLM / Ollama ─────────────────────────────────────────────────────
      OLLAMA_BASE_URL: http://simplebeacon-ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-unbreakable-oracle:latest}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_TIMEOUT_MS: "120000"
      SIMPLEBEACON_OFFLINE: "true"
      # ── Report Signing ───────────────────────────────────────────────────
      REPORT_SIGNING_KEY_ID: "1"
      # ── Feature Flags ────────────────────────────────────────────────────
      SIMPLEBEACON_LANDING: "true"
      SIMPLEBEACON_ALLOW_PUBLIC_REGISTRATION: "true"
      SIMPLEBEACON_REGISTRATION_AUTO_ACTIVATE: "true"
      SIMPLEBEACON_ENABLE_DEMO_REPORT: "false"
      ENABLE_EXTERNAL_APIS: "false"
      SIMPLEBEACON_IMPROVEMENT_REPORT_ENABLED: "true"
      # ── CORS ─────────────────────────────────────────────────────────────
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN:-http://localhost:3000}"
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:3000}"
      # ── Email (optional — set in .env.enterprise for outbound email) ─────
      RESEND_FROM: ${RESEND_FROM:-admin@simplebeacon.ai}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_FROM: ${SMTP_FROM:-admin@simplebeacon.ai}
      CONTACT_NOTIFY_EMAIL: ${CONTACT_NOTIFY_EMAIL:-admin@simplebeacon.ai}
    # ── Secrets loaded from .env.enterprise (not inline) ───────────────────
    env_file:
      - path: ${ENV_FILE:-.env.enterprise}
        required: false
    volumes:
      # Persistent storage for scan reports, processed data, and telemetry
      - engine-data:/app/data
      - engine-reports:/app/ai-platform/processed_reports
      - engine-archive:/app/ai-platform/processed_archive
      # Incoming user data (for auto-processor file watching)
      - engine-incoming:/app/ai-platform/incoming_user_data
    depends_on:
      simplebeacon-db:
        condition: service_healthy
      simplebeacon-ollama:
        condition: service_started
    networks:
      - simplebeacon-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── Intelligence Service (Ollama) ────────────────────────────────────────
  simplebeacon-ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    image: simplebeacon-ollama:latest
    container_name: simplebeacon-ollama
    restart: unless-stopped
    environment:
      # Signal to init-models.sh that this is an air-gapped deployment —
      # skip ollama pull attempts for base models (they're pre-loaded in the volume)
      SIMPLEBEACON_OFFLINE: "true"
      # ── Memory Budget Profile ─────────────────────────────────────────────
      # Selects quantization and context window based on available hardware.
      # Run scripts/detect-hardware-profile.sh to auto-detect the best profile.
      # Profiles: minimal (CPU-only, 8GB RAM) | balanced (16GB RAM, 6GB VRAM) | maximum (32GB RAM, 12GB VRAM)
      OLLAMA_MEMORY_PROFILE: ${OLLAMA_MEMORY_PROFILE:-balanced}
      # ── GPU Offload ───────────────────────────────────────────────────────
      # Number of transformer layers to offload to GPU.
      # -1 = auto-detect (Ollama offloads as many as fit in VRAM)
      #  0 = CPU only (for machines without a GPU)
      #  999 = maximum GPU offload (force all layers to GPU)
      OLLAMA_NUM_GPU: ${OLLAMA_NUM_GPU:--1}
      # ── Context Window ────────────────────────────────────────────────────
      # Override the per-model num_ctx from Modelfiles.
      # Reduce for constrained hardware (2048 for minimal, 4096 for balanced, 8192+ for maximum).
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      # ── Inference Tuning ──────────────────────────────────────────────────
      # Number of CPU threads for prompt processing (auto-detected if unset)
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-0}
      # Use FP16 KV cache (halves VRAM vs FP32, no quality loss)
      OLLAMA_F16_KV: "true"
      # Keep model memory-mapped (faster startup, lower RSS)
      OLLAMA_USE_MMAP: "true"
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      # Persistent model storage — survives container restarts
      - ollama-models:/root/.ollama
    networks:
      - simplebeacon-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:11434/api/tags > /dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  # ── Database Service (PostgreSQL) ────────────────────────────────────────
  simplebeacon-db:
    image: postgres:16-alpine
    container_name: simplebeacon-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: simplebeacon
      POSTGRES_USER: simplebeacon_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simplebeacon_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Persistent database storage
      - db-data:/var/lib/postgresql/data
    networks:
      - simplebeacon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplebeacon_user -d simplebeacon"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

# ── Named Volumes ──────────────────────────────────────────────────────────
volumes:
  engine-data:
    driver: local
  engine-reports:
    driver: local
  engine-archive:
    driver: local
  engine-incoming:
    driver: local
  ollama-models:
    driver: local
  db-data:
    driver: local

# ── Network ────────────────────────────────────────────────────────────────
networks:
  simplebeacon-net:
    driver: bridge
