apiVersion: v1
kind: Secret
metadata:
  name: agent-capabilities-secret
type: Opaque
stringData:
  # METRICS_AUTH_TOKEN - bearer token for /metrics and /capabilities
  METRICS_AUTH_TOKEN: supersecret
  # Optional TLS cert/key (PEM) if you want the container to run HTTPS directly.
  # Mount cert.pem and key.pem into /etc/simplebeacon/tls/ via sealed-secrets or external secret store.
  # Do not commit real PEM material; inject at deploy time.
