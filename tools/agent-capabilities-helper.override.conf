# systemd drop-in override for agent-capabilities-helper.service
# Install as /etc/systemd/system/agent-capabilities-helper.service.d/override.conf
[Service]
User=svc_simplebeacon
TimeoutStartSec=120
TimeoutStopSec=30
Restart=on-failure
RestartSec=5s
EnvironmentFile=/etc/simplebeacon/agent.env
# Optional: set UMask or working dir if needed
UMask=0027
