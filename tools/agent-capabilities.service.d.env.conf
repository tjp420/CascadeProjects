# systemd drop-in snippet for agent-capabilities.service
# Save as /etc/systemd/system/agent-capabilities.service.d/env.conf
[Service]
EnvironmentFile=/etc/simplebeacon/agent.env

# Example /etc/simplebeacon/agent.env contents (do NOT commit this file):
# AGENT_CAPABILITIES_PORT=3007
# METRICS_AUTH_TOKEN=supersecret
# AGENT_CAPABILITIES_TLS_CERT=/etc/simplebeacon/tls/cert.pem
# AGENT_CAPABILITIES_TLS_KEY=/etc/simplebeacon/tls/key.pem
# If using PFX (Windows style), set AGENT_CAPABILITIES_TLS_PFX and optionally AGENT_CAPABILITIES_TLS_PFX_PASS
